# SpiceDB client (ADR 18): официального Rust SDK нет, поэтому stubs
# authzed.api.v1 генерируются теми же remote plugins, что и transport контекста.
# Генерируются только CheckPermission, WriteRelationships и ReadRelationships
# вместе с зависимостями.
version: v2
plugins:
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: gen
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: gen
    opt:
      - no_server
inputs:
  - module: buf.build/authzed/api:v1.57.0
    types:
      - authzed.api.v1.PermissionsService.CheckPermission
      - authzed.api.v1.PermissionsService.WriteRelationships
      - authzed.api.v1.PermissionsService.ReadRelationships
