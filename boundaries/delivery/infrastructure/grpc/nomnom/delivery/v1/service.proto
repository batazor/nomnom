syntax = "proto3";

package nomnom.delivery.v1;

import "google/protobuf/timestamp.proto";
import "nomnom/delivery/v1/delivery.proto";

service DeliveryService {
  // Courier view of its work: current status and the assigned or picked up
  // Delivery. Requires courier#act; an unregistered courier
  // is NOT_FOUND.
  rpc GetCourierCurrentDelivery(GetCourierCurrentDeliveryRequest) returns (GetCourierCurrentDeliveryResponse);
  // Courier of the Delivery of an order for whoever may view the order
  // (order#view, FR-626): set while the Delivery is assigned, picked up or
  // delivered, empty before an Assignment and after a failure or a
  // cancellation. An order without a Delivery answers empty too.
  rpc GetOrderCourier(GetOrderCourierRequest) returns (GetOrderCourierResponse);

  // Command RPCs of the Order Fulfillment Workflow of orders, idempotent by order_id.
  rpc CreateDelivery(CreateDeliveryRequest) returns (CreateDeliveryResponse);
  rpc ReplanDelivery(ReplanDeliveryRequest) returns (ReplanDeliveryResponse);
  rpc CancelDelivery(CancelDeliveryRequest) returns (CancelDeliveryResponse);

  // Courier Pool of the platform (FR-301, FR-619, FR-621): all require
  // platform#manage_couriers (operator or dispatcher). RegisterCourier needs a
  // name of 1..64 characters after trim (INVALID_ARGUMENT otherwise); a known
  // id, retired or not, is ALREADY_EXISTS. RetireCourier takes a courier off
  // line out of the pool for good: available or busy is FAILED_PRECONDITION,
  // a repeat succeeds with changed = false. GetCourierPool returns the load
  // and every courier that is not retired. Every courier, offer and Delivery
  // write pushes courierPoolChanged (ADR 36).
  rpc RegisterCourier(RegisterCourierRequest) returns (RegisterCourierResponse);
  rpc RetireCourier(RetireCourierRequest) returns (RetireCourierResponse);
  rpc GetCourierPool(GetCourierPoolRequest) returns (GetCourierPoolResponse);

  // Courier RPCs: the subject needs courier#act on courier_id; the domain
  // rejects actions on a delivery or offer of another courier.
  // UpdateCourierLocation and SetCourierAvailability are also allowed with
  // platform#manage_couriers (FR-620): a dispatcher places and lines up any
  // courier; a retired courier cannot become available (FAILED_PRECONDITION).
  rpc UpdateCourierLocation(UpdateCourierLocationRequest) returns (UpdateCourierLocationResponse);
  rpc SetCourierAvailability(SetCourierAvailabilityRequest) returns (SetCourierAvailabilityResponse);
  rpc ListAvailableDeliveryOffers(ListAvailableDeliveryOffersRequest) returns (ListAvailableDeliveryOffersResponse);
  rpc AcceptDeliveryOffer(AcceptDeliveryOfferRequest) returns (AcceptDeliveryOfferResponse);
  rpc RejectDeliveryOffer(RejectDeliveryOfferRequest) returns (RejectDeliveryOfferResponse);
  rpc ConfirmPickup(ConfirmPickupRequest) returns (ConfirmPickupResponse);
  rpc ConfirmDelivery(ConfirmDeliveryRequest) returns (ConfirmDeliveryResponse);
  // The assigned courier (courier#act) or a dispatcher (platform dispatch_delivery).
  rpc ReportDeliveryFailure(ReportDeliveryFailureRequest) returns (ReportDeliveryFailureResponse);

  // Demo Simulator of couriers (FR-604): requires platform#operate_simulator.
  rpc GetSimulator(GetSimulatorRequest) returns (GetSimulatorResponse);
  rpc SetSimulatorEnabled(SetSimulatorEnabledRequest) returns (SetSimulatorEnabledResponse);
}

message GetOrderCourierRequest {
  string order_id = 1;
}

message GetOrderCourierResponse {
  // Empty without a courier.
  string courier_id = 1;
  string name = 2;
}

message GetCourierCurrentDeliveryRequest {
  string courier_id = 1;
}

message GetCourierCurrentDeliveryResponse {
  // Unset when the courier has no assigned or picked up Delivery.
  Delivery delivery = 1;
  CourierStatus courier_status = 2;
}

message CreateDeliveryRequest {
  string order_id = 1;
  // Pickup and dropoff addresses are dropped from the project.
  reserved 2, 3;
  reserved "pickup_address", "dropoff_address";
  // Required (ADR 41): Market of the Order.
  string market_id = 4;
}

message CreateDeliveryResponse {
  string delivery_id = 1;
  // false when an identical earlier request already created it.
  bool created = 2;
}

message ReplanDeliveryRequest {
  string order_id = 1;
}

message ReplanDeliveryResponse {
  string delivery_id = 1;
  // Courier offered the Delivery by this replan; empty when no candidate was found.
  string offered_courier_id = 2;
}

message CancelDeliveryRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelDeliveryResponse {
  string delivery_id = 1;
  // true when the Delivery is cancelled, including a repeated cancellation.
  bool cancelled = 2;
  // Business reason when cancellation is rejected by state, for example already_picked_up.
  string rejection_reason = 3;
}

message RegisterCourierRequest {
  // User id of the courier: that user gets courier#act on courier:<courier_id>.
  string courier_id = 1;
  // Shown on the flow board and to the customer of the courier's order.
  string name = 2;
  // Required (ADR 41): Market the courier works in; immutable.
  string market_id = 3;
}

message RegisterCourierResponse {
  string courier_id = 1;
  CourierStatus status = 2;
  string name = 3;
}

message RetireCourierRequest {
  string courier_id = 1;
}

message RetireCourierResponse {
  string courier_id = 1;
  // false when the courier had already retired.
  bool changed = 2;
}

message GetCourierPoolRequest {
  // Required (ADR 41): the Courier Pool of this Market.
  string market_id = 1;
}

// Courier of the Courier Pool.
message PoolCourier {
  string courier_id = 1;
  string name = 2;
  CourierStatus status = 3;
  // Pending, not yet expired Delivery Offer; empty without one.
  string pending_offer_id = 4;
  // Assigned or picked up Delivery; empty without one.
  string active_delivery_id = 5;
  // Order of the active Delivery; empty without one.
  string active_order_id = 6;
  // Order of the pending offer; empty without one.
  string offered_order_id = 7;
}

message GetCourierPoolResponse {
  // Couriers that are not retired.
  int64 size = 1;
  // Available and busy couriers.
  int64 on_line = 2;
  int64 busy = 3;
  // Deliveries waiting for a courier: the backlog of the pool.
  int64 waiting = 4;
  // By name, then by id.
  repeated PoolCourier couriers = 5;
}

message UpdateCourierLocationRequest {
  string courier_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message UpdateCourierLocationResponse {
  string courier_id = 1;
  double latitude = 2;
  double longitude = 3;
  // Time delivery recorded the position at.
  int64 recorded_at_epoch_seconds = 4;
}

message SetCourierAvailabilityRequest {
  string courier_id = 1;
  CourierAvailability availability = 2;
}

message SetCourierAvailabilityResponse {
  string courier_id = 1;
  CourierStatus status = 2;
  // false when the requested availability was already in effect.
  bool changed = 3;
}

message ListAvailableDeliveryOffersRequest {
  string courier_id = 1;
}

message ListAvailableDeliveryOffersResponse {
  string courier_id = 1;
  repeated DeliveryOffer offers = 2;
}

message AcceptDeliveryOfferRequest {
  string offer_id = 1;
  string courier_id = 2;
  // Когда курьер рассчитывает забрать заказ (FR-610); не задан — срока нет.
  google.protobuf.Timestamp expected_pickup_at = 3;
}

message AcceptDeliveryOfferResponse {
  string offer_id = 1;
  string delivery_id = 2;
  string courier_id = 3;
  // true when the same courier had already accepted this offer.
  bool already_accepted = 4;
}

message RejectDeliveryOfferRequest {
  string offer_id = 1;
  string courier_id = 2;
}

message RejectDeliveryOfferResponse {
  string offer_id = 1;
  string delivery_id = 2;
  // false when the same courier had already rejected this offer.
  bool changed = 3;
}

message ConfirmPickupRequest {
  string delivery_id = 1;
  string courier_id = 2;
  // Когда курьер рассчитывает вручить заказ (FR-610); не задан — срока нет.
  google.protobuf.Timestamp expected_delivered_at = 3;
}

message ConfirmPickupResponse {
  string delivery_id = 1;
  DeliveryState state = 2;
  // false when the same courier had already confirmed the Pickup.
  bool changed = 3;
}

message ConfirmDeliveryRequest {
  string delivery_id = 1;
  string courier_id = 2;
}

message ConfirmDeliveryResponse {
  string delivery_id = 1;
  DeliveryState state = 2;
  // false when the same courier had already confirmed the completion.
  bool changed = 3;
}

message ReportDeliveryFailureRequest {
  string delivery_id = 1;
  // The assigned courier reporting on its own assignment; empty when an
  // authorized dispatcher reports.
  string courier_id = 2;
  // Code of the Delivery Failure Reason catalog, for example customer_unreachable.
  string reason = 3;
  // Optional free text; empty means no detail.
  string detail = 4;
}

message ReportDeliveryFailureResponse {
  string delivery_id = 1;
  // Catalog code of the recorded reason.
  string reason = 2;
  string detail = 3;
  // Courier whose assignment the failure ended.
  string released_courier_id = 4;
}

message GetSimulatorRequest {}

message GetSimulatorResponse {
  bool enabled = 1;
}

message SetSimulatorEnabledRequest {
  bool enabled = 1;
}

message SetSimulatorEnabledResponse {
  bool enabled = 1;
}
