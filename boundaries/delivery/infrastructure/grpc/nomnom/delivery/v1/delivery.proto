syntax = "proto3";

package nomnom.delivery.v1;

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_SEARCHING_COURIER = 1;
  DELIVERY_STATE_ASSIGNED = 2;
  DELIVERY_STATE_PICKED_UP = 3;
  DELIVERY_STATE_COMPLETED = 4;
  DELIVERY_STATE_FAILED = 5;
  DELIVERY_STATE_CANCELLED = 6;
}

message Delivery {
  string delivery_id = 1;
  string order_id = 2;
  string courier_id = 3;
  DeliveryState state = 4;
}

enum CourierStatus {
  COURIER_STATUS_UNSPECIFIED = 0;
  COURIER_STATUS_AVAILABLE = 1;
  COURIER_STATUS_BUSY = 2;
  COURIER_STATUS_UNAVAILABLE = 3;
}

// Availability a courier asks for; busy is set by an assignment only.
enum CourierAvailability {
  COURIER_AVAILABILITY_UNSPECIFIED = 0;
  COURIER_AVAILABILITY_AVAILABLE = 1;
  COURIER_AVAILABILITY_UNAVAILABLE = 2;
}

// Pending, not yet expired Delivery Offer addressed to a courier.
message DeliveryOffer {
  string offer_id = 1;
  string delivery_id = 2;
  string pickup_address = 3;
  string dropoff_address = 4;
  int64 expires_at_epoch_seconds = 5;
}
