syntax = "proto3";

package nomnom.delivery.v1;

import "google/protobuf/timestamp.proto";

// Integration Events стрима delivery.v1.delivery-events (ADR 25, ADR 28).
// Envelope (event_id, event_type, occurred_at, aggregate_*) передаётся в Kafka
// headers; event_type — полное имя сообщения ниже, partition key — aggregate_id
// Delivery.

// Курьер назначен на Delivery (Courier Assignment).
message CourierAssignedToDelivery {
  string order_id = 1;
  string delivery_id = 2;
  string courier_id = 3;
  // Срок Pickup, названный курьером при принятии оффера; пусто — не назван (FR-610).
  google.protobuf.Timestamp expected_pickup_at = 4;
}

// Курьер забрал заказ (Pickup).
message DeliveryPickedUp {
  string order_id = 1;
  string delivery_id = 2;
  // Срок вручения, названный курьером при Pickup; пусто — не назван (FR-610).
  google.protobuf.Timestamp expected_delivered_at = 3;
}

// Delivery завершена (Delivery Completion).
message DeliveryCompleted {
  string order_id = 1;
  string delivery_id = 2;
}

// Delivery не удалась по бизнес-причине.
message DeliveryFailed {
  string order_id = 1;
  string delivery_id = 2;
  // Код каталога Delivery Failure Reason: customer_unreachable,
  // address_not_found, no_access, customer_refused, order_damaged,
  // courier_incident, other. Набор закрыт и может расширяться новыми кодами;
  // потребитель должен трактовать неизвестный код как other. До каталога поле
  // содержало свободный текст.
  string reason = 3;
  // Необязательное пояснение в свободной форме (нормализованные пробелы, не
  // длиннее 500 символов); пусто, если не указано. Не метка метрик и не
  // основание для бизнес-решений.
  string detail = 4;
}

// Курьер снят с Delivery без замены (Courier Reassignment); Delivery вернулась
// в поиск курьера. Доменной причины снятия нет.
message CourierUnassignedFromDelivery {
  string order_id = 1;
  string delivery_id = 2;
  string courier_id = 3;
}

// Delivery отменена до Pickup (Cancel Delivery); назначенный курьер, если был,
// освобождён. reason пуст, если причина не указана.
message DeliveryCancelled {
  string order_id = 1;
  string delivery_id = 2;
  string reason = 3;
}
