[server]
port = 8083

[management]
# Технический порт с /health/startup, /health/live и /health/ready.
port = 9083

[shutdown]
# Ожидание распространения not ready до остановки приёма работы.
readiness_delay = "5s"
drain_timeout = "20s"

[identity]
# Service identity (ADR 27). Пока issuer, audience или jwks_file пусты, все gRPC-вызовы
# отклоняются UNAUTHENTICATED. Переменные: IDENTITY__ISSUER, IDENTITY__AUDIENCE,
# IDENTITY__JWKS_FILE, IDENTITY__SERVICE_ACCOUNTS.
issuer = ""
audience = "nomnom.delivery"
jwks_file = ""
# Allowlist "namespace/serviceaccount=service-name" через запятую.
service_accounts = ""
# User assertions BFF (ADR 32): принимаются, только если заданы все три значения, иначе
# вызов с x-nomnom-user-assertion отклоняется UNAUTHENTICATED. Переменные:
# IDENTITY__USER_ISSUER, IDENTITY__USER_JWKS_FILE, IDENTITY__USER_DELEGATES.
user_issuer = ""
user_jwks_file = ""
# Services через запятую, которым разрешено передавать user subject, например "bff".
user_delegates = ""

[spicedb]
# Авторизация в SpiceDB (ADR 18). Пустой endpoint — локальная авторизация процесса с
# предупреждением. При заданном endpoint preshared_key обязателен. Переменные:
# SPICEDB__ENDPOINT, SPICEDB__PRESHARED_KEY, SPICEDB__INSECURE, SPICEDB__TIMEOUT.
endpoint = ""
# Не храните ключ в файле окружения: задавайте SPICEDB__PRESHARED_KEY из Secret.
preshared_key = ""
# true — plaintext без TLS, только для kind и локального запуска.
insecure = false
# Deadline одного CheckPermission; ошибка или timeout — отказ (fail closed).
timeout = "2s"

[reconciler]
# Фоновая сверка relationships courier#self и delivery#courier с business state
# процесса (FR-445). Переменные: RECONCILER__INTERVAL, RECONCILER__GRACE,
# RECONCILER__PAGE_SIZE. Первый проход — через 10s после старта.
interval = "5m"
# Orphan/stale связь удаляется, только если она была orphan на двух проходах с
# интервалом не меньше grace.
grace = "10m"
# Размер страницы ReadRelationships (1..1000).
page_size = 500

[offers]
# Фоновое истечение Delivery Offers основного процесса (Expire Delivery Offers): pending
# offers с прошедшим expires_at закрываются как expired. Переменные:
# OFFERS__EXPIRY_INTERVAL, OFFERS__EXPIRY_BATCH. Невалидные значения завершают startup.
expiry_interval = "15s"
# Максимум offers одной пачки (1..1000); полные пачки читаются подряд.
expiry_batch = 100
# Dispatch Deliveries: ожидающим доставкам без pending offer предлагается курьер,
# которому их ещё не предлагали. Переменные: OFFERS__DISPATCH_INTERVAL,
# OFFERS__DISPATCH_BATCH.
dispatch_interval = "2s"
# Максимум доставок одной пачки (1..1000); проход продолжается с конца полной пачки.
dispatch_batch = 100

[database]
# PostgreSQL delivery (ADR 8, ADR 31, ADR 0001 контекста). Обязательно: пустой uri
# завершает startup процесса (он же применяет миграции). Только PostgreSQL connection URI
# postgresql://user:password@host:5432/db (или postgres://); libpq key=value не принимается.
# Не храните URI с паролем в файле: задавайте DATABASE__URI из Secret. Переменные:
# DATABASE__URI, DATABASE__MAX_CONNS.
uri = ""
# Максимум соединений пула процесса.
max_conns = 10

[simulator]
# Демо Simulator курьеров (FR-604..FR-606): пока его включает оператор (SetSimulatorEnabled),
# pending offers, назначенные и забранные доставки получают действие курьера через случайную
# задержку [min_delay, max_delay] от момента, когда Simulator их увидел. Обязательно, значений
# по умолчанию нет; min_delay > max_delay завершает startup. Переменные: SIMULATOR__INTERVAL,
# SIMULATOR__MIN_DELAY, SIMULATOR__MAX_DELAY.
interval = "5s"
min_delay = "30s"
max_delay = "2m"
# Интервал позиций движущихся курьеров (FR-667): не больше interval. Переменная:
# SIMULATOR__TRACK_INTERVAL.
track_interval = "1s"

[tracking]
# Live tracking (FR-658, FR-661): Virtual City — сетка city_blocks × city_blocks кварталов
# со стороной block_meters от юго-западного угла; точки доставок — её перекрёстки.
# Обязательно, значений по умолчанию нет; меньше 2 кварталов, неположительный размер или
# рамка вне диапазонов широты и долготы завершают startup. Переменные:
# TRACKING__CITY_ORIGIN_LATITUDE, TRACKING__CITY_ORIGIN_LONGITUDE, TRACKING__CITY_BLOCKS,
# TRACKING__BLOCK_METERS, TRACKING__PERSIST_INTERVAL.
city_origin_latitude = 52.515
city_origin_longitude = 13.385
city_blocks = 12
block_meters = 150.0
# Позиция курьера пишется в PostgreSQL не чаще этого интервала; поток получает каждую.
persist_interval = "15s"

[valkey]
# Valkey потока позиций курьеров (pub/sub, FR-661). Обязательно: пусто или недоступный
# Valkey завершают startup. Не храните URL с паролем в файле: задавайте VALKEY__URL из Secret.
url = ""
