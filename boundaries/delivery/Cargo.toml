[package]
name = "delivery"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[[bin]]
name = "delivery"
path = "cmd/delivery/main.rs"

[[bin]]
name = "delivery-migrate"
path = "cmd/delivery-migrate/main.rs"

[dependencies]
config = { version = "0.15.27", default-features = false, features = ["toml"] }
humantime-serde = "1.1.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shaku = "0.6.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls-ring-webpki"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.4"
uuid = { version = "1.29.0", default-features = false, features = ["v5"] }

[lints.clippy]
all = "deny"
