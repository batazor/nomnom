[package]
name = "delivery"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[[bin]]
name = "delivery"
path = "cmd/delivery/main.rs"

[[bin]]
name = "delivery-worker"
path = "cmd/delivery-worker/main.rs"

[features]
# Test doubles infrastructure::memory и di::build_over для tests/: в боевой сборке их нет.
test-support = []

[dependencies]
config = { version = "0.15.27", default-features = false, features = ["toml"] }
futures = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
humantime = "2.4.0"
humantime-serde = "1.1.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
prost = "0.14.4"
prost-types = "0.14.4"
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio", "libz-static"] }
redis = { version = "1.8.0", default-features = false }
# Schema Registry (FR-715): TLS на ring, тот же провайдер rustls, что у tonic.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shaku = "0.6.3"
temporalio-client = { version = "1.1.0", default-features = false, features = ["vendored-protox"] }
temporalio-common = { version = "1.1.0", default-features = false, features = ["vendored-protox"] }
temporalio-macros = "1.1.0"
temporalio-sdk = { version = "1.1.0", default-features = false }
temporalio-workflow = "1.1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "tls-rustls-ring-webpki"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.4"
tower = { version = "0.5.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
url = "2.5.8"
uuid = { version = "1.29.0", default-features = false, features = ["std", "v5", "v7"] }
webpki-roots = "1.0.11"

[dev-dependencies]
delivery = { path = ".", features = ["test-support"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "trace", "testing"] }
libc = "0.2.191"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }

[lints.clippy]
all = "deny"
