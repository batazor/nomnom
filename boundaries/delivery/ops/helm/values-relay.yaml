# Outbox relay delivery (ADR 13, ADR 31): отдельный release того же chart, один активный экземпляр.
#   helm upgrade --install delivery-relay ops/helm -f ops/helm/values-relay.yaml
# Kafka и хранилище задаются values окружения (env KAFKA__*, OUTBOX__*).
component: relay

# Advisory lock / lease держит один активный экземпляр; replicas — только failover.
replicaCount: 1

command: ["/usr/bin/tini", "--", "/usr/local/bin/delivery-relay"]

service:
  enabled: false

database:
  # Схему применяет init container release delivery.
  migrate: false
