apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "delivery.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.env .Values.podAnnotations }}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "delivery.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "delivery.validateShutdownBudget" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "delivery.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      {{- if and .Values.database.migrate .Values.database.urlSecret.name }}
      # Миграции PostgreSQL до старта процесса; advisory lock sqlx сериализует реплики.
      initContainers:
        - name: migrate
          image: {{ include "delivery.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/usr/local/bin/delivery-migrate"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          env:
            {{- include "delivery.databaseEnv" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "delivery.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.service.enabled }}
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.management.port }}
              protocol: TCP
          {{- if or .Values.env .Values.envFrom }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "common.names.fullname" . }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            - name: MANAGEMENT__PORT
              value: {{ .Values.management.port | quote }}
            - name: SHUTDOWN__READINESS_DELAY
              value: {{ printf "%ds" (int .Values.shutdown.readinessDelaySeconds) | quote }}
            - name: SHUTDOWN__DRAIN_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdown.drainTimeoutSeconds) | quote }}
            {{- if .Values.identity.jwksConfigMap }}
            - name: IDENTITY__ISSUER
              value: {{ .Values.identity.issuer | quote }}
            - name: IDENTITY__AUDIENCE
              value: {{ .Values.identity.audience | quote }}
            - name: IDENTITY__JWKS_FILE
              value: {{ include "delivery.identityJwksFile" . | quote }}
            - name: IDENTITY__SERVICE_ACCOUNTS
              value: {{ .Values.identity.serviceAccounts | quote }}
            {{- end }}
            {{- if .Values.spicedb.endpoint }}
            {{- include "delivery.validateSpiceDb" . }}
            - name: SPICEDB__ENDPOINT
              value: {{ .Values.spicedb.endpoint | quote }}
            - name: SPICEDB__INSECURE
              value: {{ .Values.spicedb.insecure | toString | quote }}
            - name: SPICEDB__TIMEOUT
              value: {{ .Values.spicedb.timeout | quote }}
            - name: SPICEDB__PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spicedb.presharedKeySecret.name | quote }}
                  key: {{ .Values.spicedb.presharedKeySecret.key | quote }}
            {{- end }}
            {{- include "delivery.databaseEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.identity.jwksConfigMap }}
          volumeMounts:
            {{- if .Values.identity.jwksConfigMap }}
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.identity.jwksConfigMap }}
      volumes:
        {{- if .Values.identity.jwksConfigMap }}
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- end }}
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
