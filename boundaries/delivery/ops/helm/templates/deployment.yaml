apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "delivery.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Изменение файла конфигурации перезапускает pod: процесс читает его только при старте.
        checksum/config: {{ include "delivery.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "delivery.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "delivery.validateShutdownBudget" . }}
      {{- include "delivery.validateIdentity" . }}
      {{- include "delivery.validateTemporal" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "delivery.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "delivery.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.service.enabled }}
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ include "delivery.managementPort" . }}
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          # Несекретная конфигурация — только файл CONFIG_FILE; env — его путь, имя pod
          # (service.instance.id) и секреты из Secret.
          env:
            - name: CONFIG_FILE
              value: {{ include "delivery.configFile" . | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if dig "spicedb" "endpoint" nil .Values.config.spec }}
            {{- include "delivery.validateSpiceDb" . }}
            - name: SPICEDB__PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spicedb.presharedKeySecret.name | quote }}
                  key: {{ .Values.spicedb.presharedKeySecret.key | quote }}
            {{- end }}
            {{- with .Values.database.uriSecret }}
            {{- if .name }}
            - name: DATABASE__URI
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.service.enabled }}
            # FR-666: Valkey потока позиций курьеров обязателен процессу с gRPC API.
            - name: VALKEY__URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "valkey.urlSecret.name is required (FR-666)" .Values.valkey.urlSecret.name | quote }}
                  key: {{ required "valkey.urlSecret.key is required (FR-666)" .Values.valkey.urlSecret.key | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "delivery.configFile" . }}
              subPath: config.yaml
              readOnly: true
            {{- if .Values.identity.jwksConfigMap }}
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            - name: identity-user-jwks
              mountPath: /etc/nomnom/user-identity
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "common.names.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.identity.jwksConfigMap }}
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        - name: identity-user-jwks
          configMap:
            name: {{ .Values.identity.userJwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- end }}
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
