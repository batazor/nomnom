{{- /*
Файл конфигурации процесса (ADR 17): несекретная конфигурация из config.spec. Секреты
подключаются внешними Kubernetes Secret через secretKeyRef, envFrom или extraEnv и этим chart
не создаются; полей для них в spec нет.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "delivery.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
data:
  config.yaml: |
    {{- include "delivery.config" . | nindent 4 }}
