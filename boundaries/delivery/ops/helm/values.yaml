# Default values for delivery.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы,
# адреса внешних систем и kind-specific настройки задаются отдельными values-файлами
# или флагами --set при установке.

replicaCount: 1

image:
  # Имя образа из документации локальной сборки (docker build -t nomnom/<service>:local).
  # Registry и publishing pipeline ещё не определены и задаются values окружения.
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/delivery
  # Tag образа задаётся окружением. Пустое значение означает "latest" — для реальных
  # окружений всегда задавайте tag явно.
  tag: ""
  # IfNotPresent позволяет использовать образ, загруженный в kind через kind load docker-image.
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common: global.imageRegistry,
# global.compatibility.openshift.adaptSecurityContext и т. п.
global: {}

# Label app.kubernetes.io/component.
component: api

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Доступ к Kubernetes API приложению не нужен. Включение token automount —
  # отдельное явное решение.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: debian:12-slim, пользователь app (10001) из Dockerfile. Числовой UID нужен для проверки runAsNonRoot.
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false

# Команда контейнера; пусто — CMD образа.
command: []

service:
  # false — без Service и бизнес-порта контейнера.
  enabled: true
  type: ClusterIP
  # Порт Service и порт приложения. Приложение слушает 8083 по умолчанию
  # (переменная SERVER__PORT или PORT); targetPort должен совпадать с портом,
  # на котором фактически запускается процесс.
  port: 8083
  targetPort: 8083
  # Имя порта. Сейчас приложение отвечает по HTTP; при переходе на gRPC
  # Бизнес-порт обслуживает nomnom.delivery.v1 по gRPC/HTTP2.
  portName: grpc
  appProtocol: kubernetes.io/h2c
  annotations: {}

# Requests/limits не задаются: профиль потребления приложения ещё не измерен.
resources:
  requests: {}
  limits: {}

# Несекретная конфигурация. Попадает в ConfigMap и подключается через envFrom.
# OpenTelemetry задаётся блоком telemetry, а не здесь.
# SIMULATOR__INTERVAL, SIMULATOR__MIN_DELAY, SIMULATOR__MAX_DELAY и SIMULATOR__TRACK_INTERVAL
# обязательны (FR-606, FR-667), как и TRACKING__CITY_ORIGIN_LATITUDE,
# TRACKING__CITY_ORIGIN_LONGITUDE, TRACKING__CITY_BLOCKS, TRACKING__BLOCK_METERS и
# TRACKING__PERSIST_INTERVAL (FR-658): без них процесс не стартует, значения задаёт окружение
# (kind: 5s, 30s, 2m, 1s; Virtual City 12 × 12 по 150 м у демо-курьеров, 15s).
# KAFKA__BROKERS и SCHEMA_REGISTRY__URL обязательны (ADR 11, FR-715): адреса брокеров и
# Schema Registry задаёт окружение.
env:
  # Kafka consumer собственных фактов Delivery (delivery.v1.delivery-events) для Delivery
  # Duration Statistics (FR-676): группа delivery; новая группа читает стрим с начала.
  KAFKA__CONSUMER_GROUP: delivery
  KAFKA__INITIAL_OFFSET: oldest
  # Delivery Duration Estimate (FR-691): медианы последних SAMPLE_SIZE длительностей Market,
  # до набора выборки — базовые courier_lead (Create Delivery → Pickup) и transit
  # (Pickup → вручение). Пустое, нечисловое или нулевое значение завершает startup.
  DELIVERY_ESTIMATE__SAMPLE_SIZE: "50"
  DELIVERY_ESTIMATE__BASELINE_COURIER_LEAD: 15m
  DELIVERY_ESTIMATE__BASELINE_TRANSIT: 20m

# Дополнительные источники переменных окружения, в том числе внешние Secret:
# envFrom:
#   - secretRef:
#       name: delivery-secrets
envFrom: []

# Отдельные переменные окружения, включая valueFrom из внешних Secret:
# extraEnv:
#   - name: DATABASE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: delivery-database
#         key: password
extraEnv: []

# Технический порт runtime contract (docs/cloud-native-runtime.md): /health/* и metrics.
# Имя порта metrics задано моделью NetworkPolicy (ADR 16) и не меняется; номер передаётся
# приложению через MANAGEMENT__PORT. Порт не входит в Service и не публикуется через gateway.
management:
  port: 9083

# Бюджет graceful shutdown, передаётся приложению через SHUTDOWN__READINESS_DELAY и
# SHUTDOWN__DRAIN_TIMEOUT. readinessDelaySeconds должен превышать время, за которое
# readinessProbe замечает not ready (periodSeconds × failureThreshold), плюс распространение
# EndpointSlice и конфигурации internal gateway.
shutdown:
  readinessDelaySeconds: 5
  drainTimeoutSeconds: 20

# Должен быть больше readinessDelaySeconds + drainTimeoutSeconds с запасом на выход процесса;
# chart отказывается рендериться при нарушении.
terminationGracePeriodSeconds: 30

# Probes используют health contract на техническом порту. Поля, кроме enabled, передаются
# в Kubernetes как есть.
startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

# Liveness не зависит от внешних систем и остаётся успешной во время shutdown.
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# После SIGTERM readiness сразу отвечает 503; один провал исключает pod из endpoints.
readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

# Service identity (ADR 27): проверка projected ServiceAccount token входящих gRPC-вызовов.
# Для release с gRPC API (service.enabled) jwksConfigMap, issuer и serviceAccounts
# обязательны. Ключ jwks.json (публичные
# ключи кластера из /openid/v1/jwks) монтируется read-only в /etc/nomnom/identity/jwks.json.
identity:
  # Ожидаемый iss token: issuer кластера из /.well-known/openid-configuration.
  issuer: ""
  # Audience контекста, которую должен содержать aud token.
  audience: "nomnom.delivery"
  # Allowlist "namespace/serviceaccount=service-name" через запятую,
  # например "nomnom/orders-worker=orders-worker". Пустой при заданном issuer — ошибка startup.
  serviceAccounts: ""
  # Имя ConfigMap с ключом jwks.json; создаётся развёртыванием, не этим chart.
  jwksConfigMap: ""
  # User assertions BFF (ADR 32), обязательны при service.enabled. Ключ jwks.json
  # ConfigMap (публичные ключи BFF, EC P-256; в kind — bff-jwks) монтируется read-only
  # в /etc/nomnom/user-identity/jwks.json.
  userJwksConfigMap: ""
  # Ожидаемый iss assertion, например "nomnom-bff".
  userIssuer: ""
  # Services через запятую, которым разрешено передавать user subject, например "bff".
  userDelegates: ""

# Авторизация в SpiceDB (ADR 18). Пока endpoint пуст, SPICEDB__* не задаются и приложение
# использует локальную авторизацию с предупреждением. Если endpoint задан, передаются
# SPICEDB__ENDPOINT, SPICEDB__INSECURE, SPICEDB__TIMEOUT, а SPICEDB__PRESHARED_KEY берётся
# из Secret presharedKeySecret (secretKeyRef); ключ в values не хранится.
spicedb:
  # gRPC endpoint "host:port", например "spicedb.nomnom-authz.svc:50051".
  endpoint: ""
  # true — plaintext без TLS; только для kind и локального запуска.
  insecure: false
  # Deadline одного CheckPermission; ошибка или timeout — отказ (fail closed).
  timeout: "2s"
  # Secret с preshared key; создаётся развёртыванием, не этим chart. Обязателен при endpoint.
  presharedKeySecret:
    name: ""
    key: "preshared-key"

# Temporal Assignment Workflow (FR-704…FR-708): процесс API запускает и будит workflow,
# release worker (values-worker.yaml) его исполняет. Значений по умолчанию нет: адрес и
# namespace задаёт окружение; пусто — chart не рендерится, процесс без них не стартует.
temporal:
  # host:port frontend, например temporal.nomnom-infra.svc.cluster.local:7233.
  hostPort: ""
  namespace: ""
  connectTimeout: 10s

# Поток позиций курьеров (FR-661, FR-666): Valkey pub/sub. VALKEY__URL берётся из Secret
# valkey.urlSecret (secretKeyRef, URL ACL-пользователя, который только публикует в
# delivery.tracks.*); без него chart не рендерится, недоступный Valkey завершает startup.
valkey:
  urlSecret:
    # redis://delivery:<password>@valkey-delivery.nomnom-data.svc.cluster.local:6379
    name: ""
    key: url

# PostgreSQL (ADR 8, ADR 31, ADR 0001 контекста). DATABASE__URI берётся из Secret
# database.uriSecret (secretKeyRef); без него процесс не стартует (fail fast). Значение —
# только PostgreSQL connection URI postgresql:// или postgres://; libpq key=value завершает
# startup. Secret создаётся развёртыванием (root ops/kind: delivery-postgres, ключ dsn), не
# этим chart.
# Миграции встроены в образ: процесс применяет их при старте до открытия портов; advisory
# lock sqlx сериализует старт реплик, ошибка миграции завершает процесс.
# pool — лимиты пула одного pod (DATABASE__*); невалидные значения завершают startup.
# Соединений на сервер: replicas × maxConns. Pooler перед PostgreSQL — только session
# mode: миграции держат session advisory lock.
database:
  uriSecret:
    name: delivery-postgres
    key: dsn
  pool:
    # API: Unit of Work держит соединение всю транзакцию (DATABASE__MAX_CONNS, 1..100).
    maxConns: 10
    # Idle-минимум 0..1 (DATABASE__MIN_CONNS): idle не держат соединения pooler.
    minConns: 0
    maxLifetime: 30m
    # Не больше maxLifetime.
    idleTimeout: 5m
    # Ожидание соединения пула; затем UNAVAILABLE и db.client.connection.timeouts.
    acquireTimeout: 5s

# ADR 37: коннектор Debezium в Kafka Connect публикует Outbox из WAL (CDC); процесса relay
# нет. Release создаёт ресурс KafkaConnector (templates/cdc-connector.yaml).
cdc:
  enabled: false
  # KafkaConnect, к которому относится ресурс KafkaConnector (FR-538): имя и namespace, например
  # kafka-connect и nomnom-infra.
  connect:
    cluster: ""
    namespace: ""
  # Schema Registry для SchemaFraming коннектора (FR-714), например
  # http://schema-registry.nomnom-infra.svc.cluster.local:8081.
  schemaRegistryUrl: ""
  # Адрес базы для Kafka Connect. password — ссылка config provider Connect, не сам пароль,
  # например ${dir:/mnt/cdc:delivery-password}.
  database:
    hostname: ""
    port: 5432
    name: ""
    user: ""
    password: ""
  # Контракт Outbox (ADR 37): таблица delivery_outbox, publication delivery_outbox (миграция),
  # слот delivery_outbox; топик — поле topic, ключ — aggregate_id, value — payload как есть,
  # Event Envelope — заголовки из полей записи.
  connector:
    name: delivery-outbox
    config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      plugin.name: pgoutput
      topic.prefix: delivery-outbox
      slot.name: delivery_outbox
      publication.name: delivery_outbox
      publication.autocreate.mode: disabled
      table.include.list: public.delivery_outbox
      snapshot.mode: no_data
      skipped.operations: u,d,t
      tombstones.on.delete: "false"
      extended.headers.enabled: "false"
      key.converter: org.apache.kafka.connect.storage.StringConverter
      value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
      header.converter: org.apache.kafka.connect.storage.SimpleHeaderConverter
      # SchemaFraming (FR-714): value стримов Integration Events — wire format Schema Registry
      # по header event_type; Change Notification streams (*-changes) в topics не входят.
      transforms: outbox,schema
      transforms.schema.type: nomnom.connect.SchemaFraming
      transforms.schema.topics: delivery.v1.delivery-events
      transforms.schema.cache.ttl.ms: "60000"
      transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
      transforms.outbox.table.field.event.id: event_id
      transforms.outbox.table.field.event.key: aggregate_id
      transforms.outbox.table.field.event.payload: payload
      transforms.outbox.table.expand.json.payload: "false"
      transforms.outbox.route.by.field: topic
      transforms.outbox.route.topic.replacement: ${routedByValue}
      transforms.outbox.table.fields.additional.placement: event_id:header:_watermill_message_uuid,event_id:header:event_id,event_type:header:event_type,occurred_at:header:occurred_at,aggregate_type:header:aggregate_type,aggregate_id:header:aggregate_id,aggregate_version:header:aggregate_version,traceparent:header:traceparent

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ADR 9, docs/observability.md: OpenTelemetry процесса. Все три сигнала (traces, metrics
# OTLP gRPC, логи JSON в stdout) идентифицируются одним resource.
telemetry:
  # OTLP gRPC endpoint Alloy (OTEL_EXPORTER_OTLP_ENDPOINT), например
  # "http://alloy.observability.svc:4317". Пусто — traces и metrics не экспортируются.
  otlpEndpoint: ""
  # service.name (OTEL_SERVICE_NAME); пусто — имя процесса по умолчанию (delivery).
  serviceName: ""
  # service.instance.id (имя pod) и service.version (image.tag) chart задаёт сам; здесь —
  # атрибуты окружения, например deployment.environment.name: local. Не задавать
  # OTEL_RESOURCE_ATTRIBUTES через env: явная переменная chart её перекроет.
  resourceAttributes: {}
