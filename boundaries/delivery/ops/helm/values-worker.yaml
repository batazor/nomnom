# Temporal worker delivery (FR-708): отдельный release того же chart.
#   helm upgrade --install delivery-worker ops/helm -f ops/helm/values-worker.yaml
# Исполняет Assignment Workflow и его Activities на task queue delivery. gRPC API, SpiceDB,
# Valkey и Kafka процессу не нужны: identity, spicedb, valkey и cdc не задаются. Адрес и
# namespace Temporal (config.spec.temporal.hostPort, namespace) задаются values окружения.
role: delivery-worker

component: worker

command:
  - /usr/local/bin/delivery-worker

service:
  enabled: false

config:
  spec:
    # Секции API из values.yaml неполны (обязательные ключи задаёт окружение release
    # delivery): worker проверяет весь spec kind Delivery и неполную секцию не примет.
    identity: null
    spicedb: null
    kafka: null
    deliveryEstimate: null
    # Activities берут соединение на шаг назначения; лишние ждут в пуле.
    database:
      maxConns: 5
