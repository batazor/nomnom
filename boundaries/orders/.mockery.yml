# Mocks of the ports the tests replace; regenerate with `go tool mockery`.
structname: "{{.Mock}}{{.InterfaceName | firstUpper}}"
packages:
  nomnom/orders/di:
    interfaces:
      runner: {}
  nomnom/orders/pkg/lifecycle:
    interfaces:
      Worker: {}
  nomnom/orders/infrastructure/messaging:
    config:
      filename: mocks_schemas_test.go
    interfaces:
      SchemaSubjects:
        configs:
          - dir: infrastructure/messaging
            pkgname: messaging_test
          - dir: slices/order/infrastructure/messaging
            pkgname: messaging_test
  nomnom/orders/slices/fulfillment/applications/neighbours:
    config:
      dir: slices/fulfillment/infrastructure/temporal
      filename: mocks_neighbours_test.go
      pkgname: temporal_test
    interfaces:
      Delivery: {}
      Payments: {}
      Restaurants: {}
  nomnom/orders/slices/fulfillment/infrastructure/temporal:
    config:
      filename: mocks_test.go
      pkgname: temporal_test
    interfaces:
      SearchAttributes: {}
  nomnom/orders/slices/order/infrastructure/spicedb:
    config:
      filename: mocks_test.go
      pkgname: spicedb_test
    interfaces:
      Permissions: {}
  buf.build/gen/go/nomnom/payments/grpc/go/nomnom/payments/v1/paymentsv1grpc:
    config:
      include-auto-generated: true
      dir: slices/fulfillment/infrastructure/neighbours/grpcclient
      filename: mocks_payments_test.go
      pkgname: grpcclient_test
    interfaces:
      PaymentsServiceServer: {}
  buf.build/gen/go/nomnom/delivery/grpc/go/nomnom/delivery/v1/deliveryv1grpc:
    config:
      include-auto-generated: true
    interfaces:
      DeliveryServiceServer:
        configs:
          - dir: slices/fulfillment/infrastructure/neighbours/grpcclient
            filename: mocks_delivery_test.go
            pkgname: grpcclient_test
          - dir: slices/order/infrastructure/estimates
            filename: mocks_delivery_test.go
            pkgname: estimates_test
  buf.build/gen/go/nomnom/restaurants/grpc/go/nomnom/restaurants/v1/restaurantsv1grpc:
    config:
      include-auto-generated: true
    interfaces:
      RestaurantsServiceServer:
        configs:
          - dir: slices/fulfillment/infrastructure/neighbours/grpcclient
            filename: mocks_restaurants_test.go
            pkgname: grpcclient_test
          - dir: slices/order/infrastructure/catalog
            filename: mocks_test.go
            pkgname: catalog_test
          - dir: slices/order/infrastructure/scheduledslots
            filename: mocks_test.go
            pkgname: scheduledslots_test
          - dir: slices/order/infrastructure/estimates
            filename: mocks_restaurants_test.go
            pkgname: estimates_test
          - dir: infrastructure/grpc
            filename: mocks_test.go
            pkgname: grpcadapter_test
  # Ports of the order slice, generated into each consumer's tests.
  nomnom/orders/slices/order/applications/getorder:
    config:
      filename: "mocks_{{.SrcPackageName}}_test.go"
    interfaces:
      Authorizer:
        configs:
          - dir: infrastructure/grpc
            pkgname: grpcadapter_test
          - dir: slices/order/applications/getorder
            pkgname: getorder_test
          - dir: slices/order/applications/listcustomerorders
            pkgname: listcustomerorders_test
          - dir: slices/order/applications/closure/requestordercancellation
            pkgname: requestordercancellation_test
          - dir: slices/simulator/applications/customersimulator
            pkgname: customersimulator_test
  nomnom/orders/slices/order/applications/placeorder:
    config:
      filename: "mocks_{{.SrcPackageName}}_test.go"
    interfaces:
      Catalog:
        configs:
          - dir: infrastructure/grpc
            pkgname: grpcadapter_test
          - dir: slices/order/applications/placeorder
            filename: mocks_test.go
            pkgname: placeorder_test
          - dir: slices/simulator/applications/customersimulator
            pkgname: customersimulator_test
            structname: MockPlacementCatalog
      IdempotencyKeys:
        config:
          dir: slices/order/applications/placeorder
          filename: mocks_test.go
          pkgname: placeorder_test
      SlotReservations:
        configs:
          - dir: slices/order/applications/placeorder
            filename: mocks_test.go
            pkgname: placeorder_test
          - dir: infrastructure/grpc
            pkgname: grpcadapter_test
  nomnom/orders/slices/order/applications/fulfillment:
    config:
      filename: "mocks_{{.SrcPackageName}}_test.go"
    interfaces:
      CancellationRequester:
        configs:
          - dir: infrastructure/grpc
            pkgname: grpcadapter_test
          - dir: slices/order/applications/closure/requestordercancellation
            pkgname: requestordercancellation_test
          - dir: slices/simulator/applications/customersimulator
            pkgname: customersimulator_test
      Notifier:
        configs:
          - dir: slices/order/applications/fulfillmentsteps/confirmorder
            pkgname: confirmorder_test
          - dir: slices/order/applications/fulfillmentsteps/recordcourierassignment
            pkgname: recordcourierassignment_test
          - dir: slices/order/applications/recordcourierrelease
            pkgname: recordcourierrelease_test
          - dir: slices/order/applications/fulfillmentsteps/recorddeliverycompletion
            pkgname: recorddeliverycompletion_test
          - dir: slices/order/applications/fulfillmentsteps/recorddeliveryfailure
            pkgname: recorddeliveryfailure_test
          - dir: slices/order/applications/fulfillmentsteps/recordorderready
            pkgname: recordorderready_test
          - dir: slices/order/applications/fulfillmentsteps/recordpickup
            pkgname: recordpickup_test
          - dir: slices/order/applications/recordpreparationdelay
            pkgname: recordpreparationdelay_test
          - dir: slices/order/applications/fulfillmentsteps/recordpreparationstarted
            pkgname: recordpreparationstarted_test
          - dir: slices/order/applications/fulfillmentsteps/rejectorder
            pkgname: rejectorder_test
          - dir: slices/order/applications/relaypreparationissue
            pkgname: relaypreparationissue_test
          - dir: slices/order/di
            pkgname: di
          - dir: slices/order/infrastructure/messaging
            pkgname: messaging_test
      Starter:
        configs:
          - dir: slices/order/applications/startfulfillment
            pkgname: startfulfillment_test
          - dir: slices/order/infrastructure/messaging
            pkgname: messaging_test
  nomnom/orders/slices/order/applications/planschedule:
    interfaces:
      Preparation:
        configs:
          - dir: slices/order/applications/planschedule
            filename: mocks_test.go
            pkgname: planschedule_test
          - dir: slices/fulfillment/infrastructure/temporal
            filename: mocks_planschedule_test.go
            pkgname: temporal_test
      DeliveryDuration:
        configs:
          - dir: slices/order/applications/planschedule
            filename: mocks_test.go
            pkgname: planschedule_test
          - dir: slices/fulfillment/infrastructure/temporal
            filename: mocks_planschedule_test.go
            pkgname: temporal_test
  nomnom/orders/slices/order/applications/syncorderrelationships:
    config:
      filename: mocks_test.go
    interfaces:
      Relationships:
        config:
          dir: slices/order/infrastructure/messaging
          filename: "mocks_{{.SrcPackageName}}_test.go"
          pkgname: messaging_test
      Changes:
        configs:
          - dir: slices/order/applications/fulfillmentsteps/recordcourierassignment
            pkgname: recordcourierassignment_test
          - dir: slices/order/applications/recordcourierrelease
            pkgname: recordcourierrelease_test
  # Ports replaced by tests of their consumers, generated next to those tests.
  nomnom/orders/slices/order/domains/order:
    config:
      filename: "mocks_{{.SrcPackageName}}_test.go"
    interfaces:
      Repository:
        configs:
          - dir: slices/order/applications/fulfillmentsteps/confirmorder
            pkgname: confirmorder_test
          - dir: slices/order/applications/fulfillmentsteps/recordcourierassignment
            pkgname: recordcourierassignment_test
          - dir: slices/order/applications/fulfillmentsteps/recorddeliverycompletion
            pkgname: recorddeliverycompletion_test
          - dir: slices/order/applications/fulfillmentsteps/recorddeliveryfailure
            pkgname: recorddeliveryfailure_test
          - dir: slices/order/applications/fulfillmentsteps/recordorderready
            pkgname: recordorderready_test
          - dir: slices/order/applications/fulfillmentsteps/recordpickup
            pkgname: recordpickup_test
          - dir: slices/order/applications/recordpreparationdelay
            pkgname: recordpreparationdelay_test
          - dir: slices/order/applications/fulfillmentsteps/recordpreparationstarted
            pkgname: recordpreparationstarted_test
          - dir: slices/order/applications/fulfillmentsteps/rejectorder
            pkgname: rejectorder_test
  nomnom/orders/slices/order/applications/orderdetails:
    interfaces:
      CancellationPolicy:
        config:
          dir: slices/order/applications/getorder
          filename: mocks_test.go
          pkgname: getorder_test
  nomnom/orders/slices/order/infrastructure/cancellationpolicy:
    interfaces:
      Policy:
        config:
          filename: mocks_test.go
  nomnom/orders/slices/simulator/applications/customersimulator:
    config:
      dir: slices/simulator/applications/customersimulator
      filename: mocks_test.go
      pkgname: customersimulator_test
    interfaces:
      Catalog: {}
      Keys: {}
      Random: {}
      Switch: {}
  nomnom/orders/infrastructure/grpc:
    config:
      filename: mocks_subject_test.go
      pkgname: grpcadapter_test
    interfaces:
      SubjectResolver: {}
