# Файл конфигурации процесса orders (CONFIG_FILE). Формат ресурса Kubernetes, в Kubernetes API
# не регистрируется. Ключи spec — camelCase, длительности — строки Go (500ms, 5s, 2m, 1h);
# неизвестный ключ на любом уровне — ошибка старта. Секреты в файл не входят: POSTGRES__DSN и
# SPICEDB__PRESHARED_KEY — только env (postgres.dsn в spec — неизвестный ключ). service.instance.id —
# env POD_NAME, обязателен. `make run` запускает API с этим файлом.
apiVersion: config.nomnom.dev/v1alpha1
kind: Orders
metadata:
  # Роль процесса: orders, orders-worker или orders-consumer. Процесс не стартует с файлом чужой
  # роли; orders-admin сверяет только apiVersion и kind.
  name: orders
spec:
  server:
    port: 8081
  management:
    port: 9081
  shutdown:
    readinessDelay: 5s
    drainTimeout: 20s
  kafka:
    brokers:
      - localhost:9092
    clientId: orders
    consumerGroup: orders
    initialOffset: oldest
  # Schema Registry записей стримов: обязателен orders-consumer (FR-715).
  schemaRegistry:
    url: http://127.0.0.1:8081
    timeout: 5s
  temporal:
    hostPort: localhost:7233
    namespace: default
    connectTimeout: 10s
    # Создание Search Attribute требует прав оператора namespace; включать локально.
    registerSearchAttributes: false
  # Окно отмены от момента Place Order. Placeholder до продуктового решения; значение должно быть
  # положительным. У запланированного заказа окно закрывается в window_start − scheduledCutoff
  # (обязателен, без значения по умолчанию).
  cancellation:
    window: 5m
    scheduledCutoff: 60m
  # План запланированного заказа, обязателен, без значений по умолчанию: start_at =
  # planned_ready_at − baseline preparation − preparationBuffer, контрольная точка пересчёта — за
  # replanLead до start_at.
  scheduledOrder:
    preparationBuffer: 5m
    replanLead: 30m
  # Catalog Place Order: лимиты суммы заказа в валюте меню — placeholders, пока restaurants их не
  # публикует; timeout — общий deadline GetRestaurant и GetMenu.
  catalog:
    minimumTotal: "0"
    maximumTotal: "100000"
    timeout: 2s
  # Policy Order Fulfillment Workflow. Значения — placeholders, не продуктовые сроки.
  fulfillment:
    acceptanceTimeout: 10m
    preparationTimeout: 90m
    maxPreparationExtension: 60m
    pickupTimeout: 60m
    deliveryTimeout: 120m
    publishStage: true
  # Адрес internal gateway для синхронных вызовов других контекстов; обязателен всем процессам.
  internalGateway:
    address: localhost:8080
  # Service identity (ADR 27). issuer, audience и jwksFile обязательны для gRPC API.
  identity:
    issuer: ""
    audience: nomnom.orders
    jwksFile: ""
    # namespace/serviceaccount=service-name через запятую.
    serviceAccounts: ""
    # Каталог projected tokens по audience целевых контекстов (worker).
    tokenDir: ""
    # User assertions BFF (ADR 32): userIssuer, userJwksFile и userDelegates обязательны для gRPC API.
    userIssuer: ""
    userJwksFile: ""
    # Services, которым разрешено передавать user, через запятую (в развёртываниях bff).
    userDelegates: ""
  # SpiceDB (ADR 18): обязателен API и consumer. Preshared key — env SPICEDB__PRESHARED_KEY.
  spicedb:
    endpoint: localhost:50051
    insecure: true
    timeout: 2s
  # PostgreSQL (ADR 8). DSN — env POSTGRES__DSN. Пул процесса за пулером в session mode
  # (README, «Пулер PostgreSQL»).
  postgres:
    maxConns: 10
    minConns: 0
    maxConnLifetime: 30m
    maxConnLifetimeJitter: 5m
    maxConnIdleTime: 5m
    connectTimeout: 5s
    healthCheckPeriod: 1m
  # Demo customer Simulator (FR-604..FR-606), только cmd/orders; значений по умолчанию нет,
  # пустое или невалидное значение и minDelay > maxDelay останавливают процесс на старте.
  # Включается RPC SetSimulatorEnabled (platform#operate_simulator); новый сервис — выключен.
  simulator:
    interval: 5s
    minDelay: 30s
    maxDelay: 2m
    # user, от имени которого Simulator оформляет и отменяет заказы.
    customerId: local-customer
    # Markets (ADR 41) через запятую, рестораны которых видит Simulator, например "berlin".
    marketIds: berlin
  # OpenTelemetry (ADR 9). Экспорт включают только tracing.enabled и metrics.enabled; endpoint —
  # базовый URL OTLP коллектора, обязателен при включённом экспорте. protocol — grpc или
  # http/protobuf. serviceName по умолчанию — роль. resourceAttributes не задают service.name и
  # service.instance.id.
  telemetry:
    endpoint: ""
    protocol: grpc
    serviceName: orders
    resourceAttributes:
      deployment.environment.name: local
  tracing:
    enabled: false
  metrics:
    enabled: false
    exportInterval: 60s
  # debug | info | warn | error.
  logging:
    level: info
