server:
  port: 8081
management:
  port: 9081
shutdown:
  readiness_delay: 5s
  drain_timeout: 20s
kafka:
  brokers:
    - localhost:9092
  client_id: orders
  consumer_group: orders
temporal:
  host_port: localhost:7233
  namespace: default
  connect_timeout: 10s
  # Создание Search Attribute требует прав оператора namespace; включать локально.
  register_search_attributes: false
# Окно отмены от момента Place Order (env CANCELLATION__WINDOW). Placeholder до
# продуктового решения; значение должно быть положительным.
cancellation:
  window: 5m
# Catalog Place Order (env CATALOG__*): лимиты суммы заказа в валюте меню — placeholders,
# пока restaurants их не публикует; timeout — общий deadline GetRestaurant и GetMenu.
catalog:
  minimum_total: "0"
  maximum_total: "100000"
  timeout: 2s
# Policy Order Fulfillment Workflow. Значения — placeholders, не продуктовые сроки.
fulfillment:
  acceptance_timeout: 10m
  assignment_timeout: 15m
  max_replans: 2
  operator_decision_timeout: 30m
  preparation_timeout: 90m
  max_preparation_extension: 60m
  pickup_timeout: 60m
  delivery_timeout: 120m
  publish_stage: true
  # grpc | unavailable | simulated (grpc — по умолчанию, командные API соседей через
  # internal gateway; unavailable — явное отключение; simulated — только локальная проверка маршрута).
  neighbours: grpc
# Адрес internal gateway (env INTERNAL_GATEWAY_ADDR); обязателен при neighbours: grpc.
internal_gateway:
  address: ""
# Service identity (ADR 27). issuer, audience и jwks_file обязательны для gRPC API.
identity:
  issuer: ""
  audience: nomnom.orders
  jwks_file: ""
  # namespace/serviceaccount=service-name через запятую.
  service_accounts: ""
  # Каталог projected tokens по audience целевых контекстов (worker).
  token_dir: ""
  # User assertions BFF (ADR 32): без user_issuer, user_jwks_file и user_delegates отклоняются.
  user_issuer: ""
  user_jwks_file: ""
  # Services, которым разрешено передавать user, через запятую (в развёртываниях bff).
  user_delegates: ""
# SpiceDB (ADR 18). Пустой endpoint — все authorization checks отклоняются.
spicedb:
  endpoint: ""
  # Preshared key передаётся через SPICEDB__PRESHARED_KEY из Secret, не через файл.
  preshared_key: ""
  insecure: false
  timeout: 2s
# PostgreSQL (ADR 8). DSN обязателен; передаётся через POSTGRES__DSN из Secret.
postgres:
  dsn: ""
  # Пул процесса за пулером в session mode (README, «Пулер PostgreSQL»).
  max_conns: 10
  min_conns: 0
  max_conn_lifetime: 30m
  max_conn_lifetime_jitter: 5m
  max_conn_idle_time: 5m
  connect_timeout: 5s
  health_check_period: 1m
# Reconciliation order#customer (cmd/orders-reconciler). grace > самой долгой транзакции оформления.
reconciler:
  interval: 5m
  grace: 10m
  page_size: 500
# Demo customer Simulator (FR-604..FR-606), только cmd/orders; значений по умолчанию нет,
# пустое или невалидное значение и min_delay > max_delay останавливают процесс на старте.
# Включается RPC SetSimulatorEnabled (platform#operate_simulator); новый сервис — выключен.
simulator:
  interval: 5s
  min_delay: 30s
  max_delay: 2m
  # user, от имени которого Simulator оформляет и отменяет заказы.
  customer_id: ""
