# Go-клиенты API соседних контекстов, которые orders вызывает через internal gateway:
# командные API для Activities fulfillment и чтения каталога для Place Order.
# До публикации модулей в BSR код генерируется из workspace (ADR 7 — после публикации
# переход на закреплённый BSR commit). Запуск: make proto-generate в boundaries/orders.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: nomnom/orders/pkg/gateway/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt:
      - paths=source_relative
inputs:
  - directory: ../../../payments/infrastructure/grpc
  - directory: ../../../restaurants/infrastructure/grpc
    # Integration Events генерирует messaging/buf.gen.yaml: второй пакет того же proto file
    # даёт panic регистрации в protoregistry.
    exclude_paths:
      - ../../../restaurants/infrastructure/grpc/nomnom/restaurants/v1/events.proto
  - directory: ../../../delivery/infrastructure/grpc
    # Integration Events генерирует messaging/buf.gen.yaml: второй пакет того же proto file
    # даёт panic регистрации в protoregistry.
    exclude_paths:
      - ../../../delivery/infrastructure/grpc/nomnom/delivery/v1/events.proto
