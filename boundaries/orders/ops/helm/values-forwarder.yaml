# Outbox forwarder orders (ADR 13): отдельный release того же chart, один активный экземпляр.
#   helm upgrade --install orders-forwarder ops/helm -f ops/helm/values-forwarder.yaml
# Kafka и PostgreSQL задаются values окружения (env KAFKA__*, postgres.dsnSecret).
component: forwarder

telemetry:
  serviceName: orders-forwarder

replicaCount: 1

command:
  - /orders-forwarder

service:
  enabled: false

# Пул PostgreSQL роли (README, «Пулер PostgreSQL»): Один активный экземпляр: транзакция опроса Outbox (FOR UPDATE offsets) и запас.
postgres:
  maxConns: 2
  minConns: 1
