{{- /*
Файл конфигурации процесса (CONFIG_FILE): только несекретные настройки. Секреты подключаются
внешними Kubernetes Secret через env (orders.secretEnv), envFrom или extraEnv[].valueFrom и этим
chart не создаются.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "orders.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
data:
  config.yaml: |
    {{- include "orders.configFile" . | nindent 4 }}
