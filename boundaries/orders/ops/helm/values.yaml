# Default values for orders.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы,
# адреса внешних систем и kind-specific настройки задаются отдельными values-файлами
# или флагами --set при установке.

replicaCount: 1

image:
  # Имя образа из документации локальной сборки (docker build -t nomnom/<service>:local).
  # Registry и publishing pipeline ещё не определены и задаются values окружения.
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/orders
  # Tag образа задаётся окружением. Пустое значение означает "latest" — для реальных
  # окружений всегда задавайте tag явно.
  tag: ""
  # IfNotPresent позволяет использовать образ, загруженный в kind через kind load docker-image.
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common: global.imageRegistry,
# global.compatibility.openshift.adaptSecurityContext и т. п.
global: {}

# Label app.kubernetes.io/component. Значения по умолчанию разворачивают API (cmd/orders).
# Temporal worker (cmd/orders-worker) — отдельный release этого chart с values-worker.yaml:
# component: worker, command ["/orders-worker"], без Service и бизнес-порта.
component: api

# Переопределение entrypoint образа; пустой список — ENTRYPOINT образа (/orders).
command: []

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Доступ к Kubernetes API приложению не нужен. Включение token automount —
  # отдельное явное решение.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: gcr.io/distroless/static-debian12:nonroot, пользователь nonroot (65532). Числовой UID нужен для проверки runAsNonRoot.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true

service:
  # false — без Service и бизнес-порта контейнера (Temporal worker).
  enabled: true
  type: ClusterIP
  # Порт Service и порт приложения. Приложение слушает 8081 по умолчанию
  # (переменная SERVER__PORT или PORT); targetPort должен совпадать с портом,
  # на котором фактически запускается процесс.
  port: 8081
  targetPort: 8081
  # Бизнес-порт обслуживает nomnom.orders.v1 по gRPC/HTTP2.
  portName: grpc
  appProtocol: kubernetes.io/h2c
  annotations: {}


# Requests/limits не задаются: профиль потребления приложения ещё не измерен.
# Go runtime следует limits сам: GOMAXPROCS — по limits.cpu (Go 1.25+), GOMEMLIMIT — 90%
# limits.memory (automemlimit). Не задавать GOMAXPROCS/GOMEMLIMIT через env без замеров:
# явное значение отключает автоподстройку.
resources:
  requests: {}
  limits: {}

# Несекретная конфигурация. Попадает в ConfigMap и подключается через envFrom.
# OpenTelemetry — секция telemetry ниже, не env. CANCELLATION__WINDOW без значения —
# placeholder 5m.
# Release API (cmd/orders) требует SIMULATOR__INTERVAL, SIMULATOR__MIN_DELAY,
# SIMULATOR__MAX_DELAY, SIMULATOR__CUSTOMER_ID и SIMULATOR__MARKET_IDS (FR-606, ADR 41):
# без них pod не стартует.
# Запланированные заказы (add-scheduled-orders): значения обязательны для всех процессов
# (API, worker, consumer читают одну конфигурацию), пустое или неположительное — pod не
# стартует. Releases worker и consumer наследуют их из этого файла.
env:
  # Окно отмены запланированного заказа закрывается в window_start − cutoff (FR-462).
  CANCELLATION__SCHEDULED_CUTOFF: 60m
  # start_at = planned_ready_at − baseline preparation − buffer (FR-677).
  SCHEDULED_ORDER__PREPARATION_BUFFER: 5m
  # Контрольная точка пересчёта плана за replan_lead до start_at (FR-679).
  SCHEDULED_ORDER__REPLAN_LEAD: 30m

# Дополнительные источники переменных окружения, в том числе внешние Secret:
# envFrom:
#   - secretRef:
#       name: orders-secrets
envFrom: []

# Отдельные переменные окружения, включая valueFrom из внешних Secret:
# extraEnv:
#   - name: DATABASE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: orders-database
#         key: password
extraEnv: []

# Технический порт runtime contract (docs/cloud-native-runtime.md): /health/* и metrics.
# Имя порта metrics задано моделью NetworkPolicy (ADR 16) и не меняется; номер передаётся
# приложению через MANAGEMENT__PORT. Порт не входит в Service и не публикуется через gateway.
management:
  port: 9081

# Бюджет graceful shutdown, передаётся приложению через SHUTDOWN__READINESS_DELAY и
# SHUTDOWN__DRAIN_TIMEOUT. readinessDelaySeconds должен превышать время, за которое
# readinessProbe замечает not ready (periodSeconds × failureThreshold), плюс распространение
# EndpointSlice и конфигурации internal gateway.
shutdown:
  readinessDelaySeconds: 5
  drainTimeoutSeconds: 20

# Должен быть больше readinessDelaySeconds + drainTimeoutSeconds с запасом на выход процесса;
# chart отказывается рендериться при нарушении.
terminationGracePeriodSeconds: 30

# Probes используют health contract на техническом порту. Поля, кроме enabled, передаются
# в Kubernetes как есть.
startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

# Liveness не зависит от внешних систем и остаётся успешной во время shutdown.
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# После SIGTERM readiness сразу отвечает 503; один провал исключает pod из endpoints.
readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Service identity (ADR 27). jwksConfigMap, issuer и serviceAccounts обязательны для
# release с gRPC API (service.enabled). Окружение задаёт issuer кластера, ConfigMap с JWKS кластера
# (ключ jwks.json) и allowlist "namespace/serviceaccount=service-name,…".
identity:
  issuer: ""
  audience: nomnom.orders
  serviceAccounts: ""
  jwksConfigMap: ""
  # Audiences целевых контекстов, для которых Pod получает projected token
  # (/var/run/secrets/nomnom/identity/<audience>); нужно только worker'у.
  tokenAudiences: []
  tokenExpirationSeconds: 3600
  # User assertions BFF (ADR 32): ConfigMap с JWKS BFF (ключ jwks.json), ожидаемый iss и
  # services-делегаты через запятую. Обязательны вместе с jwksConfigMap, issuer и serviceAccounts
  # для release с gRPC API (service.enabled).
  userJwksConfigMap: ""
  userIssuer: ""
  userDelegates: ""

# SpiceDB (ADR 18). endpoint обязателен: без SPICEDB__ENDPOINT процесс не стартует.
# Preshared key берётся из внешнего Secret и не хранится в values.
spicedb:
  endpoint: ""
  insecure: false
  timeout: 2s
  presharedKeySecret:
    name: ""
    key: preshared-key

# PostgreSQL (ADR 8). DSN берётся из внешнего Secret; без него процесс не стартует.
# Миграции встроены в образ: каждый процесс при старте применяет недостающие под advisory
# lock до запуска остального (пул из 1 соединения, вне maxConns).
postgres:
  dsnSecret:
    name: ""
    key: dsn
  # Пул процесса (POSTGRES__*). За пулером PostgreSQL в session mode каждое соединение
  # держит server-соединение: Σ(replicas × maxConns) всех ролей должна помещаться в
  # pool_size пулера (README, «Пулер PostgreSQL»). maxConns — по конкурентности роли:
  # API 10, worker и consumer 5 (values-<role>.yaml).
  maxConns: 10
  # 0 или 1: простаивающие соединения тоже держат server-соединения пулера.
  minConns: 1
  # Lifetime с jitter: реплики не переоткрывают соединения одновременно.
  maxConnLifetime: 30m
  maxConnLifetimeJitter: 5m
  maxConnIdleTime: 5m
  connectTimeout: 5s
  healthCheckPeriod: 1m

# ADR 37: Outbox orders доставляет Debezium (Kafka Connect) из WAL. Включается в одном release
# контекста (API): ресурс KafkaConnector
# cdc.connector.name в KafkaConnect cdc.connect.
cdc:
  enabled: false
  # KafkaConnect, к которому относится ресурс KafkaConnector (FR-538): имя и namespace, например
  # kafka-connect и nomnom-infra.
  connect:
    cluster: ""
    namespace: ""
  # Schema Registry для SchemaFraming коннектора (FR-714), например
  # http://schema-registry.nomnom-infra.svc.cluster.local:8081.
  schemaRegistryUrl: ""
  # Адрес базы для Kafka Connect. password — ссылка config provider Connect, не сам пароль,
  # например ${dir:/mnt/cdc:orders-password}.
  database:
    hostname: ""
    port: 5432
    name: ""
    user: ""
    password: ""
  # Контракт Outbox (ADR 37): таблица orders_outbox, publication orders_outbox (миграция),
  # слот orders_outbox; топик — поле topic, ключ — aggregate_id, value — payload как есть,
  # Event Envelope — заголовки из полей записи.
  connector:
    name: orders-outbox
    config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      plugin.name: pgoutput
      topic.prefix: orders-outbox
      slot.name: orders_outbox
      publication.name: orders_outbox
      publication.autocreate.mode: disabled
      table.include.list: public.orders_outbox
      snapshot.mode: no_data
      skipped.operations: u,d,t
      tombstones.on.delete: "false"
      extended.headers.enabled: "false"
      key.converter: org.apache.kafka.connect.storage.StringConverter
      value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
      header.converter: org.apache.kafka.connect.storage.SimpleHeaderConverter
      # SchemaFraming (FR-714): value стримов Integration Events — wire format Schema Registry
      # по header event_type; Change Notification streams (*-changes) в topics не входят.
      transforms: outbox,schema
      transforms.schema.type: nomnom.connect.SchemaFraming
      transforms.schema.topics: orders.v1.order-events,orders.v1.order-relationships
      transforms.schema.cache.ttl.ms: "60000"
      transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
      transforms.outbox.table.field.event.id: event_id
      transforms.outbox.table.field.event.key: aggregate_id
      transforms.outbox.table.field.event.payload: payload
      transforms.outbox.table.expand.json.payload: "false"
      transforms.outbox.route.by.field: topic
      transforms.outbox.route.topic.replacement: ${routedByValue}
      transforms.outbox.table.fields.additional.placement: event_id:header:_watermill_message_uuid,event_id:header:event_id,event_type:header:event_type,occurred_at:header:occurred_at,aggregate_type:header:aggregate_type,aggregate_id:header:aggregate_id,aggregate_version:header:aggregate_version,traceparent:header:traceparent

# ADR 9: OTel resource attributes процесса. service.instance.id (имя pod) и service.version
# (image.tag) chart задаёт сам; здесь — атрибуты окружения, например
# deployment.environment.name. Не задавать OTEL_RESOURCE_ATTRIBUTES через env: явная
# переменная chart её перекроет.
telemetry:
  # service.name роли: orders, orders-worker, orders-consumer (values-<role>.yaml).
  # Совпадает с default процесса.
  serviceName: orders
  resourceAttributes: {}
  # OTLP gRPC endpoint Alloy (OTEL_EXPORTER_OTLP_ENDPOINT), например
  # http://alloy.observability.svc:4317. Пусто — задаётся env окружения или не экспортируется.
  otlpEndpoint: ""
  # LOG__LEVEL: debug | info | warn | error; пусто — info.
  logLevel: ""
