# Kafka consumer orders (ADR 28): отдельный release того же chart.
#   helm upgrade --install orders-consumer ops/helm -f ops/helm/values-consumer.yaml
# Brokers (config.spec.kafka.brokers), Schema Registry (config.spec.schemaRegistry.url, FR-715),
# адрес и namespace Temporal (config.spec.temporal) задаются values окружения; SpiceDB
# (config.spec.spicedb.endpoint, spicedb.presharedKeySecret) обязателен: consumer синхронизирует
# связи order по RelationshipsChanged (ADR 18).
component: consumer

role: orders-consumer

command:
  - /orders-consumer

# Consumer не обслуживает бизнес-API: без Service и бизнес-порта, только metrics и probes.
service:
  enabled: false

config:
  spec:
    # Kafka ClientID совпадает с service.name процесса (квоты и диагностика брокера).
    # Группа orders читает стримы с начала: события по существующим Order должны быть отражены,
    # повтор истории идемпотентен через Inbox (ADR 28).
    kafka:
      clientId: orders-consumer
      consumerGroup: orders
      initialOffset: oldest
    # Router.Close ждёт начатые сообщения не дольше drainTimeout; offsets подтверждаются только
    # для сообщений, обработанных до commit, остальные доставляются повторно.
    shutdown:
      readinessDelay: 2s
      drainTimeout: 20s
    # Пул PostgreSQL роли (README, «Пулер PostgreSQL»): Watermill handlers: транзакция Inbox +
    # агрегат на сообщение.
    postgres:
      maxConns: 5
      minConns: 1
