# Reconciliation order#customer SpiceDB ↔ PostgreSQL: отдельный release того же chart.
#   helm upgrade --install orders-reconciler ops/helm -f ops/helm/values-reconciler.yaml
# SpiceDB (spicedb.*) и PostgreSQL (postgres.dsnSecret) задаются values окружения;
# интервал и grace — env RECONCILER__INTERVAL, RECONCILER__GRACE.
component: reconciler

telemetry:
  serviceName: orders-reconciler

replicaCount: 1

command:
  - /orders-reconciler

service:
  enabled: false

# Пул PostgreSQL роли (README, «Пулер PostgreSQL»): Страницы сверки читаются последовательно раз в RECONCILER__INTERVAL.
postgres:
  maxConns: 2
  minConns: 0
