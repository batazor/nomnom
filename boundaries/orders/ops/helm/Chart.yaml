apiVersion: v2
name: orders
description: "Orders bounded context (Go): заказы, их состав, жизненный цикл и оркестрация процесса заказа."
type: application
# Версия chart. appVersion намеренно не задаётся: версия сборки приложения ещё не определена,
# и образ полностью описывается через image.repository / image.tag в values.
version: 0.2.0
dependencies:
  # Library chart: имена, labels, образ, рендер values и совместимость securityContext.
  - name: common
    version: 2.41.0
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - bitnami-common
