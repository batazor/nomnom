# Go-типы Integration Events соседних контекстов, которые читает consumer orders.
# Контракты принадлежат publisher'ам (ADR 25); до публикации модулей в BSR код
# генерируется из workspace. Запуск: make proto-generate в boundaries/orders.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: nomnom/orders/slices/order/infrastructure/messaging/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt:
      - paths=source_relative
inputs:
  - directory: ../../../../../restaurants/infrastructure/grpc
    paths:
      - ../../../../../restaurants/infrastructure/grpc/nomnom/restaurants/v1/events.proto
  - directory: ../../../../../delivery/infrastructure/grpc
    paths:
      - ../../../../../delivery/infrastructure/grpc/nomnom/delivery/v1/events.proto
