syntax = "proto3";

package nomnom.orders.v1;

import "google/protobuf/timestamp.proto";

// Premium Priority of an Order (FR-650): a premium Order is prepared first.
enum OrderPriority {
  ORDER_PRIORITY_UNSPECIFIED = 0;
  ORDER_PRIORITY_STANDARD = 1;
  ORDER_PRIORITY_PREMIUM = 2;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_PLACED = 1;
  ORDER_STATE_CONFIRMED = 2;
  ORDER_STATE_CANCELLED = 3;
  ORDER_STATE_COMPLETED = 4;
  ORDER_STATE_PAID = 5;
  ORDER_STATE_PREPARING = 6;
  ORDER_STATE_READY = 7;
  ORDER_STATE_PICKED_UP = 8;
  ORDER_STATE_REJECTED = 9;
  ORDER_STATE_DELIVERY_FAILED = 10;
  ORDER_STATE_DELIVERED = 11;
}

message Money {
  string amount = 1;
  string currency = 2;
}

message OrderItem {
  string menu_item_id = 1;
  int32 quantity = 2;
  Money unit_price = 3;
  // Menu Item name at Place Order, like unit_price; empty for Orders placed
  // before the name was kept.
  string name = 4;
}

message FulfillmentFact {
  string kind = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string reason = 3;
}

message Cancellation {
  string outcome = 1;
  string reason_code = 2;
  google.protobuf.Timestamp cancelled_at = 3;
}

// Interval in which Request Order Cancellation admits a request. Whether it is
// open now is decided by the reader's clock; the request itself is checked again.
message CancellationWindow {
  google.protobuf.Timestamp opens_at = 1;
  google.protobuf.Timestamp closes_at = 2;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  string restaurant_id = 3;
  repeated OrderItem items = 4;
  reserved 5;
  reserved "delivery_address";
  Money total = 6;
  OrderState state = 7;
  google.protobuf.Timestamp placed_at = 8;
  repeated FulfillmentFact fulfillment_facts = 9;
  Cancellation cancellation = 10;
  // Present only while the Order State admits Order Cancellation.
  CancellationWindow cancellation_window = 11;
  // Последние известные сроки Fulfillment (FR-611); пусто — срок не назван.
  google.protobuf.Timestamp expected_ready_at = 12;
  google.protobuf.Timestamp expected_pickup_at = 13;
  google.protobuf.Timestamp expected_delivered_at = 14;
  // Market of the Restaurant at Place Order (ADR 41); immutable.
  string market_id = 15;
  // Premium Priority chosen at Place Order (FR-650).
  OrderPriority priority = 16;
  // Fee of Premium Priority fixed at Place Order and included in total; unset
  // for a standard Order.
  Money premium_fee = 17;
  // Delivery window of a scheduled Order (FR-681); unset for an ASAP Order.
  DeliveryWindow delivery_window = 18;
}

// Delivery window [start, end) of a scheduled Order.
message DeliveryWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// Error detail of PlaceOrder FAILED_PRECONDITION with reason SLOT_UNAVAILABLE
// (FR-692): the nearest available windows of the restaurant.
message SlotUnavailable {
  repeated DeliveryWindow alternatives = 1;
}

message OrderSummary {
  string order_id = 1;
  string restaurant_id = 2;
  OrderState state = 3;
  Money total = 4;
  google.protobuf.Timestamp placed_at = 5;
  // page_token of ListCustomerOrders that continues after this Order.
  string cursor = 6;
  // Full card of the Order, the same as GetOrder returns: a reader of the
  // history needs no GetOrder per Order.
  Order order = 7;
}
