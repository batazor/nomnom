syntax = "proto3";

package nomnom.orders.v1;

import "nomnom/orders/v1/orders.proto";

service OrdersService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListCustomerOrders(ListCustomerOrdersRequest) returns (ListCustomerOrdersResponse);
  // PlaceOrder places an Order for the calling Customer; the Customer is the
  // verified subject of the call, never a request field.
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  // RequestOrderCancellation hands a Cancellation Request to the fulfillment
  // workflow; the Order is cancelled by the workflow, not by this call.
  rpc RequestOrderCancellation(RequestOrderCancellationRequest) returns (RequestOrderCancellationResponse);
  // GetSimulator and SetSimulatorEnabled read and switch the demo customer
  // Simulator (FR-604); both require platform#operate_simulator.
  rpc GetSimulator(GetSimulatorRequest) returns (GetSimulatorResponse);
  rpc SetSimulatorEnabled(SetSimulatorEnabledRequest) returns (SetSimulatorEnabledResponse);
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListCustomerOrdersRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Required (ADR 41): only Orders of this Market.
  string market_id = 4;
}

message ListCustomerOrdersResponse {
  repeated OrderSummary orders = 1;
  string next_page_token = 2;
}

message PlaceOrderItem {
  string menu_item_id = 1;
  int32 quantity = 2;
}

message PlaceOrderRequest {
  // Chosen by the client and unique per Customer; a repeated request returns
  // the Order it already placed.
  string idempotency_key = 1;
  string restaurant_id = 2;
  repeated PlaceOrderItem items = 3;
  reserved 4;
  reserved "delivery_address";
}

message PlaceOrderResponse {
  string order_id = 1;
  // True when idempotency_key already identified a placed Order.
  bool replayed = 2;
  // False when the fulfillment start failed after commit; repeating the
  // request with the same idempotency_key retries the start.
  bool fulfillment_started = 3;
}

message RequestOrderCancellationRequest {
  string order_id = 1;
  // Client idempotency key of this Cancellation Request.
  string request_id = 2;
  string reason = 3;
}

enum CancellationRequestOutcome {
  CANCELLATION_REQUEST_OUTCOME_UNSPECIFIED = 0;
  CANCELLATION_REQUEST_OUTCOME_REQUESTED = 1;
  CANCELLATION_REQUEST_OUTCOME_ALREADY_CANCELLED = 2;
}

message RequestOrderCancellationResponse {
  CancellationRequestOutcome outcome = 1;
}

message GetSimulatorRequest {}

message GetSimulatorResponse {
  bool enabled = 1;
}

message SetSimulatorEnabledRequest {
  bool enabled = 1;
}

message SetSimulatorEnabledResponse {
  bool enabled = 1;
}
