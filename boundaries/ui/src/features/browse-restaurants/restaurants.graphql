query BrowseRestaurants($first: Int!, $after: String) {
  restaurants(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        acceptingOrders
        menu {
          items {
            id
            name
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
