# Fields of the order screen: the query loads them, orderChanged pushes them
# after every change (ADR 36).
fragment ViewedOrder on Order {
  id
  status
  endReason
  restaurant {
    id
    name
  }
  items {
    menuItem {
      id
      name
    }
    quantity
    unitPrice {
      amount
      currency
    }
    lineTotal {
      amount
      currency
    }
  }
  total {
    amount
    currency
  }
  priority
  premiumFee {
    amount
    currency
  }
  placedAt
  # Delivery window of a scheduled order, null for an ASAP one (FR-687).
  deliveryWindow {
    start
    end
  }
  milestones {
    kind
    occurredAt
  }
  cancellation {
    availableUntil
  }
  # Deadlines named by the kitchen and the courier, null until named (FR-612).
  expectedReadyAt
  expectedPickupAt
  expectedDeliveredAt
  # Courier delivering the order, null until assigned (FR-626).
  courier {
    name
  }
  # Live tracking of the courier, null unless the delivery is assigned or
  # picked up (FR-663).
  tracking {
    channel
    city {
      origin {
        latitude
        longitude
      }
      blocks
      blockMeters
    }
    pickup {
      latitude
      longitude
    }
    dropoff {
      latitude
      longitude
    }
    courierPosition {
      ...TrackedPosition
    }
  }
}

fragment TrackedPosition on CourierPosition {
  latitude
  longitude
  recordedAt
}

query ViewOrder($id: ID!) {
  order(id: $id) {
    ...ViewedOrder
  }
}

subscription OrderChanged($id: ID!) {
  orderChanged(id: $id) {
    ...ViewedOrder
  }
}

# Every new position of the courier; channel is Order.tracking.channel
# (FR-668). Nothing is sent before the courier moves.
subscription CourierMoved($channel: ID!) {
  courierMoved(channel: $channel) {
    ...TrackedPosition
  }
}

mutation RequestOrderCancellation($input: RequestOrderCancellationInput!) {
  requestOrderCancellation(input: $input) {
    outcome
    problem {
      code
    }
  }
}
