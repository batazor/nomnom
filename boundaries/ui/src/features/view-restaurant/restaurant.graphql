query ViewRestaurant($id: ID!) {
  restaurant(id: $id) {
    id
    name
    acceptingOrders
    waitTime {
      elevated
      expectedWaitMinutes
    }
    premiumFee {
      amount
      currency
    }
    menu {
      items {
        id
        name
        description
        price {
          amount
          currency
        }
        available
      }
    }
  }
}
