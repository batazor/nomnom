# Cook Pool of the kitchen: its line, load and cooks (FR-622).
fragment CookPoolView on CookPool {
  size
  onLine
  busy
  queued
  cooks {
    id
    name
    onLine
    currentKitchenOrderId
  }
}

# Kitchen board: the query loads it, kitchenChanged pushes it after every
# change of its orders or cooks (ADR 36).
fragment KitchenBoardView on Kitchen {
  restaurantId
  restaurant {
    id
    name
    acceptingOrders
  }
  orders {
    id
    orderId
    stage
    items {
      name
      quantity
    }
    receivedAt
    acceptedAt
    expectedReadyAt
    cook {
      id
      name
    }
  }
  cookPool {
    ...CookPoolView
  }
}

query BoardKitchen($restaurantId: ID!) {
  kitchen(restaurantId: $restaurantId) {
    ...KitchenBoardView
  }
}

subscription BoardKitchenChanged($restaurantId: ID!) {
  kitchenChanged(restaurantId: $restaurantId) {
    ...KitchenBoardView
  }
}

query BoardOwnedRestaurants {
  myRestaurants(first: 20) {
    edges {
      node {
        id
        name
        acceptingOrders
      }
    }
  }
}

mutation ApplyKitchenAction($input: KitchenActionInput!) {
  applyKitchenAction(input: $input) {
    order {
      id
      orderId
      stage
      items {
        name
        quantity
      }
      receivedAt
      cook {
        id
        name
      }
    }
    problem
  }
}

mutation HireCook($restaurantId: ID!, $name: String!) {
  hireCook(restaurantId: $restaurantId, name: $name) {
    cookPool {
      ...CookPoolView
    }
    problem
  }
}

mutation SetCookOnLine($restaurantId: ID!, $cookId: ID!, $onLine: Boolean!) {
  setCookOnLine(restaurantId: $restaurantId, cookId: $cookId, onLine: $onLine) {
    cookPool {
      ...CookPoolView
    }
    problem
  }
}

mutation RetireCook($restaurantId: ID!, $cookId: ID!) {
  retireCook(restaurantId: $restaurantId, cookId: $cookId) {
    cookPool {
      ...CookPoolView
    }
    problem
  }
}

# Courier Pool of the Market for dispatchers: the query loads it,
# courierPoolChanged pushes it after every change (ADR 36, FR-623); the pool id
# is the Market id (ADR 41).
fragment CourierPoolView on CourierPool {
  id
  size
  onLine
  busy
  waiting
  couriers {
    id
    name
    availability
    offeredOrderId
    currentOrderId
  }
}

query BoardCourierPool {
  courierPool {
    ...CourierPoolView
  }
}

subscription BoardCourierPoolChanged($marketId: ID!) {
  courierPoolChanged(marketId: $marketId) {
    ...CourierPoolView
  }
}

mutation AddCourier($name: String!) {
  addCourier(name: $name) {
    courierPool {
      ...CourierPoolView
    }
    problem
  }
}

mutation SetCourierOnLine($courierId: ID!, $onLine: Boolean!) {
  setCourierOnLine(courierId: $courierId, onLine: $onLine) {
    courierPool {
      ...CourierPoolView
    }
    problem
  }
}

mutation RetireCourier($courierId: ID!) {
  retireCourier(courierId: $courierId) {
    courierPool {
      ...CourierPoolView
    }
    problem
  }
}

# Work of the courier: the query loads it, courierChanged pushes it after
# every change (ADR 36); mutations answer with the same fields.
fragment CourierWork on Courier {
  id
  availability
  offers {
    id
    deliveryId
    orderId
    expiresAt
  }
  currentDelivery {
    id
    orderId
    stage
  }
}

query BoardCourier {
  courier {
    ...CourierWork
  }
}

subscription BoardCourierChanged($id: ID!) {
  courierChanged(id: $id) {
    ...CourierWork
  }
}

mutation SetCourierAvailability($availability: CourierAvailability!) {
  setCourierAvailability(availability: $availability) {
    courier {
      ...CourierWork
    }
    problem
  }
}

mutation AcceptDeliveryOffer($offerId: ID!) {
  acceptDeliveryOffer(offerId: $offerId) {
    courier {
      ...CourierWork
    }
    problem
  }
}

mutation ApplyCourierDeliveryAction(
  $deliveryId: ID!
  $action: CourierDeliveryAction!
) {
  applyCourierDeliveryAction(deliveryId: $deliveryId, action: $action) {
    courier {
      ...CourierWork
    }
    problem
  }
}

# Order chip of the board: the query loads it, orderChanged pushes it until a
# final status (ADR 36).
fragment BoardOrderView on Order {
  id
  status
  endReason
  restaurant {
    id
    name
  }
  total {
    amount
    currency
  }
  placedAt
}

query BoardOrderStatus($id: ID!) {
  order(id: $id) {
    ...BoardOrderView
  }
}

subscription BoardOrderChanged($id: ID!) {
  orderChanged(id: $id) {
    ...BoardOrderView
  }
}
