# Contract-test coverage for customer operations that no feature uses yet.

query MockCustomerOrders($first: Int!, $after: String) {
  customerOrders(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        status
        endReason
        placedAt
        total {
          amount
          currency
        }
        restaurant {
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
