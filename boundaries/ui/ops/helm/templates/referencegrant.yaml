{{- /*
HTTPRoute ui публичного gateway (неймспейс publicGateway.namespace) ведёт в Service UI.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "common.names.fullname" . }}-public-gateway
  labels:
    {{- include "ui.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ required "publicGateway.namespace is required" .Values.publicGateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ include "common.names.fullname" . }}
