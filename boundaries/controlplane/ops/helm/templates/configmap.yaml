{{- /*
Файл конфигурации процесса (config.yaml): только несекретные настройки. Секреты подключаются
внешними Kubernetes Secret через envFrom или extraEnv[].valueFrom и этим chart не создаются.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "controlplane.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
data:
  config.yaml: |
    {{- include "controlplane.configFile" . | nindent 4 }}
