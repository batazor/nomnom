apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "controlplane.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.env .Values.podAnnotations }}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "controlplane.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "controlplane.validateShutdownBudget" . }}
      {{- include "controlplane.validateIdentity" . }}
      {{- include "controlplane.validateSpiceDB" . }}
      {{- include "controlplane.validateRoutes" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "controlplane.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "controlplane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.management.port }}
              protocol: TCP
          {{- if or .Values.env .Values.envFrom }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "common.names.fullname" . }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            - name: MANAGEMENT__PORT
              value: {{ .Values.management.port | quote }}
            - name: SHUTDOWN__READINESS_DELAY
              value: {{ printf "%ds" (int .Values.shutdown.readinessDelaySeconds) | quote }}
            - name: SHUTDOWN__DRAIN_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdown.drainTimeoutSeconds) | quote }}
            {{- with .Values.identity }}
            - name: IDENTITY__ISSUER
              value: {{ .issuer | quote }}
            - name: IDENTITY__AUDIENCE
              value: {{ .audience | quote }}
            - name: IDENTITY__JWKS_FILE
              value: /etc/nomnom/identity/jwks.json
            - name: IDENTITY__SERVICE_ACCOUNTS
              value: {{ .serviceAccounts | quote }}
            - name: IDENTITY__USER_ISSUER
              value: {{ .userIssuer | quote }}
            - name: IDENTITY__USER_JWKS_FILE
              value: /etc/nomnom/user-identity/jwks.json
            - name: IDENTITY__USER_DELEGATES
              value: {{ .userDelegates | quote }}
            {{- end }}
            {{- with .Values.routes }}
            - name: ROUTES__NAMESPACE
              value: {{ .namespace | quote }}
            - name: ROUTES__GATEWAY
              value: {{ .gateway | quote }}
            - name: ROUTES__LISTENER
              value: {{ .listener | quote }}
            {{- end }}
            {{- include "controlplane.postgresEnv" (dict "context" .) | nindent 12 }}
            {{- include "controlplane.otelEnv" (dict "context" .) | nindent 12 }}
            {{- with .Values.spicedb }}
            - name: SPICEDB__ENDPOINT
              value: {{ .endpoint | quote }}
            - name: SPICEDB__INSECURE
              value: {{ .insecure | quote }}
            - name: SPICEDB__TIMEOUT
              value: {{ .timeout | quote }}
            - name: SPICEDB__PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .presharedKeySecret.name }}
                  key: {{ .presharedKeySecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            - name: identity-user-jwks
              mountPath: /etc/nomnom/user-identity
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        - name: identity-user-jwks
          configMap:
            name: {{ .Values.identity.userJwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
