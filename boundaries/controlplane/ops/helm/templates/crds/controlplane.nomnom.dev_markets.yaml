---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  name: markets.controlplane.nomnom.dev
spec:
  group: controlplane.nomnom.dev
  names:
    kind: Market
    listKind: MarketList
    plural: markets
    singular: market
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cellRef
      name: Cell
      type: string
    - jsonPath: .spec.currency
      name: Currency
      type: string
    - jsonPath: .spec.timeZone
      name: Time Zone
      type: string
    - jsonPath: .spec.archived
      name: Archived
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Market is a city served by one Cell. Its name is market_id.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MarketSpec declares a Market. Only archived changes, and
              only to true.
            properties:
              archived:
                default: false
                description: |-
                  Archived takes the Market off the client list and the public gateway. The
                  name stays taken: a Market is never deleted and never leaves the archive.
                type: boolean
                x-kubernetes-validations:
                - message: an archived Market does not leave the archive
                  rule: '!oldSelf || self'
              cellRef:
                description: CellRef is the Market Placement; the control plane checks
                  that the Cell exists.
                pattern: ^[a-z][a-z0-9-]{1,31}$
                type: string
                x-kubernetes-validations:
                - message: cellRef is immutable
                  rule: self == oldSelf
              currency:
                description: Currency is an ISO 4217 code.
                pattern: ^[A-Z]{3}$
                type: string
                x-kubernetes-validations:
                - message: currency is immutable
                  rule: self == oldSelf
              displayName:
                description: DisplayName is the name clients see.
                maxLength: 64
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: displayName must not have surrounding whitespace
                  rule: self == self.trim()
                - message: displayName is immutable
                  rule: self == oldSelf
              timeZone:
                description: TimeZone is an IANA time zone; the control plane checks
                  that it exists.
                maxLength: 64
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: timeZone is immutable
                  rule: self == oldSelf
            required:
            - archived
            - cellRef
            - currency
            - displayName
            - timeZone
            type: object
          status:
            description: RegistryStatus is the outcome of the last reconcile of a
              resource.
            properties:
              conditions:
                description: Conditions holds the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of the spec the
                  status describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name of a Market must match ^[a-z][a-z0-9-]{1,31}$
          rule: self.metadata.name.matches('^[a-z][a-z0-9-]{1,31}$')
    served: true
    storage: true
    subresources:
      status: {}
