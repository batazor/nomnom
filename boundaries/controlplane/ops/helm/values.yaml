# Default values for controlplane.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы, адреса
# внешних систем и kind-specific настройки задаются values окружения или --set.

image:
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/controlplane
  # Tag образа задаёт окружение; без него chart не рендерится (service.version telemetry).
  tag: ""
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common.
global: {}

# Label app.kubernetes.io/component.
component: controller

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Токен ServiceAccount для Kubernetes API: control plane читает реестр и применяет маршруты
  # публичного gateway (ADR 41, routes.*).
  automount: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: gcr.io/distroless/static-debian12:nonroot (65532).
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true

# Requests/limits задаёт окружение. GOMAXPROCS и GOMEMLIMIT (automemlimit) следуют limits.
resources:
  requests: {}
  limits: {}

# Роль процесса: metadata.name файла конфигурации. Обязательна.
role: controlplane

# Файл конфигурации процесса (apiVersion config.nomnom.dev/v1alpha1, kind ControlPlane): chart
# рендерит его в ConfigMap с ключом config.yaml, монтирует в /etc/nomnom/config.yaml и задаёт
# CONFIG_FILE. config.spec попадает в файл как есть: ключи camelCase, длительности — строки Go
# (500ms, 5s, 2m); неизвестный ключ — процесс не стартует. Env SECTION__KEY, OTEL_* и LOG__LEVEL
# процесс не читает. Chart сам дописывает только telemetry.resourceAttributes["service.version"]
# из image.tag: задать его в values — ошибка helm template.
config:
  spec:
    # Технический порт runtime contract (docs/cloud-native-runtime.md): /health/*. Имя metrics
    # задано моделью NetworkPolicy (ADR 16).
    management:
      port: 9086
    # Бюджет graceful shutdown; chart сверяет его с terminationGracePeriodSeconds.
    shutdown:
      readinessDelay: 5s
      drainTimeout: 20s
    # Маршруты публичного gateway (ADR 41): неймспейс HTTPRoute, Gateway и listener клиентского
    # трафика. Все поля обязательны. Chart выдаёт ServiceAccount Role в этом неймспейсе:
    # server-side apply и watch HTTPRoute, HTTPRouteFilter и ConfigMap, удаление HTTPRoute.
    routes:
      namespace: ""
      gateway: ""
      listener: ""
    # ADR 9: OpenTelemetry. Значения процесса по умолчанию: экспорт выключен (tracing.enabled и
    # metrics.enabled — false), protocol grpc, serviceName controlplane, metrics.exportInterval 60s,
    # logging.level info. telemetry.endpoint (URL OTLP коллектора) обязателен при включённом
    # экспорте. service.instance.id — имя pod (POD_NAME); его и service.name resourceAttributes не задают.
    # telemetry:
    #   endpoint: http://alloy.nomnom-observability.svc.cluster.local:4317
    #   protocol: grpc
    #   resourceAttributes:
    #     deployment.environment.name: kind
    # tracing:
    #   enabled: true
    # metrics:
    #   enabled: true
    #   exportInterval: 60s
    # logging:
    #   level: info

# Секреты окружения (Kubernetes Secret); несекретная конфигурация — только config.spec.
envFrom: []
extraEnv: []

# Больше config.spec.shutdown.readinessDelay + drainTimeout; chart проверяет.
terminationGracePeriodSeconds: 30

startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
