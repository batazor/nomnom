# Default values for controlplane.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы, адреса
# внешних систем и kind-specific настройки задаются values окружения или --set.

image:
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/controlplane
  # Tag образа задаёт окружение; без него chart не рендерится (service.version telemetry).
  tag: ""
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common.
global: {}

# Label app.kubernetes.io/component.
component: controller

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Токен ServiceAccount для Kubernetes API: control plane читает реестр и применяет маршруты
  # публичного gateway (ADR 41, routes.*).
  automount: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: gcr.io/distroless/static-debian12:nonroot (65532).
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true

# Requests/limits задаёт окружение. GOMAXPROCS и GOMEMLIMIT (automemlimit) следуют limits.
resources:
  requests: {}
  limits: {}

# Несекретная конфигурация: ConfigMap, подключаемый через envFrom.
env: {}
envFrom: []
extraEnv: []

# Технический порт runtime contract (docs/cloud-native-runtime.md): /health/*. Имя metrics
# задано моделью NetworkPolicy (ADR 16).
management:
  port: 9086

# Бюджет graceful shutdown (SHUTDOWN__READINESS_DELAY, SHUTDOWN__DRAIN_TIMEOUT).
shutdown:
  readinessDelaySeconds: 5
  drainTimeoutSeconds: 20

# Больше readinessDelaySeconds + drainTimeoutSeconds; chart проверяет.
terminationGracePeriodSeconds: 30

startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Маршруты публичного gateway (ADR 41): неймспейс HTTPRoute, Gateway и listener клиентского
# трафика. Все поля обязательны. Chart выдаёт ServiceAccount Role в этом неймспейсе: server-side
# apply и watch HTTPRoute, HTTPRouteFilter и ConfigMap, удаление HTTPRoute.
routes:
  namespace: ""
  gateway: ""
  listener: ""

# ADR 9: OTel resource attributes процесса.
telemetry:
  serviceName: controlplane
  resourceAttributes: {}
  # OTLP gRPC endpoint Alloy (OTEL_EXPORTER_OTLP_ENDPOINT); пусто — задаётся env окружения.
  otlpEndpoint: ""
  # LOG__LEVEL: debug | info | warn | error; пусто — info.
  logLevel: ""
