syntax = "proto3";

package nomnom.controlplane.v1;

import "nomnom/controlplane/v1/controlplane.proto";

// Registry of Cells, Markets and Market Placements (ADR 41). Never on the hot
// path: it publishes the routes of the public gateway, and neither the gateway
// nor the Cells call it.
service ControlPlaneService {
  // Writes require platform#manage_markets. A repeat with the same values
  // succeeds with created = false; other values (time zone included) for a known id are
  // ALREADY_EXISTS. CreateMarket of an unknown cell_id is FAILED_PRECONDITION.
  // After the write, including a repeat, the routes of the public gateway are
  // applied from the registry; when that fails the call is UNAVAILABLE
  // (ROUTES_UNAVAILABLE), the write stays and a repeat applies them again.
  rpc RegisterCell(RegisterCellRequest) returns (RegisterCellResponse);
  rpc CreateMarket(CreateMarketRequest) returns (CreateMarketResponse);
  // Archives a Market: it leaves ListMarkets and the public gateway, its id
  // is never created again (CreateMarket is ALREADY_EXISTS, MARKET_ARCHIVED).
  // A repeat succeeds with archived = false; an unknown market_id is
  // NOT_FOUND. Routes are applied as after the other writes.
  rpc ArchiveMarket(ArchiveMarketRequest) returns (ArchiveMarketResponse);

  // Requires platform#manage_markets. Archived Markets are not listed.
  rpc ListMarkets(ListMarketsRequest) returns (ListMarketsResponse);
}

message RegisterCellRequest {
  reserved 2;
  reserved "gateway_address";

  string cell_id = 1;
  ServiceRef router = 3;
}

message RegisterCellResponse {
  Cell cell = 1;
  bool created = 2;
}

message CreateMarketRequest {
  string market_id = 1;
  // 1..64 characters after trim.
  string name = 2;
  string currency = 3;
  string cell_id = 4;
  // Required IANA time zone (Europe/Berlin); empty or unknown is
  // INVALID_ARGUMENT.
  string time_zone = 5;
}

message CreateMarketResponse {
  Market market = 1;
  bool created = 2;
}

message ArchiveMarketRequest {
  string market_id = 1;
}

message ArchiveMarketResponse {
  // False when the Market was archived already.
  bool archived = 1;
}

message ListMarketsRequest {}

message ListMarketsResponse {
  // By name, then by market_id.
  repeated Market markets = 1;
}
