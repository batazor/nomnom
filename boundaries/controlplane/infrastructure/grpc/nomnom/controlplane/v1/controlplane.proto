syntax = "proto3";

package nomnom.controlplane.v1;

// Kubernetes Service of the Cosmo Router of a Cell: the entry of the Cell for
// clients that the public gateway routes Markets to (ADR 41).
message ServiceRef {
  // DNS-1123 label.
  string namespace = 1;
  // DNS-1123 label.
  string name = 2;
  // 1..65535.
  int32 port = 3;
}

// Cell: a complete isolated instance of the data plane (ADR 41).
message Cell {
  reserved 2;
  reserved "gateway_address";

  // Slug ^[a-z][a-z0-9-]{1,31}$, immutable.
  string cell_id = 1;
  // Router of the Cell, immutable.
  ServiceRef router = 3;
}

// Market: a city served by one Cell (ADR 41).
message Market {
  // Slug ^[a-z][a-z0-9-]{1,31}$, immutable.
  string market_id = 1;
  string name = 2;
  // ISO 4217.
  string currency = 3;
  // Market Placement: the Cell that serves the Market.
  string cell_id = 4;
}
