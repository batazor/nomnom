# Пример локальной конфигурации controlplane: make run задаёт CONFIG_FILE=config.example.yaml и POD_NAME.
# Несекретные настройки — только из этого файла: переменные SECTION__KEY и OTEL_* не читаются.
# Неизвестный ключ, чужие apiVersion, kind или metadata.name — процесс не стартует. Секция routes
# обязательна. Реестр и маршруты публичного gateway доступны через in-cluster config ServiceAccount:
# вне кластера процесс не стартует.
apiVersion: config.nomnom.dev/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane
spec:
  management:
    port: 9086
  shutdown:
    readinessDelay: 0s
    drainTimeout: 5s
  routes:
    # ADR 41: маршруты Market и список Market публичного gateway.
    namespace: nomnom-gateway
    gateway: public
    listener: api
  telemetry:
    # OTLP коллектор; нужен, только если включён tracing или metrics.
    endpoint: http://localhost:4317
    protocol: grpc
    serviceName: controlplane
    resourceAttributes:
      deployment.environment.name: local
  tracing:
    enabled: false
  metrics:
    enabled: false
    exportInterval: 60s
  logging:
    level: info
