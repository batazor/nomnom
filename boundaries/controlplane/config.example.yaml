# Пример локальной конфигурации controlplane (CONFIG_FILE=config.example.yaml make run).
# Переменные окружения (SECTION__KEY) перекрывают файл. Секция routes обязательна: без неё
# процесс не стартует. Реестр и маршруты публичного gateway доступны через in-cluster config
# ServiceAccount: вне кластера процесс не стартует.
management:
  port: 9086
shutdown:
  readiness_delay: 0s
  drain_timeout: 5s
routes:
  # ADR 41: маршруты Market и список Market публичного gateway.
  namespace: nomnom-gateway
  gateway: public
  listener: api
