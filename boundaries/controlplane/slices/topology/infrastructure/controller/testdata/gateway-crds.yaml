# The resources the control plane applies, without their schema: k3s of the test has no Gateway API
# and no Envoy Gateway, and the schema of the real ones is checked by kind e2e.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutes.gateway.networking.k8s.io
  annotations:
    # The API server requires it for a *.k8s.io group.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api
spec:
  group: gateway.networking.k8s.io
  names:
    kind: HTTPRoute
    listKind: HTTPRouteList
    plural: httproutes
    singular: httproute
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutefilters.gateway.envoyproxy.io
spec:
  group: gateway.envoyproxy.io
  names:
    kind: HTTPRouteFilter
    listKind: HTTPRouteFilterList
    plural: httproutefilters
    singular: httproutefilter
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
