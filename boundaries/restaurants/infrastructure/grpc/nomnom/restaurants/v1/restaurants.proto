syntax = "proto3";

package nomnom.restaurants.v1;

message Restaurant {
  string restaurant_id = 1;
  string name = 2;
  bool is_open = 3;
  // The pickup address is dropped from the project.
  reserved 4;
  reserved "address";
}

// Exact amount: a decimal string with a dot separator and an ISO 4217 currency.
message Money {
  string amount = 1;
  string currency = 2;
}

message MenuItem {
  string menu_item_id = 1;
  string name = 2;
  // Empty when the item has no description.
  string description = 3;
  Money price = 4;
  bool available = 5;
}
