syntax = "proto3";

package nomnom.restaurants.v1;

import "google/protobuf/timestamp.proto";
import "nomnom/restaurants/v1/restaurants.proto";

service RestaurantsService {
  rpc GetRestaurant(GetRestaurantRequest) returns (GetRestaurantResponse);
  // Current menu of a restaurant: public data, no authorization (FR-216). A
  // restaurant without a menu is NOT_FOUND. Not a snapshot of a placed order.
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);
  // Public data of up to 100 restaurants in one call for pages that show
  // restaurants of many items (ADR 7): no authorization. An unknown id is
  // absent from the response; the caller matches by restaurant_id, not by
  // position. Empty or more than 100 ids is INVALID_ARGUMENT.
  rpc BatchGetRestaurants(BatchGetRestaurantsRequest) returns (BatchGetRestaurantsResponse);
  // Current menus of up to 100 restaurants in one call (ADR 7): public data, no
  // authorization. A restaurant without a menu is absent from the response;
  // the caller matches by restaurant_id. Empty or more than 100 ids is
  // INVALID_ARGUMENT.
  rpc BatchGetMenus(BatchGetMenusRequest) returns (BatchGetMenusResponse);
  // Restaurants available for selection: public data, no authorization
  // (FR-205, FR-496). Open restaurants only unless include_closed; paged by a
  // cursor ordered by restaurant id.
  rpc ListRestaurants(ListRestaurantsRequest) returns (ListRestaurantsResponse);
  // Restaurants owned by the calling user, open and closed, paged by a cursor
  // ordered by restaurant id. Requires a user subject: restaurant#manage =
  // owner, so the owner filter is the authorization; a service subject is
  // PERMISSION_DENIED.
  rpc ListOwnedRestaurants(ListOwnedRestaurantsRequest) returns (ListOwnedRestaurantsResponse);

  // Command RPCs of the Order Fulfillment Workflow of orders, idempotent by order_id.
  rpc ReceiveOrderRequest(ReceiveOrderRequestRequest) returns (ReceiveOrderRequestResponse);
  rpc CancelRestaurantOrder(CancelRestaurantOrderRequest) returns (CancelRestaurantOrderResponse);

  // Kitchen commands of restaurant staff over one Restaurant Order addressed by
  // restaurant_id and restaurant_order_id. They require restaurant#operate_kitchen;
  // an order of another restaurant is NOT_FOUND, a forbidden transition is
  // FAILED_PRECONDITION. A repeated MarkRestaurantOrderReady succeeds without a
  // new fact; other repeats are FAILED_PRECONDITION.
  rpc AcceptRestaurantOrder(AcceptRestaurantOrderRequest) returns (AcceptRestaurantOrderResponse);
  rpc RejectRestaurantOrder(RejectRestaurantOrderRequest) returns (RejectRestaurantOrderResponse);
  // Starts the head of the Kitchen Queue of the restaurant (FR-225): the
  // kitchen does not choose the order. The head is a premium order or a
  // standard one waiting longer than the aging limit, then the other standard
  // ones, FIFO by queued_at inside a class. It assigns the free cook on line
  // with the earliest last assignment; without a free cook it is
  // RESOURCE_EXHAUSTED and the queue stays as it was. An empty queue starts
  // nothing: the response has no restaurant_order. A repeat with the same
  // request_id starts no other order and answers with the order the first
  // call started.
  rpc StartNextPreparation(StartNextPreparationRequest) returns (StartNextPreparationResponse);
  rpc MarkRestaurantOrderAssembled(MarkRestaurantOrderAssembledRequest) returns (MarkRestaurantOrderAssembledResponse);
  rpc MarkRestaurantOrderReady(MarkRestaurantOrderReadyRequest) returns (MarkRestaurantOrderReadyResponse);
  rpc ReportPreparationDelay(ReportPreparationDelayRequest) returns (ReportPreparationDelayResponse);
  rpc ReportPreparationFailure(ReportPreparationFailureRequest) returns (ReportPreparationFailureResponse);

  // Kitchen Queue of a restaurant (FR-583): Restaurant Orders in QUEUED in the
  // order recommended by the Kitchen Queue policy. Requires
  // restaurant#operate_kitchen. Orders in RECEIVED awaiting Acceptance are not
  // in the queue.
  rpc GetKitchenQueue(GetKitchenQueueRequest) returns (GetKitchenQueueResponse);
  // Incoming orders of a restaurant (FR-586): Restaurant Orders in RECEIVED
  // awaiting Accept or Reject, by ascending received_at, then by id. Requires
  // restaurant#operate_kitchen. An accepted order leaves this list.
  rpc ListIncomingOrders(ListIncomingOrdersRequest) returns (ListIncomingOrdersResponse);
  // Active orders of a restaurant's kitchen board: Restaurant Orders in
  // RECEIVED, QUEUED, PREPARING, ASSEMBLED and READY with their items, by
  // ascending received_at, then by id. Requires restaurant#operate_kitchen.
  // The recommended order of the QUEUED ones is GetKitchenQueue.
  rpc ListActiveRestaurantOrders(ListActiveRestaurantOrdersRequest) returns (ListActiveRestaurantOrdersResponse);

  // Restaurant administration. RegisterRestaurant requires platform#register_restaurant
  // and writes restaurant#owner; AssignStaff/RevokeStaff require restaurant#manage
  // and write restaurant#staff before saving. Staff commands are idempotent.
  rpc RegisterRestaurant(RegisterRestaurantRequest) returns (RegisterRestaurantResponse);
  // Name and premium fee of a restaurant (FR-202, FR-649); requires
  // restaurant#manage. Publishes no business fact.
  rpc UpdateRestaurant(UpdateRestaurantRequest) returns (UpdateRestaurantResponse);
  rpc AssignStaff(AssignStaffRequest) returns (AssignStaffResponse);
  rpc RevokeStaff(RevokeStaffRequest) returns (RevokeStaffResponse);

  // Opening of a restaurant for new Restaurant Orders (FR-203). Both require
  // restaurant#manage and write RestaurantOpened/RestaurantClosed to the Outbox
  // in the same Unit of Work. A repeat succeeds with changed = false and no new
  // fact (AC-209). An unknown restaurant is NOT_FOUND.
  rpc OpenRestaurant(OpenRestaurantRequest) returns (OpenRestaurantResponse);
  rpc CloseRestaurant(CloseRestaurantRequest) returns (CloseRestaurantResponse);

  // Menu management (FR-210..FR-215). All require restaurant#manage_menu
  // (owner or staff). CreateMenu of a restaurant that has a menu is
  // ALREADY_EXISTS; a missing restaurant, menu or menu item is NOT_FOUND; an
  // invalid name or price is INVALID_ARGUMENT. AddMenuItem is not idempotent:
  // every call adds a new item. UpdateMenuItem and SetMenuItemAvailability
  // repeating the current values succeed with changed = false; a change of
  // availability writes MenuItemAvailabilityChanged to the Outbox.
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuResponse);
  rpc AddMenuItem(AddMenuItemRequest) returns (AddMenuItemResponse);
  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (UpdateMenuItemResponse);
  rpc SetMenuItemAvailability(SetMenuItemAvailabilityRequest) returns (SetMenuItemAvailabilityResponse);

  // Cook Pool of a restaurant (FR-614..FR-616). Commands require
  // restaurant#manage_cooks (owner or staff); an unknown restaurant or a cook of
  // another restaurant is NOT_FOUND, an empty or longer than 64 characters name
  // is INVALID_ARGUMENT. A new cook is off line. Repeating the current line or
  // retirement succeeds with changed = false. TakeCookOffLine of a cook holding
  // a PREPARING or ASSEMBLED order and RetireCook of a cook on line are
  // FAILED_PRECONDITION; a retired cook cannot go on line (FAILED_PRECONDITION).
  // Every change pushes kitchenChanged of the restaurant (ADR 36).
  rpc HireCook(HireCookRequest) returns (HireCookResponse);
  rpc PutCookOnLine(PutCookOnLineRequest) returns (PutCookOnLineResponse);
  rpc TakeCookOffLine(TakeCookOffLineRequest) returns (TakeCookOffLineResponse);
  rpc RetireCook(RetireCookRequest) returns (RetireCookResponse);
  // Pool Load and cooks of a restaurant (FR-616). Requires
  // restaurant#view_orders.
  rpc GetCookPool(GetCookPoolRequest) returns (GetCookPoolResponse);

  // Demo Simulator (FR-604): state of the kitchen simulator of this service; both
  // require platform#operate_simulator, otherwise PERMISSION_DENIED.
  rpc GetSimulator(GetSimulatorRequest) returns (GetSimulatorResponse);
  rpc SetSimulatorEnabled(SetSimulatorEnabledRequest) returns (SetSimulatorEnabledResponse);
}

message GetRestaurantRequest {
  string restaurant_id = 1;
}

message GetRestaurantResponse {
  Restaurant restaurant = 1;
}

message GetMenuRequest {
  string restaurant_id = 1;
}

message GetMenuResponse {
  repeated MenuItem items = 1;
}

message BatchGetRestaurantsRequest {
  // 1..100 ids; repeats are read once.
  repeated string restaurant_ids = 1;
}

message BatchGetRestaurantsResponse {
  // Found restaurants in no particular order.
  repeated Restaurant restaurants = 1;
}

message BatchGetMenusRequest {
  // 1..100 ids; repeats are read once.
  repeated string restaurant_ids = 1;
}

// Current menu of one restaurant.
message RestaurantMenu {
  string restaurant_id = 1;
  repeated MenuItem items = 2;
}

message BatchGetMenusResponse {
  // Menus of the restaurants that have one, in no particular order.
  repeated RestaurantMenu menus = 1;
}

message ListRestaurantsRequest {
  // 1..100; 0 means the default of 50.
  int32 page_size = 1;
  // next_page_token of the previous page; empty for the first page.
  string page_token = 2;
  bool include_closed = 3;
  // Required (ADR 41): only Restaurants of this Market.
  string market_id = 4;
}

message ListRestaurantsResponse {
  repeated Restaurant restaurants = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message ListOwnedRestaurantsRequest {
  // 1..100; 0 means the default of 50.
  int32 page_size = 1;
  // next_page_token of the previous page; empty for the first page.
  string page_token = 2;
  // Required (ADR 41): only Restaurants of this Market.
  string market_id = 3;
}

message ListOwnedRestaurantsResponse {
  repeated Restaurant restaurants = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message OrderRequestItem {
  string menu_item_id = 1;
  int32 quantity = 2;
}

message ReceiveOrderRequestRequest {
  string restaurant_id = 1;
  string order_id = 2;
  repeated OrderRequestItem items = 3;
  // Required: the priority chosen at Place Order (FR-651).
  OrderPriority priority = 4;
}

message ReceiveOrderRequestResponse {
  string restaurant_order_id = 1;
  // false when the request repeated an already received order.
  bool created = 2;
}

message CancelRestaurantOrderRequest {
  string restaurant_id = 1;
  string order_id = 2;
  string reason = 3;
}

message CancelRestaurantOrderResponse {
  string restaurant_order_id = 1;
  // true when the order is cancelled, including a repeated cancellation.
  bool cancelled = 2;
  // Business reason when cancellation is rejected by stage, for example already_ready.
  string rejection_reason = 3;
}

enum RestaurantOrderState {
  RESTAURANT_ORDER_STATE_UNSPECIFIED = 0;
  RESTAURANT_ORDER_STATE_RECEIVED = 1;
  RESTAURANT_ORDER_STATE_ACCEPTED = 2;
  RESTAURANT_ORDER_STATE_QUEUED = 3;
  RESTAURANT_ORDER_STATE_PREPARING = 4;
  RESTAURANT_ORDER_STATE_ASSEMBLED = 5;
  RESTAURANT_ORDER_STATE_READY = 6;
  RESTAURANT_ORDER_STATE_REJECTED = 7;
  RESTAURANT_ORDER_STATE_CANCELLED = 8;
  RESTAURANT_ORDER_STATE_FAILED = 9;
  // The courier took a READY order (DeliveryPickedUp of delivery); off the kitchen board.
  RESTAURANT_ORDER_STATE_PICKED_UP = 10;
}

// Premium Priority of the order (FR-651): a premium order is started first.
enum OrderPriority {
  ORDER_PRIORITY_UNSPECIFIED = 0;
  ORDER_PRIORITY_STANDARD = 1;
  ORDER_PRIORITY_PREMIUM = 2;
}

// Restaurant Order after a kitchen command or in the Kitchen Queue.
message RestaurantOrder {
  string restaurant_order_id = 1;
  string order_id = 2;
  string restaurant_id = 3;
  RestaurantOrderState state = 4;
  // Unset until Acceptance.
  google.protobuf.Timestamp expected_ready_at = 5;
  int64 version = 6;
  // Cook assigned by StartNextPreparation; empty before it. Kept after the
  // order is closed.
  string cook_id = 7;
  OrderPriority priority = 8;
}

message AcceptRestaurantOrderRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
  // Срок готовности, который называет кухня; не задан — его считает Ready Time
  // Estimator (FR-609). Должен быть позже момента принятия.
  google.protobuf.Timestamp expected_ready_at = 3;
}

message AcceptRestaurantOrderResponse {
  RestaurantOrder restaurant_order = 1;
}

message RejectRestaurantOrderRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
  // Optional opaque reason.
  string reason = 3;
}

message RejectRestaurantOrderResponse {
  RestaurantOrder restaurant_order = 1;
}

message StartNextPreparationRequest {
  string restaurant_id = 1;
  // Chosen by the caller per attempt and reused on a manual retry: a repeat
  // with it starts no other order.
  string request_id = 2;
}

message StartNextPreparationResponse {
  // The started order; unset when the Kitchen Queue is empty.
  RestaurantOrder restaurant_order = 1;
}

message MarkRestaurantOrderAssembledRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
}

message MarkRestaurantOrderAssembledResponse {
  RestaurantOrder restaurant_order = 1;
}

message MarkRestaurantOrderReadyRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
}

message MarkRestaurantOrderReadyResponse {
  RestaurantOrder restaurant_order = 1;
}

message ReportPreparationDelayRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
  // Required; later than the current expected_ready_at and now.
  google.protobuf.Timestamp expected_ready_at = 3;
  // Optional opaque category for analytics.
  string reason = 4;
}

message ReportPreparationDelayResponse {
  RestaurantOrder restaurant_order = 1;
}

message ReportPreparationFailureRequest {
  string restaurant_id = 1;
  string restaurant_order_id = 2;
  // Required opaque reason, for example ITEM_UNAVAILABLE.
  string reason = 3;
}

message ReportPreparationFailureResponse {
  RestaurantOrder restaurant_order = 1;
}

message GetKitchenQueueRequest {
  string restaurant_id = 1;
}

message KitchenQueueEntry {
  // State QUEUED, expected_ready_at and version of the order.
  RestaurantOrder restaurant_order = 1;
  google.protobuf.Timestamp accepted_at = 2;
  google.protobuf.Timestamp queued_at = 3;
}

message GetKitchenQueueResponse {
  // In the recommended order; empty when nothing is queued.
  repeated KitchenQueueEntry entries = 1;
}

message ListIncomingOrdersRequest {
  string restaurant_id = 1;
}

// Line of a Restaurant Order as the kitchen prepares it.
message RestaurantOrderItem {
  string menu_item_id = 1;
  int32 quantity = 2;
  repeated string options = 3;
}

message IncomingOrder {
  // State RECEIVED and version of the order; expected_ready_at is unset.
  RestaurantOrder restaurant_order = 1;
  repeated RestaurantOrderItem items = 2;
  // Unset only on orders received before the time was recorded.
  google.protobuf.Timestamp received_at = 3;
}

message ListIncomingOrdersResponse {
  // By ascending received_at; empty when nothing awaits a decision.
  repeated IncomingOrder orders = 1;
}

message ListActiveRestaurantOrdersRequest {
  string restaurant_id = 1;
}

message ActiveRestaurantOrder {
  // State, expected_ready_at (unset until Acceptance) and version of the order.
  RestaurantOrder restaurant_order = 1;
  repeated RestaurantOrderItem items = 2;
  // Unset only on orders received before the time was recorded.
  google.protobuf.Timestamp received_at = 3;
  // Time of Acceptance; unset before it (RECEIVED). With expected_ready_at it
  // bounds the cooking progress of the order.
  google.protobuf.Timestamp accepted_at = 4;
}

message ListActiveRestaurantOrdersResponse {
  // By ascending received_at, then by id; empty when the kitchen has no work.
  repeated ActiveRestaurantOrder orders = 1;
}

message RegisterRestaurantRequest {
  string name = 1;
  string owner_id = 2;
  // The pickup address is dropped from the project.
  reserved 3;
  reserved "address";
  // Required (ADR 41): Market of the new Restaurant.
  string market_id = 4;
}

message RegisterRestaurantResponse {
  Restaurant restaurant = 1;
  int64 version = 2;
}

message UpdateRestaurantRequest {
  string restaurant_id = 1;
  string name = 2;
  // Premium fee to set (FR-649); at most one of premium_fee and
  // clear_premium_fee. Neither keeps the current fee.
  Money premium_fee = 3;
  // Removes the premium option of the restaurant.
  bool clear_premium_fee = 4;
}

message UpdateRestaurantResponse {
  Restaurant restaurant = 1;
  int64 version = 2;
  // False when the restaurant already had this data.
  bool changed = 3;
}

message AssignStaffRequest {
  string restaurant_id = 1;
  string user_id = 2;
}

message AssignStaffResponse {
  string restaurant_id = 1;
  // User ids of the staff after the command, sorted.
  repeated string staff = 2;
  // false when the user was already staff.
  bool changed = 3;
}

message RevokeStaffRequest {
  string restaurant_id = 1;
  string user_id = 2;
}

message RevokeStaffResponse {
  string restaurant_id = 1;
  repeated string staff = 2;
  // false when the user was not staff.
  bool changed = 3;
}

message OpenRestaurantRequest {
  string restaurant_id = 1;
}

message OpenRestaurantResponse {
  Restaurant restaurant = 1;
  // Version of the restaurant after the command.
  int64 version = 2;
  // false when the restaurant was already open.
  bool changed = 3;
}

message CloseRestaurantRequest {
  string restaurant_id = 1;
}

message CloseRestaurantResponse {
  Restaurant restaurant = 1;
  int64 version = 2;
  // false when the restaurant was already closed.
  bool changed = 3;
}

message CreateMenuRequest {
  string restaurant_id = 1;
}

message CreateMenuResponse {
  string menu_id = 1;
  string restaurant_id = 2;
  int64 version = 3;
}

message AddMenuItemRequest {
  string restaurant_id = 1;
  // Required, not blank.
  string name = 2;
  // Optional; empty means no description.
  string description = 3;
  // Required.
  Money price = 4;
  // Defaults to true when unset.
  optional bool available = 5;
}

message AddMenuItemResponse {
  string menu_id = 1;
  MenuItem menu_item = 2;
  // Version of the menu after the command.
  int64 version = 3;
}

message UpdateMenuItemRequest {
  string restaurant_id = 1;
  string menu_item_id = 2;
  // Unset fields stay unchanged.
  optional string name = 3;
  // An empty value removes the description.
  optional string description = 4;
  Money price = 5;
  optional bool available = 6;
}

message UpdateMenuItemResponse {
  string menu_id = 1;
  MenuItem menu_item = 2;
  int64 version = 3;
  // false when the request repeated the current values.
  bool changed = 4;
}

message SetMenuItemAvailabilityRequest {
  string restaurant_id = 1;
  string menu_item_id = 2;
  bool available = 3;
}

message SetMenuItemAvailabilityResponse {
  string menu_id = 1;
  MenuItem menu_item = 2;
  int64 version = 3;
  // false when the item already had this availability.
  bool changed = 4;
}

message GetSimulatorRequest {}

message GetSimulatorResponse {
  bool enabled = 1;
}

message SetSimulatorEnabledRequest {
  bool enabled = 1;
}

message SetSimulatorEnabledResponse {
  bool enabled = 1;
}

message Cook {
  string cook_id = 1;
  string restaurant_id = 2;
  string name = 3;
  bool on_line = 4;
  // Order in PREPARING or ASSEMBLED held by the cook; empty when free.
  string current_restaurant_order_id = 5;
}

message HireCookRequest {
  string restaurant_id = 1;
  string name = 2;
}

message HireCookResponse {
  Cook cook = 1;
}

message PutCookOnLineRequest {
  string restaurant_id = 1;
  string cook_id = 2;
}

message PutCookOnLineResponse {
  Cook cook = 1;
  bool changed = 2;
}

message TakeCookOffLineRequest {
  string restaurant_id = 1;
  string cook_id = 2;
}

message TakeCookOffLineResponse {
  Cook cook = 1;
  bool changed = 2;
}

message RetireCookRequest {
  string restaurant_id = 1;
  string cook_id = 2;
}

message RetireCookResponse {
  bool changed = 1;
}

message GetCookPoolRequest {
  string restaurant_id = 1;
}

message GetCookPoolResponse {
  // Cooks that are not retired.
  int32 size = 1;
  int32 on_line = 2;
  // Cooks holding an order in PREPARING or ASSEMBLED.
  int32 busy = 3;
  // Orders of the restaurant in QUEUED: the backlog of the pool.
  int32 queued = 4;
  // Not retired cooks by name, then by id.
  repeated Cook cooks = 5;
}
