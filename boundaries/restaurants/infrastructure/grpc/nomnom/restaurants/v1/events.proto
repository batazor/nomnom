syntax = "proto3";

package nomnom.restaurants.v1;

import "google/protobuf/timestamp.proto";

// Integration Events контекста restaurants (ADR 25, ADR 28). Envelope (event_id,
// event_type, occurred_at, aggregate_*) передаётся в Kafka headers; event_type —
// полное имя сообщения ниже, partition key — aggregate_id. Один стрим на
// aggregate, чтобы порядок по aggregate_id сохранялся:
//   restaurants.v1.restaurant-order-events — Kitchen Order (RestaurantOrder);
//   restaurants.v1.restaurant-events       — Restaurant (RestaurantOpened, RestaurantClosed,
//                                            RestaurantWaitLevelChanged);
//   restaurants.v1.menu-events             — Menu (MenuItemAdded, MenuItemUpdated,
//                                            MenuItemAvailabilityChanged).

// --- restaurants.v1.restaurant-order-events (aggregate_id — Kitchen Order) ---

// Ресторан принял Kitchen Order (Order Acceptance); expected_ready_at —
// ожидаемая готовность на момент принятия (FR-609).
message RestaurantOrderAccepted {
  string order_id = 1;
  google.protobuf.Timestamp expected_ready_at = 2;
  // Market of the aggregate (ADR 41).
  string market_id = 3;
  // Restaurant of the order: Wait Time Statistics of the restaurant (FR-656).
  string restaurant_id = 4;
  // Set when the order joined the Kitchen Queue in the same Unit of Work as
  // its Acceptance (an order without a delivery window): the start of its
  // Wait Time Statistics duration (FR-644). Unset for a scheduled order,
  // which stays ACCEPTED until QueueRestaurantOrder.
  google.protobuf.Timestamp queued_at = 5;
}

// Ресторан отказался принять Kitchen Order.
message RestaurantOrderRejected {
  string order_id = 1;
  string reason = 2;
  // Market of the aggregate (ADR 41).
  string market_id = 3;
}

// Начато Preparation.
message PreparationStarted {
  string order_id = 1;
  // Market of the aggregate (ADR 41).
  string market_id = 2;
  // Restaurant of the order: Wait Time Statistics of the restaurant (FR-644).
  string restaurant_id = 3;
  // When the order joined the Kitchen Queue: a scheduled order enters the
  // Wait Time Statistics with it, since its queuing publishes no fact.
  google.protobuf.Timestamp queued_at = 4;
}

// Preparation задерживается; expected_ready_at — новая ожидаемая готовность.
message PreparationDelayed {
  string order_id = 1;
  google.protobuf.Timestamp expected_ready_at = 2;
  // Market of the aggregate (ADR 41).
  string market_id = 3;
}

// Preparation не может быть завершено.
message PreparationFailed {
  string order_id = 1;
  string reason = 2;
  // Market of the aggregate (ADR 41).
  string market_id = 3;
  // Restaurant of the order: Wait Time Statistics of the restaurant (FR-656).
  string restaurant_id = 4;
}

// Kitchen Order готов к Pickup.
message RestaurantOrderReady {
  string order_id = 1;
  // Market of the aggregate (ADR 41).
  string market_id = 2;
  // Restaurant of the order: Wait Time Statistics of the restaurant (FR-656).
  string restaurant_id = 3;
}

// Kitchen Order отменён по запросу orders (Cancel Restaurant Order);
// preparation_started — отмена произошла после начала Preparation.
message RestaurantOrderCancelled {
  string order_id = 1;
  string reason = 2;
  bool preparation_started = 3;
  // Market of the aggregate (ADR 41).
  string market_id = 4;
  // Restaurant of the order: Wait Time Statistics of the restaurant (FR-656).
  string restaurant_id = 5;
}

// --- restaurants.v1.restaurant-events (aggregate_type Restaurant, aggregate_id —
// restaurant_id) ---

// Ресторан открыт для новых Restaurant Order (Open Restaurant).
message RestaurantOpened {
  string restaurant_id = 1;
  // Market of the aggregate (ADR 41).
  string market_id = 2;
}

// Ресторан закрыт для новых Restaurant Order (Close Restaurant); уже полученные
// и принятые заказы не отменяются.
message RestaurantClosed {
  string restaurant_id = 1;
  // Market of the aggregate (ADR 41).
  string market_id = 2;
}

// Уровень ожидания ресторана сменился (Wait Time Statistics, FR-646):
// elevated — текущее ожидание повышено относительно базового времени ресторана.
// aggregate_type RestaurantWaitTime, aggregate_id — restaurant_id.
message RestaurantWaitLevelChanged {
  string restaurant_id = 1;
  // Market of the restaurant (ADR 41).
  string market_id = 2;
  bool elevated = 3;
}

// --- restaurants.v1.menu-events (aggregate_type Menu, aggregate_id — menu_id) ---

// В меню добавлен Menu Item (Add Menu Item). Состав и цену соседи читают через
// GetMenu: событие несёт только ключи.
message MenuItemAdded {
  string menu_id = 1;
  string restaurant_id = 2;
  string menu_item_id = 3;
  // Market of the aggregate (ADR 41).
  string market_id = 4;
}

// Изменились название, описание или цена Menu Item (Update Menu Item). Новые
// значения соседи читают через GetMenu; заказ хранит снимок цены на момент
// Place Order, поэтому уже оформленные заказы не меняются.
message MenuItemUpdated {
  string menu_id = 1;
  string restaurant_id = 2;
  string menu_item_id = 3;
  // Market of the aggregate (ADR 41).
  string market_id = 4;
}

// Изменилась доступность Menu Item (Set Menu Item Availability или Update Menu
// Item с новой доступностью); available — новое значение.
message MenuItemAvailabilityChanged {
  string menu_id = 1;
  string restaurant_id = 2;
  string menu_item_id = 3;
  bool available = 4;
  // Market of the aggregate (ADR 41).
  string market_id = 5;
}
