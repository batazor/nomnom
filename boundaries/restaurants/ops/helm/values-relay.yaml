# Outbox relay restaurants (ADR 13, ADR 31): отдельный release того же chart, один активный экземпляр.
#   helm upgrade --install restaurants-relay ops/helm -f ops/helm/values-relay.yaml
# Kafka и хранилище задаются values окружения (env KAFKA__*, OUTBOX__*).
component: relay

# Advisory lock / lease держит один активный экземпляр; replicas — только failover.
replicaCount: 1

command: ["/usr/bin/tini", "--", "node", "dist/cmd/restaurants-relay/main.js"]

service:
  enabled: false

telemetry:
  serviceName: restaurants-relay

mongodb:
  pool:
    # Один батч Outbox за цикл плюс продление lease и очистка.
    maxPoolSize: 3
  # Коллекции и индексы создаёт init container release restaurants.
  migrate:
    enabled: false
