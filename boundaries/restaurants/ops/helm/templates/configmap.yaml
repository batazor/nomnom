{{- /*
Файл конфигурации процесса (ADR 17), смонтированный в /etc/nomnom/config.yaml. Только
несекретная конфигурация: секреты подключаются внешними Kubernetes Secret через env
(restaurants.secretEnv), envFrom или extraEnv[].valueFrom и этим chart не создаются.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "restaurants.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
data:
  config.yaml: |
    {{- include "restaurants.configFile" . | nindent 4 }}
