{{- /*
ADR 37: коннектор Debezium, который доставляет Outbox restaurants из change streams MongoDB
в Kafka. Конфигурация — cdc.connector (контракт Outbox, общий для окружений) плюс
cdc.connectionString (ссылка config provider Kafka Connect на URI replica set). Ресурс KafkaConnector (FR-538) кладёт её в Kafka Connect (PUT /connectors/<name>/config: создаёт или
обновляет). Release без cdc.enabled (consumer) коннектор не трогает.
*/ -}}
{{- if .Values.cdc.enabled }}
{{- $name := required "cdc.connector.name is required" .Values.cdc.connector.name }}
{{- $cluster := required "cdc.connect.cluster is required (FR-538)" .Values.cdc.connect.cluster }}
{{- $namespace := required "cdc.connect.namespace is required (FR-538)" .Values.cdc.connect.namespace }}
{{- $config := merge (dict
      "transforms.schema.registry.url" (required "cdc.schemaRegistryUrl is required (FR-714)" .Values.cdc.schemaRegistryUrl)
      "mongodb.connection.string" (required "cdc.connectionString is required" .Values.cdc.connectionString))
    .Values.cdc.connector.config }}
{{- $class := required "cdc.connector.config.connector.class is required" (index $config "connector.class") }}
# Ресурс в namespace KafkaConnect: Strimzi читает KafkaConnector только там. connector.class —
# поле class ресурса, а не конфигурация.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
    {{- include "restaurants.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  class: {{ $class }}
  tasksMax: 1
  # Задача в FAILED (запись без схемы, FR-718; publication, которую миграция ещё не создала)
  # перезапускается с backoff без деплоя.
  autoRestart:
    enabled: true
  config:
    {{- omit $config "connector.class" | toYaml | nindent 4 }}
{{- end }}
