apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "restaurants.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Изменение файла конфигурации перезапускает pod: subPath-монтирование не обновляется.
        checksum/config: {{ include "restaurants.configFile" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "restaurants.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "restaurants.validateShutdownBudget" . }}
      {{- include "restaurants.validateIdentity" . }}
      {{- include "restaurants.validateSpiceDb" . }}
      {{- include "restaurants.validateMongoDb" . }}
      {{- include "restaurants.validateValkey" . }}
      {{- include "restaurants.validateTelemetry" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "restaurants.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "restaurants.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.service.enabled }}
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ include "restaurants.managementPort" . }}
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          env:
            # Файл конфигурации процесса (ADR 17); env SECTION__KEY несекретных настроек процесс не читает.
            - name: CONFIG_FILE
              value: /etc/nomnom/config.yaml
            # service.instance.id телеметрии — имя pod (downward API).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "restaurants.secretEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nomnom/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.identity.jwksConfigMap }}
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            - name: identity-user-jwks
              mountPath: /etc/nomnom/user-identity
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "common.names.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.identity.jwksConfigMap }}
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        - name: identity-user-jwks
          configMap:
            name: {{ .Values.identity.userJwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- end }}
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
