apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "restaurants.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.env .Values.podAnnotations }}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "restaurants.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "restaurants.validateShutdownBudget" . }}
      {{- include "restaurants.validateIdentity" . }}
      {{- include "restaurants.validateSpiceDb" . }}
      {{- include "restaurants.validateMongoDb" . }}
      {{- include "restaurants.validateTelemetry" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "restaurants.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      {{- if and .Values.mongodb.migrate.enabled .Values.mongodb.uriSecret.name }}
      # Коллекции, validators и индексы MongoDB до старта процесса (restaurants-migrate).
      initContainers:
        - name: migrate
          image: {{ include "restaurants.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.mongodb.migrate.command | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          env:
            {{- $migratePool := merge (dict "maxPoolSize" .Values.mongodb.migrate.maxPoolSize) (deepCopy .Values.mongodb.pool) }}
            {{- include "restaurants.mongodbEnv" (dict "context" . "pool" $migratePool) | trim | nindent 12 }}
            # JSON-логи миграции с тем же resource; OTLP-экспорта у init container нет.
            {{- include "restaurants.otelResourceEnv" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "restaurants.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.service.enabled }}
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.management.port }}
              protocol: TCP
          {{- if or .Values.env .Values.envFrom }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "common.names.fullname" . }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            - name: MANAGEMENT__PORT
              value: {{ .Values.management.port | quote }}
            - name: SHUTDOWN__READINESS_DELAY
              value: {{ printf "%ds" (int .Values.shutdown.readinessDelaySeconds) | quote }}
            - name: SHUTDOWN__DRAIN_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdown.drainTimeoutSeconds) | quote }}
            - name: SHUTDOWN__TELEMETRY_FLUSH_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdown.telemetryFlushTimeoutSeconds) | quote }}
            {{- include "restaurants.otelEnv" . | nindent 12 }}
            {{- if .Values.identity.jwksConfigMap }}
            - name: IDENTITY__ISSUER
              value: {{ .Values.identity.issuer | quote }}
            - name: IDENTITY__AUDIENCE
              value: {{ .Values.identity.audience | quote }}
            - name: IDENTITY__JWKS_FILE
              value: "/etc/nomnom/identity/jwks.json"
            - name: IDENTITY__SERVICE_ACCOUNTS
              value: {{ .Values.identity.serviceAccounts | quote }}
            {{- if .Values.identity.userJwksConfigMap }}
            - name: IDENTITY__USER_ISSUER
              value: {{ .Values.identity.userIssuer | quote }}
            - name: IDENTITY__USER_JWKS_FILE
              value: "/etc/nomnom/user-identity/jwks.json"
            - name: IDENTITY__USER_DELEGATES
              value: {{ .Values.identity.userDelegates | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.spicedb }}
            {{- if .endpoint }}
            - name: SPICEDB__ENDPOINT
              value: {{ .endpoint | quote }}
            - name: SPICEDB__INSECURE
              value: {{ .insecure | toString | quote }}
            - name: SPICEDB__TIMEOUT
              value: {{ .timeout | quote }}
            - name: SPICEDB__PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .presharedKeySecret.name | quote }}
                  key: {{ .presharedKeySecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- include "restaurants.mongodbEnv" (dict "context" . "pool" .Values.mongodb.pool) | trim | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.identity.jwksConfigMap }}
          volumeMounts:
            {{- if .Values.identity.jwksConfigMap }}
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            {{- if .Values.identity.userJwksConfigMap }}
            - name: identity-user-jwks
              mountPath: /etc/nomnom/user-identity
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.identity.jwksConfigMap }}
      volumes:
        {{- if .Values.identity.jwksConfigMap }}
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- if .Values.identity.userJwksConfigMap }}
        - name: identity-user-jwks
          configMap:
            name: {{ .Values.identity.userJwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
