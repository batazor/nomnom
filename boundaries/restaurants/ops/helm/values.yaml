# Default values for restaurants.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы,
# адреса внешних систем и kind-specific настройки задаются отдельными values-файлами
# или флагами --set при установке.

replicaCount: 1

image:
  # Имя образа из документации локальной сборки (docker build -t nomnom/<service>:local).
  # Registry и publishing pipeline ещё не определены и задаются values окружения.
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/restaurants
  # Tag образа задаётся окружением. Пустое значение означает "latest" — для реальных
  # окружений всегда задавайте tag явно.
  tag: ""
  # IfNotPresent позволяет использовать образ, загруженный в kind через kind load docker-image.
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common: global.imageRegistry,
# global.compatibility.openshift.adaptSecurityContext и т. п.
global: {}

# Label app.kubernetes.io/component.
component: api

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Доступ к Kubernetes API приложению не нужен. Включение token automount —
  # отдельное явное решение.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: node:24-bookworm-slim, пользователь node (1000). Числовой UID нужен для проверки runAsNonRoot.
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false

# Команда контейнера; пусто — CMD образа. Consumer-release задаёт свою (values-consumer.yaml).
command: []

service:
  # false — без Service и бизнес-порта контейнера (consumer).
  enabled: true
  type: ClusterIP
  # Порт Service и порт приложения. Приложение слушает 8082 по умолчанию
  # (переменная SERVER__PORT или PORT); targetPort должен совпадать с портом,
  # на котором фактически запускается процесс.
  port: 8082
  targetPort: 8082
  # Имя порта. Сейчас приложение отвечает по HTTP; при переходе на gRPC
  # Бизнес-порт обслуживает nomnom.restaurants.v1 по Connect/gRPC/HTTP2.
  portName: grpc
  appProtocol: kubernetes.io/h2c
  annotations: {}

# Requests/limits не задаются: профиль потребления приложения ещё не измерен.
resources:
  requests: {}
  limits: {}

# Несекретная конфигурация. Попадает в ConfigMap и подключается через envFrom.
# OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT и OTEL_RESOURCE_ATTRIBUTES задаются
# секцией telemetry, а не здесь. Пример:
# env:
#   KAFKA__BROKERS: kafka-kafka-bootstrap.nomnom-infra.svc.cluster.local:9092
env:
  # Окна доставки запланированных заказов (FR-694): обязательны для API restaurants, без default
  # в коде — пустое или невалидное значение останавливает старт. Ширина MUST делить 30 минут;
  # MIN_LEAD < MAX_HORIZON. MAX_HORIZON MUST быть меньше срока жизни Authorization hold у
  # payment provider (7 дней у карточных provider'ов), иначе запланированный заказ потребует
  # повторной Authorization.
  SCHEDULED_SLOT__WIDTH: 15m
  SCHEDULED_SLOT__MIN_LEAD: 45m
  SCHEDULED_SLOT__MAX_HORIZON: 48h
  SCHEDULED_SLOT__HOLD_TTL: 10m
  SCHEDULED_SLOT__ALTERNATIVES: "3"

# Дополнительные источники переменных окружения, в том числе внешние Secret:
# envFrom:
#   - secretRef:
#       name: restaurants-secrets
envFrom: []

# Отдельные переменные окружения, включая valueFrom из внешних Secret:
# extraEnv:
#   - name: SOME_TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: restaurants-secrets
#         key: token
extraEnv: []

# Технический порт runtime contract (docs/cloud-native-runtime.md): /health/* и metrics.
# Имя порта metrics задано моделью NetworkPolicy (ADR 16) и не меняется; номер передаётся
# приложению через MANAGEMENT__PORT. Порт не входит в Service и не публикуется через gateway.
management:
  port: 9082

# Бюджет graceful shutdown, передаётся приложению через SHUTDOWN__READINESS_DELAY,
# SHUTDOWN__DRAIN_TIMEOUT и SHUTDOWN__TELEMETRY_FLUSH_TIMEOUT. readinessDelaySeconds должен
# превышать время, за которое readinessProbe замечает not ready (periodSeconds ×
# failureThreshold), плюс распространение EndpointSlice и конфигурации internal gateway.
# telemetryFlushTimeoutSeconds — deadline финального экспорта traces и metrics после drain.
shutdown:
  readinessDelaySeconds: 5
  drainTimeoutSeconds: 20
  telemetryFlushTimeoutSeconds: 5

# Должен быть больше readinessDelaySeconds + drainTimeoutSeconds + telemetryFlushTimeoutSeconds
# с запасом на выход процесса; chart отказывается рендериться при нарушении.
terminationGracePeriodSeconds: 35

# OpenTelemetry (ADR 9, docs/observability.md). Chart задаёт OTEL_SERVICE_NAME,
# OTEL_RESOURCE_ATTRIBUTES (service.instance.id — имя pod через downward API,
# service.version — image.tag, плюс resourceAttributes) и, если endpoint задан,
# OTEL_EXPORTER_OTLP_ENDPOINT. Явные переменные chart перекрывают одноимённые из env
# (ConfigMap), поэтому OTEL_* через env не задаются.
telemetry:
  # service.name процесса: restaurants, restaurants-consumer.
  serviceName: restaurants
  # OTLP/gRPC endpoint Alloy для traces и metrics, например
  # http://alloy.nomnom-observability.svc.cluster.local:4317. Пусто — экспорт выключен,
  # W3C trace context всё равно передаётся; логи всегда идут JSON в stdout.
  endpoint: ""
  # Атрибуты окружения, например deployment.environment.name: local.
  resourceAttributes: {}

# Probes используют health contract на техническом порту. Поля, кроме enabled, передаются
# в Kubernetes как есть.
startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

# Liveness не зависит от внешних систем и остаётся успешной во время shutdown.
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# После SIGTERM readiness сразу отвечает 503; один провал исключает pod из endpoints.
readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

# Service identity по projected ServiceAccount token (ADR 27) и user assertions BFF (ADR 32).
# Для release с gRPC API (service.enabled) все значения ниже обязательны; ключ jwks.json
# jwksConfigMap монтируется read-only в /etc/nomnom/identity/jwks.json, ключ jwks.json
# userJwksConfigMap — в /etc/nomnom/user-identity/jwks.json.
identity:
  # Issuer токенов кластера (/.well-known/openid-configuration), например
  # https://kubernetes.default.svc.cluster.local.
  issuer: ""
  # Audience, которую вызывающие указывают в projected token для этого контекста.
  audience: "nomnom.restaurants"
  # Allowlist через запятую: namespace/serviceaccount=service-name,
  # например nomnom/orders-worker=orders-worker.
  serviceAccounts: ""
  # ConfigMap с ключом jwks.json — публичные ключи кластера (/openid/v1/jwks).
  jwksConfigMap: ""
  # ConfigMap с ключом jwks.json — публичные ключи BFF (EC P-256), в kind bff-jwks.
  userJwksConfigMap: ""
  # Ожидаемый iss assertion, например nomnom-bff.
  userIssuer: ""
  # Services через запятую, которым разрешено передавать user subject, например bff.
  userDelegates: ""

# Authorization через SpiceDB (ADR 18), обязательна: при пустом endpoint переменные SPICEDB__*
# не задаются и процесс restaurants падает на старте.
# Если endpoint задан, preshared key берётся только из Secret presharedKeySecret.
spicedb:
  # gRPC endpoint host:port, например spicedb.nomnom-authz.svc.cluster.local:50051.
  endpoint: ""
  # Plaintext gRPC без TLS — только kind и локальный запуск.
  insecure: false
  # Deadline одной проверки; ошибка или timeout — отказ UNAVAILABLE (fail closed).
  timeout: "2s"
  presharedKeySecret:
    # Существующий Secret с preshared key SpiceDB; обязателен при заданном endpoint.
    name: ""
    key: "preshared-key"

# Хранилище MongoDB (ADR 8, локальный ADR 1): replica set обязателен — Unit of Work
# использует multi-document транзакции. Пока uriSecret.name пуст, MONGODB__* не задаются
# и процесс не стартует (MONGODB__URI обязателен). Connection string (с учётными данными)
# берётся только из Secret.
mongodb:
  uriSecret:
    # Существующий Secret с connection string, например
    # mongodb://restaurants:<password>@mongodb-restaurants.nomnom-data.svc.cluster.local:27017/restaurants?replicaSet=rs0&authSource=restaurants
    name: ""
    key: "uri"
  database: "restaurants"
  # Server selection timeout при старте и запросах (500ms, 5s, 1m).
  timeout: "5s"
  # Connection pool MongoClient процесса (MONGODB__*), лимиты — на пул одного сервера
  # replica set (драйвер держит пул на каждый сервер). Значения вне диапазона
  # останавливают render chart и старт процесса. Метрики пула — db.client.connection.*
  # (docs/observability/metric-inventory.md#db).
  pool:
    # Соединений на сервер (1..100): API обслуживает конкурентные RPC, consumer — 5
    # (values-consumer.yaml).
    maxPoolSize: 20
    # Прогретые соединения; 0 — пул растёт по требованию и не держит idle-соединения.
    minPoolSize: 0
    # Idle-соединение закрывается после этого срока (500ms, 5s, 5m).
    maxIdleTime: "5m"
    # Ожидание свободного соединения до ошибки checkout (timeout вместо зависания).
    waitQueueTimeout: "5s"
    # Одновременно устанавливаемые соединения: сглаживает шторм подключений после рестарта.
    maxConnecting: 2

# Кеш чтения каталога (ADR 43, локальный ADR 3): GetRestaurant, GetMenu и ListRestaurants в Valkey.
# restaurants-consumer обновляет ключи по RestaurantOpened/Closed и MenuItemAvailabilityChanged
# сразу после commit, остальное устаревает до TTL. Пока urlSecret.name пуст, VALKEY__* не
# задаются и процессы не стартуют (VALKEY__URL обязателен). Недоступный Valkey процесс не
# останавливает: чтения идут в MongoDB мимо кеша.
valkey:
  urlSecret:
    # Существующий Secret с URL ACL-пользователя restaurants (ключи restaurants:*), например
    # redis://restaurants:<password>@valkey-restaurants.nomnom-data.svc.cluster.local:6379
    name: ""
    key: "url"
  # Deadline одной команды; истёк — чтение из MongoDB.
  commandTimeout: "50ms"
  # TTL записи: изменение без события (цена, название) видно не позже чем через это время.
  ttl: "1m"

# ADR 37: Outbox restaurants доставляет Debezium (Kafka Connect) из change streams MongoDB.
# Включается в одном release контекста (API): chart создаёт ресурс KafkaConnector
# cdc.connector.name в KafkaConnect cdc.connect.
cdc:
  enabled: false
  # KafkaConnect, к которому относится ресурс KafkaConnector (FR-538): имя и namespace, например
  # kafka-connect и nomnom-infra.
  connect:
    cluster: ""
    namespace: ""
  # Schema Registry для SchemaFraming коннектора (FR-714), например
  # http://schema-registry.nomnom-infra.svc.cluster.local:8081.
  schemaRegistryUrl: ""
  # URI replica set для Kafka Connect — ссылка config provider Connect, не сам URI с паролем,
  # например ${dir:/mnt/cdc:restaurants-uri}.
  connectionString: ""
  # Контракт Outbox (ADR 37): коллекция restaurants.outbox, только insert; топик — поле topic,
  # ключ — aggregateId, value — payload (Binary) как есть, Event Envelope — заголовки из полей
  # документа. Документ без поля из additional.placement останавливает коннектор.
  connector:
    name: restaurants-outbox
    config:
      connector.class: io.debezium.connector.mongodb.MongoDbConnector
      topic.prefix: restaurants-outbox
      collection.include.list: restaurants.outbox
      capture.mode: change_streams
      snapshot.mode: no_data
      skipped.operations: u,d,t
      tombstones.on.delete: "false"
      extended.headers.enabled: "false"
      key.converter: org.apache.kafka.connect.storage.StringConverter
      value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
      header.converter: org.apache.kafka.connect.storage.SimpleHeaderConverter
      # SchemaFraming (FR-714): value стримов Integration Events — wire format Schema Registry
      # по header event_type; Change Notification streams (*-changes) в topics не входят.
      transforms: outbox,schema
      transforms.schema.type: nomnom.connect.SchemaFraming
      transforms.schema.topics: restaurants.v1.restaurant-order-events,restaurants.v1.restaurant-events,restaurants.v1.menu-events
      transforms.schema.cache.ttl.ms: "60000"
      transforms.outbox.type: io.debezium.connector.mongodb.transforms.outbox.MongoEventRouter
      transforms.outbox.collection.field.event.id: eventId
      transforms.outbox.collection.field.event.key: aggregateId
      transforms.outbox.collection.field.event.payload: payload
      transforms.outbox.collection.expand.json.payload: "false"
      transforms.outbox.route.by.field: topic
      transforms.outbox.route.topic.replacement: ${routedByValue}
      transforms.outbox.collection.fields.additional.placement: eventId:header:_watermill_message_uuid,eventId:header:event_id,eventType:header:event_type,occurredAt:header:occurred_at,aggregateType:header:aggregate_type,aggregateId:header:aggregate_id,aggregateVersion:header:aggregate_version,traceparent:header:traceparent

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
