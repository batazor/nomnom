# Kafka consumer restaurants (ADR 11, ADR 28): отдельный release того же chart.
#   helm upgrade --install restaurants-consumer ops/helm -f ops/helm/values-consumer.yaml
# Читает собственный restaurants.v1.restaurant-order-events через Inbox в MongoDB и
# обновляет кеш каталога по собственным событиям. Restaurant Order создаёт только workflow
# orders после оплаты (RPC ReceiveOrderRequest). Brokers (KAFKA__BROKERS), Schema Registry (SCHEMA_REGISTRY__URL, FR-715) и хранилище (mongodb.uriSecret) задаются values окружения;
# без них процесс не стартует.
component: consumer

# Реплики делят одну consumer group; порядок событий одного Order сохраняет partition key.
replicaCount: 1

command: ["/usr/bin/tini", "--", "node", "dist/cmd/restaurants-consumer/main.js"]

# KAFKA__CLIENT_ID — client id consumer и producer dead letters. Группа restaurants читает
# стрим с начала: Restaurant Order создаётся и для заказов, оформленных до первого запуска;
# повтор истории идемпотентен через Inbox.
# CACHE__REFRESH_GROUP — группа обновления кеша каталога (ADR 43): читает restaurant-events и
# menu-events с конца стрима.
env:
  KAFKA__CLIENT_ID: restaurants-consumer
  CACHE__REFRESH_GROUP: restaurants-cache
  KAFKA__CONSUMER_GROUP: restaurants
  KAFKA__INITIAL_OFFSET: oldest

telemetry:
  serviceName: restaurants-consumer

# Consumer не обслуживает бизнес-API: без Service и бизнес-порта, только metrics и probes.
service:
  enabled: false

# Начатое сообщение завершается в пределах drainTimeout; offsets подтверждаются только для
# обработанных сообщений, остальные доставляются повторно.
shutdown:
  readinessDelaySeconds: 2
  drainTimeoutSeconds: 20

mongodb:
  pool:
    # Одно сообщение за раз: транзакция Inbox и Restaurant Order плюс запас на dead letters и health.
    maxPoolSize: 5
