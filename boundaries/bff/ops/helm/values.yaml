# Default values for bff.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы,
# адреса внешних систем и kind-specific настройки задаются отдельными values-файлами
# или флагами --set при установке.

replicaCount: 1

image:
  # Образ BFF (Cosmo Router + plugin + config.json) собирается boundaries/bff/Dockerfile;
  # registry задаёт окружение или global.imageRegistry. Пустое значение — Deployment не запустится.
  registry: ""
  repository: ""
  # Tag образа задаётся окружением. Пустое значение означает "latest" — для реальных
  # окружений всегда задавайте tag явно.
  tag: ""
  # IfNotPresent позволяет использовать образ, загруженный в kind через kind load docker-image.
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common: global.imageRegistry,
# global.compatibility.openshift.adaptSecurityContext и т. п.
global: {}

# Label app.kubernetes.io/component.
component: router

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Доступ к Kubernetes API приложению не нужен. Включение token automount —
  # отдельное явное решение.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Пользователь nonroot образа distroless (boundaries/bff/Dockerfile).
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  # Порт Service и порт Cosmo Router: образ запускает его с listen_addr 0.0.0.0:3010
  # (boundaries/bff/config.production.yaml). targetPort совпадает с портом процесса.
  port: 3010
  targetPort: 3010
  # Имя порта: Cosmo Router публикует GraphQL по HTTP.
  portName: http
  appProtocol: ""
  annotations: {}

# Requests/limits не задаются: профиль потребления приложения ещё не измерен.
resources:
  requests: {}
  limits: {}

# Несекретная конфигурация. Попадает в ConfigMap и подключается через envFrom.
# Пример:
# env:
#   OTEL_SERVICE_NAME: bff
#   OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.observability.svc:4317
#   OTEL_RESOURCE_ATTRIBUTES: service.namespace=nomnom,deployment.environment.name=local
env: {}

# Дополнительные источники переменных окружения, в том числе внешние Secret:
# envFrom:
#   - secretRef:
#       name: bff-secrets
envFrom: []

# Отдельные переменные окружения, включая valueFrom из внешних Secret:
# extraEnv:
#   - name: DATABASE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: bff-database
#         key: password
extraEnv: []

# Health endpoints Cosmo Router (config.production.yaml). Router обслуживает их только на
# порту GraphQL, поэтому probes идут на http, а не на технический порт metrics (исключение из
# ADR 17, см. ops/README.md). /health/ready — execution config и plugin загружены.
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

# ADR 15, ADR 41: адрес internal gateway (BFF__INTERNAL_GATEWAY_ADDR), через который BFF
# вызывает control plane; gateways ячеек для orders, restaurants и delivery BFF берёт из его
# Placement Map. Обязателен: без него chart не рендерится.
internalGateway:
  address: ""

# ADR 41: router ячеек. placementTTL (BFF__PLACEMENT_TTL, Go duration, например "30s") —
# период фонового обновления Placement Map; неудачное обновление оставляет последнюю карту.
# Обязателен: без него chart не рендерится. identity.tokenAudiences должен включать
# nomnom.controlplane.
cellRouter:
  placementTTL: ""

# FR-623: точка, в которой встаёт курьер, добавленный диспетчером на flow-board
# (BFF__COURIER_START_LATITUDE, BFF__COURIER_START_LONGITUDE): у него нет своей позиции, а
# delivery предлагает доставку только курьеру с позицией. Обязательна: без неё chart не
# рендерится.
courierPool:
  startLatitude: ""
  startLongitude: ""

# ADR 36: bootstrap-адрес Kafka (BFF__KAFKA_BROKERS) для Cosmo Streams — Router читает
# orders.v1.order-changes и отдаёт подписки orderChanged. Обязателен: без него chart не рендерится.
kafka:
  brokers: ""

# ADR 32: identity покупателя. Router и plugin проверяют access token по JWKS identity
# provider, которого называет iss (providers: issuer и jwksUrl); plugin подписывает user
# assertions ключом из Secret assertionKeySecret (P-256 в PEM). tokenAudiences — контексты,
# для которых Pod получает projected ServiceAccount token (ADR 27). providers, ключ подписи
# и его id обязательны: без них chart не рендерится. Ключ подписи не хранится в values.
identity:
  # Пример:
  # providers:
  #   - issuer: https://idp.example.com
  #     jwksUrl: https://idp.example.com/keys
  providers: []
  idpAudience: nomnom-bff
  assertionKeySecret:
    name: ""
    key: key.pem
  assertionKeyId: ""
  tokenAudiences: []
  tokenExpirationSeconds: 3600

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
