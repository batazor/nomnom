apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.env .Values.podAnnotations }}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "bff.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bff.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "bff.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if or .Values.env .Values.envFrom }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "bff.fullname" . }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.extraEnv .Values.identity.idpJwksConfigMap }}
          env:
            {{- with .Values.identity }}
            {{- if .idpJwksConfigMap }}
            - name: BFF__IDP_ISSUER
              value: {{ .idpIssuer | quote }}
            - name: BFF__IDP_AUDIENCE
              value: {{ .idpAudience | quote }}
            - name: BFF__IDP_JWKS_FILE
              value: /etc/nomnom/idp/jwks.json
            - name: BFF__ASSERTION_KEY_FILE
              value: /etc/nomnom/assertion/{{ .assertionKeySecret.key }}
            - name: BFF__ASSERTION_KEY_ID
              value: {{ .assertionKeyId | quote }}
            - name: IDENTITY__TOKEN_DIR
              value: /var/run/secrets/nomnom/identity
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.identity.idpJwksConfigMap }}
          volumeMounts:
            {{- if .Values.identity.idpJwksConfigMap }}
            - name: idp-jwks
              mountPath: /etc/nomnom/idp
              readOnly: true
            - name: assertion-key
              mountPath: /etc/nomnom/assertion
              readOnly: true
            - name: identity-tokens
              mountPath: /var/run/secrets/nomnom/identity
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.identity.idpJwksConfigMap }}
      volumes:
        {{- with .Values.identity }}
        {{- if .idpJwksConfigMap }}
        - name: idp-jwks
          configMap:
            name: {{ .idpJwksConfigMap }}
            items:
              - key: jwks.json
                path: jwks.json
        - name: assertion-key
          secret:
            secretName: {{ required "identity.assertionKeySecret.name is required with identity.idpJwksConfigMap" .assertionKeySecret.name }}
            items:
              - key: {{ .assertionKeySecret.key }}
                path: {{ .assertionKeySecret.key }}
        # ADR 27: one projected ServiceAccount token per target context; kubelet rotates them.
        - name: identity-tokens
          projected:
            sources:
              {{- range required "identity.tokenAudiences is required with identity.idpJwksConfigMap" .tokenAudiences }}
              - serviceAccountToken:
                  audience: {{ . }}
                  path: {{ . }}
                  expirationSeconds: {{ $.Values.identity.tokenExpirationSeconds }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
