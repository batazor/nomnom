{{- /*
ConfigMap только для несекретной конфигурации. Секреты подключаются внешними
Kubernetes Secret через envFrom или extraEnv[].valueFrom и этим chart не создаются.
*/ -}}
{{- if .Values.env -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
