{{- /*
ADR 32: Cosmo Router проверяет access token по JWKS каждого identity provider до plugin
(подпись и срок; issuer и audience проверяет plugin). Невалидный token — 401; запрос без
token проходит: публичный каталог доступен без входа. Файл дополняет конфигурацию образа
через CONFIG_PATH.
*/ -}}
{{- with .Values.identity.providers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bff.fullname" $ }}-router
  labels:
    {{- include "bff.labels" $ | nindent 4 }}
data:
  authentication.yaml: |
    authentication:
      jwt:
        jwks:
          {{- range . }}
          - url: {{ required "identity.providers[].jwksUrl is required" .jwksUrl | quote }}
            algorithms: [RS256, ES256]
            refresh_unknown_kid:
              enabled: true
          {{- end }}
{{- end }}
