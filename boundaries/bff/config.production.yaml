# yaml-language-server: $schema=https://raw.githubusercontent.com/wundergraph/cosmo/main/router/pkg/config/config.schema.json
#
# Runtime configuration of the BFF container image (Dockerfile copies it to /app/config.yaml).
# Local development keeps config.yaml with dev_mode and the playground.

version: "1"

# All interfaces of the Pod; the Service and kubelet probes reach the Router here.
listen_addr: 0.0.0.0:3010

dev_mode: false

# Health endpoints of the Router on the same listener (kubelet probes):
# /health/live — the process serves HTTP, /health/ready — the execution config and plugins
# are loaded.
liveness_check_path: /health/live
readiness_check_path: /health/ready

playground:
  enabled: false

introspection:
  enabled: false

json_log: true
log_level: info

execution_config:
  file:
    path: config.json

plugins:
  enabled: true
  path: plugins

# No Cosmo control plane: no usage metrics. Traces go only to the OTLP collector of the
# environment: TRACING_ENABLED (false in the image, Dockerfile) turns them on, the
# endpoint comes from BFF__OTLP_TRACES_ENDPOINT (OTLP/HTTP, e.g. Alloy :4318). With an
# exporter listed the Router never falls back to the Cosmo Cloud default exporter.
# The Router continues W3C trace context of the caller (browser Faro spans, ADR 2).
graphql_metrics:
  enabled: false

telemetry:
  service_name: bff
  resource_attributes:
    - key: service.namespace
      value: nomnom
    - key: deployment.environment.name
      value: "${BFF__DEPLOYMENT_ENVIRONMENT}"
  tracing:
    exporters:
      - exporter: http
        endpoint: "${BFF__OTLP_TRACES_ENDPOINT}"
  metrics:
    otlp:
      enabled: false
    prometheus:
      enabled: false

# Browser customer UI on another origin: Faro tracing adds W3C trace context to
# BFF requests (boundaries/ui/src/shared/telemetry), so preflight must allow it;
# the Router default allows only Origin, Content-Length and Content-Type.
cors:
  allow_headers:
    - Origin
    - Content-Length
    - Content-Type
    - Authorization
    - traceparent
    - tracestate

# ADR 32: the plugin verifies the customer's access token itself, so the
# Router forwards Authorization to it as gRPC metadata authorization. No other
# client header reaches the plugin.
headers:
  all:
    request:
      - op: propagate
        named: Authorization
