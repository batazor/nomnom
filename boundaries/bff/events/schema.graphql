# Event-driven subgraph of the BFF (Cosmo Streams, ADR 36). It has no server:
# the Router consumes the Kafka topics itself and resolves the entities of
# each event through the plugin subgraph (LookupOrderById) with the
# subscriber's Authorization. Events carry only the entity key, except
# courierMoved: its key is every field of CourierPosition, so the Router takes
# the position from the Valkey event and calls no subgraph (FR-668).

type Subscription {
  """
  Current state of an order of the current customer after each of its changes.
  Nothing is sent until the order changes: query order(id) first. A foreign or
  missing order yields an error event instead of data.
  """
  orderChanged(id: ID!): Order!
    @edfs__kafkaSubscribe(topics: ["orders.v1.order-changes"], providerId: "default")
    @openfed__subscriptionFilter(condition: { IN: { fieldPath: "id", values: ["{{ args.id }}"] } })

  """
  Kitchen board of a restaurant after each change of its orders or of the
  restaurant itself. Nothing is sent until a change: query kitchen first. A
  kitchen the user may not see yields an error event instead of data.
  """
  kitchenChanged(restaurantId: ID!): Kitchen!
    @edfs__kafkaSubscribe(topics: ["restaurants.v1.kitchen-changes"], providerId: "default")
    @openfed__subscriptionFilter(
      condition: { IN: { fieldPath: "restaurantId", values: ["{{ args.restaurantId }}"] } }
    )

  """
  Work of the current courier after each change of their availability, offers
  or deliveries; id is Courier.id from the courier query. Another courier's id
  yields an error event instead of data.
  """
  courierChanged(id: ID!): Courier!
    @edfs__kafkaSubscribe(topics: ["delivery.v1.courier-changes"], providerId: "default")
    @openfed__subscriptionFilter(condition: { IN: { fieldPath: "id", values: ["{{ args.id }}"] } })

  """
  Courier Pool of a Market after each change of its couriers, offers or
  deliveries; marketId is CourierPool.id, the Market of the request path /m/{marketId} (ADR 41).
  Query courierPool first. A user who may not manage couriers, or a marketId
  other than the Market of the request, gets an error event instead of data.
  """
  courierPoolChanged(marketId: ID!): CourierPool!
    @edfs__kafkaSubscribe(topics: ["delivery.v1.courier-pool-changes"], providerId: "default")
    @openfed__subscriptionFilter(condition: { IN: { fieldPath: "id", values: ["{{ args.marketId }}"] } })

  """
  Every new position of the courier of an order; channel is
  Order.tracking.channel, the capability that order(id) hands out to whoever
  may view the order. Nothing is sent until the courier moves: query
  order(id) first and take tracking.courierPosition.
  """
  courierMoved(channel: ID!): CourierPosition!
    @edfs__redisSubscribe(channels: ["delivery.tracks.{{ args.channel }}"], providerId: "tracks")
}

type Order @key(fields: "id", resolvable: false) {
  id: ID! @external
}

type Kitchen @key(fields: "restaurantId", resolvable: false) {
  restaurantId: ID! @external
}

type Courier @key(fields: "id", resolvable: false) {
  id: ID! @external
}

type CourierPool @key(fields: "id", resolvable: false) {
  id: ID! @external
}

type CourierPosition @key(fields: "channel latitude longitude recordedAt", resolvable: false) {
  channel: ID! @external
  latitude: Float! @external
  longitude: Float! @external
  recordedAt: String! @external
}
