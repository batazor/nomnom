# yaml-language-server: $schema=https://raw.githubusercontent.com/wundergraph/cosmo/main/router/pkg/config/config.schema.json

version: "1"

listen_addr: localhost:3010

dev_mode: true

execution_config:
  file:
    path: config.json

plugins:
  enabled: true
  path: plugins

# Local ADR 3: the same persisted operations as the image, but operation text is still
# accepted so the dev UI and hand-written queries work; operations not persisted are logged.
storage_providers:
  file_system:
    - id: operations
      path: persisted-operations

persisted_operations:
  log_unknown: true
  storage:
    provider_id: operations

# Browser customer UI on another origin: Faro tracing adds W3C trace context to
# BFF requests (boundaries/ui/src/shared/telemetry), so preflight must allow it;
# the Router default allows only Origin, Content-Length and Content-Type.
cors:
  allow_headers:
    - Origin
    - Content-Length
    - Content-Type
    - Authorization
    - traceparent
    - tracestate

# ADR 32: the plugin verifies the customer's access token itself, so the
# Router forwards Authorization to it as gRPC metadata authorization. ADR 41:
# X-Nomnom-Market reaches it as x-nomnom-market — the public gateway sets it
# from the route /m/{market_id}, the browser does not send it. No other client
# header reaches the plugin.
headers:
  all:
    request:
      - op: propagate
        named: Authorization
      - op: propagate
        named: X-Nomnom-Market

# ADR 36: Cosmo Streams consume Order Change Notifications from Kafka and
# courier positions from the Valkey of delivery (FR-668); an unreachable
# provider stops the Router (skip_unavailable_providers: false).
events:
  providers:
    kafka:
      - id: default
        brokers:
          - localhost:9092
    redis:
      - id: tracks
        urls:
          - "redis://localhost:6379"
