"""
Couriers of a Market and the load of the line; the entity key lets the
Router resolve courierPoolChanged events (ADR 36)
"""
type CourierPool @key(fields: "id") {
  """
  Identifier of the pool: the id of its Market (ADR 41)
  """
  id: ID!
  """
  Couriers in the pool
  """
  size: Int!
  """
  Couriers on line: available or busy
  """
  onLine: Int!
  """
  Couriers on a delivery
  """
  busy: Int!
  """
  Deliveries waiting for a courier
  """
  waiting: Int!
  """
  Couriers by name
  """
  couriers: [PoolCourier!]!
}

"""
Business reason why a Courier Pool command cannot be applied
"""
enum CourierPoolProblemCode {
  """
  The name is empty or longer than 64 characters
  """
  COURIER_NAME_INVALID
  """
  The courier status forbids the change: busy couriers stay on line, retired ones off line
  """
  COURIER_STATUS_CONFLICT
  """
  The courier is on line and cannot leave the pool
  """
  COURIER_ON_LINE
  """
  The order has no delivery waiting for a courier, or the courier is not free
  """
  OFFER_REFUSED
}

type CourierPoolPayload {
  """
  Courier Pool after the command
  """
  courierPool: CourierPool!
  """
  Business problem, null on success
  """
  problem: CourierPoolProblemCode
}

type Query {
  """
  Metadata for the client BFF
  """
  bffInfo: BffInfo!
  """
  Restaurants available to the customer
  """
  restaurants(first: Int!, after: String): RestaurantConnection!
  """
  Restaurant by identifier, null if it does not exist
  """
  restaurant(id: ID!): Restaurant
  """
  Order of the current customer, null if it does not exist or belongs to someone else
  """
  order(id: ID!): Order
  """
  Orders of the current customer, newest first
  """
  customerOrders(first: Int!, after: String): OrderSummaryConnection!
  """
  Restaurants the current user owns, open and closed, ordered by identifier
  """
  myRestaurants(first: Int!, after: String): RestaurantSummaryConnection!
  """
  Active orders of a restaurant for its kitchen; requires kitchen staff or the owner of the
  restaurant, null if the restaurant does not exist or the user may not operate its kitchen
  """
  kitchen(restaurantId: ID!): Kitchen
  """
  Work of the current user as a courier, null if the user is not a registered courier
  """
  courier: Courier
  """
  Couriers of the platform and the load of the line; requires a dispatcher or the operator
  (platform#manage_couriers), otherwise a PERMISSION_DENIED error
  """
  courierPool: CourierPool!
  """
  Demo Simulator of orders, restaurants and delivery; enabled only when it is on in all
  three; requires the operator (platform#operate_simulator)
  """
  simulator: Simulator!
}

"""
Demo Simulator that acts for the customer, the kitchen and couriers
"""
type Simulator {
  """
  Whether the Simulator is on in orders, restaurants and delivery
  """
  enabled: Boolean!
}

input OrderLineInput {
  """
  Menu item identifier
  """
  menuItemId: ID!
