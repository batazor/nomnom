type BffInfo {
  """
  Service name
  """
  name: String!
  """
  Service version
  """
  version: String!
}

"""
Premium Priority of an order: a premium order is prepared first
"""
enum OrderPriority {
  """
  Prepared in the order of the kitchen queue
  """
  STANDARD
  """
  Prepared first for the premium fee of the restaurant
  """
  PREMIUM
}

"""
Exact monetary amount
"""
type Money {
  """
  Decimal string with a dot separator, for example "12.50"
  """
  amount: String!
  """
  ISO 4217 currency code
  """
  currency: String!
}

"""
Cursor pagination state of a connection
"""
type PageInfo {
  """
  Whether more items follow endCursor
  """
  hasNextPage: Boolean!
  """
  Cursor of the last returned item, null for an empty page
  """
  endCursor: String
}

"""
Restaurant of the catalog, as a customer chooses it
"""
type Restaurant {
  """
  Restaurant identifier
  """
  id: ID!
  """
  Display name
  """
  name: String!
  """
  Whether the restaurant accepts new orders now
  """
  acceptingOrders: Boolean!
  """
  Current menu, null if the restaurant has not published one
  """
  menu: Menu
  """
  Wait for an order placed now
  """
  waitTime: RestaurantWaitTime!
  """
  Fee of Premium Priority, null when the restaurant offers no premium
  """
  premiumFee: Money
}

"""
Restaurant outside the catalog: of an order, of a kitchen or of its owner
"""
type RestaurantSummary {
  """
  Restaurant identifier
  """
  id: ID!
  """
  Display name
  """
  name: String!
  """
  Whether the restaurant accepts new orders now
  """
  acceptingOrders: Boolean!
}

"""
Wait for a new order of a restaurant, estimated from its recent orders
"""
type RestaurantWaitTime {
  """
  The kitchen is slower than usual for this restaurant
  """
  elevated: Boolean!
  """
  Expected wait in minutes for an order placed now, an estimate rather than a promise
  """
  expectedWaitMinutes: Int!
}

"""
Menu of one restaurant
"""
type Menu {
  """
  Menu items in display order
  """
  items: [MenuItem!]!
}

"""
Item of a restaurant menu
"""
type MenuItem {
  """
  Menu item identifier
  """
  id: ID!
  """
  Display name
  """
  name: String!
  """
  Short description, null if absent
  """
  description: String
  """
  Current price of one unit
  """
  price: Money!
  """
  Whether the item can be ordered now
  """
  available: Boolean!
}

type RestaurantEdge {
  """
  Opaque cursor of this item
  """
  cursor: String!
  """
  Restaurant
  """
  node: Restaurant!
}

type RestaurantConnection {
  """
  Restaurants of the page
  """
  edges: [RestaurantEdge!]!
  """
  Pagination state
  """
  pageInfo: PageInfo!
}

type RestaurantSummaryEdge {
  """
  Opaque cursor of this item
  """
  cursor: String!
  """
  Restaurant
  """
  node: RestaurantSummary!
}

type RestaurantSummaryConnection {
  """
  Restaurants of the page
  """
  edges: [RestaurantSummaryEdge!]!
  """
  Pagination state
  """
  pageInfo: PageInfo!
}

"""
Customer-facing lifecycle of an order
"""
enum OrderStatus {
  """
  Order is placed and waits for confirmation
  """
  RECEIVED
  """
  Payment is authorized and the order waits for the restaurant
  """
  PAID
  """
  Order is confirmed and waits for the kitchen
  """
  CONFIRMED
  """
  Kitchen is preparing the order
  """
  PREPARING
  """
  Order is ready and waits for the courier
  """
  READY_FOR_PICKUP
  """
  Courier picked the order up and is on the way
  """
  PICKED_UP
  """
  Order is delivered
  """
  DELIVERED
  """
  Order is cancelled before fulfillment
  """
  CANCELLED
  """
  Order could not be fulfilled
  """
  FAILED
}

"""
Why an order ended without delivery
"""
enum OrderEndReason {
  """
  Customer cancelled the order
  """
  CUSTOMER_CANCELLED
  """
  Restaurant could not accept the order
  """
  RESTAURANT_REJECTED
  """
  Delivery did not succeed
  """
  DELIVERY_FAILED
  """
  Payment was declined
  """
  PAYMENT_DECLINED
  """
  Order was not fulfilled for another reason
  """
  NOT_FULFILLED
}

"""
Notable moment in the progress of an order
"""
enum OrderMilestoneKind {
  """
  Order is placed
  """
  PLACED
  """
  Payment is authorized
  """
  PAID
  """
  Order is confirmed
  """
  CONFIRMED
  """
  Kitchen started preparation
  """
  PREPARATION_STARTED
  """
  Order is ready for pickup
  """
  READY_FOR_PICKUP
  """
  Courier is assigned to the order
  """
  COURIER_ASSIGNED
  """
  Courier picked the order up
  """
  PICKED_UP
  """
  Order is delivered
  """
  DELIVERED
  """
  Order ended without delivery
  """
  ENDED
}

type OrderMilestone {
  """
  Kind of the milestone
  """
  kind: OrderMilestoneKind!
  """
  Moment of the milestone in RFC 3339
  """
  occurredAt: String!
}

"""
Menu item as recorded in an order
"""
type OrderedMenuItem {
  """
  Menu item identifier
  """
  id: ID!
  """
  Display name
  """
  name: String!
}

type OrderItem {
  """
  Ordered menu item
  """
  menuItem: OrderedMenuItem!
  """
  Number of units
  """
  quantity: Int!
  """
  Price of one unit at the time of ordering
  """
  unitPrice: Money!
  """
  Price of all units of this line
  """
  lineTotal: Money!
}

"""
Present only while the customer may request cancellation
"""
type OrderCancellationAvailability {
  """
  Moment in RFC 3339 after which cancellation is no longer possible
  """
  availableUntil: String!
}

"""
Order of the current customer; the entity key lets the Router resolve
subscription events of the events subgraph (ADR 36)
"""
type Order @key(fields: "id") {
  """
  Order identifier
  """
  id: ID!
  """
  Customer-facing lifecycle status
  """
  status: OrderStatus!
  """
  Why the order ended, set only for CANCELLED and FAILED
  """
  endReason: OrderEndReason
  """
  Restaurant that fulfills the order
  """
  restaurant: RestaurantSummary!
  """
  Ordered items
  """
  items: [OrderItem!]!
  """
  Total amount of the order, the premium fee included
  """
  total: Money!
  """
  Premium Priority chosen at checkout
  """
  priority: OrderPriority!
  """
  Premium fee fixed at checkout, null for a standard order
  """
  premiumFee: Money
  """
  Moment the order was placed in RFC 3339
  """
  placedAt: String!
  """
  Milestones in chronological order
  """
  milestones: [OrderMilestone!]!
  """
  Cancellation availability, null when cancellation is not possible now
  """
  cancellation: OrderCancellationAvailability
  """
  Moment the kitchen expects the order to be ready in RFC 3339, null until
  the kitchen names it; the latest one after a delay
  """
  expectedReadyAt: String
  """
  Moment the assigned courier expects to pick the order up in RFC 3339, null
  until the courier names it
  """
  expectedPickupAt: String
  """
  Moment the courier expects to deliver the order in RFC 3339, null until
  the courier names it at pickup
  """
  expectedDeliveredAt: String
  """
  Courier delivering the order, null before a courier is assigned and after a failed
  delivery
  """
  courier: OrderCourier
  """
  Live tracking of the courier, null unless the delivery is assigned or picked up
  """
  tracking: OrderTracking
}

"""
Live tracking of the courier of an order: the Virtual City, the pickup and
dropoff points and the courier position
"""
type OrderTracking {
  """
  Channel of the courierMoved subscription; only order viewers get it
  """
  channel: ID!
  """
  Grid of streets the points lie on
  """
  city: VirtualCity!
  """
  Where the courier picks the order up
  """
  pickup: GeoPoint!
  """
  Where the courier hands the order over
  """
  dropoff: GeoPoint!
  """
  Last stored courier position, up to a few seconds old; null while unknown
  """
  courierPosition: CourierPosition
}

"""
Square grid of blocks x blocks blocks of blockMeters meters from the
south-west corner origin
"""
type VirtualCity {
  """
  South-west corner
  """
  origin: GeoPoint!
  """
  Blocks per side
  """
  blocks: Int!
  """
  Side of a block in meters
  """
  blockMeters: Float!
}

"""
Point in WGS 84 degrees
"""
type GeoPoint {
  """
  Latitude in degrees
  """
  latitude: Float!
  """
  Longitude in degrees
  """
  longitude: Float!
}

"""
Position of the courier of an order; courierMoved pushes every new one. All
fields form the key, so the router takes them from the event itself
"""
type CourierPosition @key(fields: "channel latitude longitude recordedAt", resolvable: false) {
  """
  Channel of the tracking the position belongs to
  """
  channel: ID!
  """
  Latitude in degrees
  """
  latitude: Float!
  """
  Longitude in degrees
  """
  longitude: Float!
  """
  Moment delivery recorded the position in RFC 3339
  """
  recordedAt: String!
}

"""
Courier of an order as its customer sees it
"""
type OrderCourier {
  """
  Name of the courier
  """
  name: String!
}

"""
Order in the history of its customer; order(id) reads the rest
"""
type OrderSummary {
  """
  Order identifier
  """
  id: ID!
  """
  Customer-facing lifecycle status
  """
  status: OrderStatus!
  """
  Why the order ended, set only for CANCELLED and FAILED
  """
  endReason: OrderEndReason
  """
  Moment the order was placed in RFC 3339
  """
  placedAt: String!
  """
  Total amount of the order, the premium fee included
  """
  total: Money!
  """
  Premium Priority chosen at checkout
  """
  priority: OrderPriority!
  """
  Restaurant that fulfills the order
  """
  restaurant: RestaurantSummary!
}

type OrderSummaryEdge {
  """
  Opaque cursor of this item
  """
  cursor: String!
  """
  Order
  """
  node: OrderSummary!
}

type OrderSummaryConnection {
  """
  Orders of the page, newest first
  """
  edges: [OrderSummaryEdge!]!
  """
  Pagination state
  """
  pageInfo: PageInfo!
}

"""
Stage of a restaurant order in the kitchen
"""
enum KitchenOrderStage {
  """
  Order arrived and waits for the kitchen to accept or reject it
  """
  RECEIVED
  """
  Order is accepted and waits in the kitchen queue
  """
  QUEUED
  """
  Kitchen is preparing the order
  """
  PREPARING
  """
  Order is assembled and waits to be marked ready
  """
  ASSEMBLED
  """
  Order is ready for pickup
  """
  READY
}

"""
Line of a restaurant order as the kitchen sees it
"""
type KitchenOrderItem {
  """
  Display name of the menu item, empty if it is no longer in the menu
  """
  name: String!
  """
  Number of units
  """
  quantity: Int!
}

"""
Order of a restaurant as its kitchen sees it
"""
type KitchenOrder {
  """
  Restaurant order identifier, used by the kitchen commands
  """
  id: ID!
  """
  Customer order identifier
  """
  orderId: ID!
  """
  Current stage in the kitchen
  """
  stage: KitchenOrderStage!
  """
  Ordered items
  """
  items: [KitchenOrderItem!]!
  """
  Moment the restaurant received the order in RFC 3339
  """
  receivedAt: String!
  """
  Moment the kitchen accepted the order in RFC 3339; null before Acceptance (RECEIVED)
  """
  acceptedAt: String
  """
  Moment the order is expected to be ready in RFC 3339, including reported
  preparation delays; null before Acceptance (RECEIVED)
  """
  expectedReadyAt: String
  """
  Cook assigned at the start of preparation; null before it and for a cook who
  left the Cook Pool
  """
  cook: Cook
  """
  Premium Priority of the order: premium orders are taken first
  """
  priority: OrderPriority!
}

"""
Cook of the Cook Pool of a restaurant
"""
type Cook {
  """
  Cook identifier, used by the Cook Pool commands
  """
  id: ID!
  """
  Name shown on the kitchen board
  """
  name: String!
  """
  Whether the cook takes work: the start of preparation may assign them
  """
  onLine: Boolean!
  """
  Kitchen order (KitchenOrder.id) the cook is preparing or assembling; null when free
  """
  currentKitchenOrderId: ID
}

"""
Cooks of a restaurant and the load of its kitchen line
"""
type CookPool {
  """
  Cooks in the pool
  """
  size: Int!
  """
  Cooks on line
  """
  onLine: Int!
  """
  Cooks preparing or assembling an order
  """
  busy: Int!
  """
  Orders waiting in the kitchen queue
  """
  queued: Int!
  """
  Cooks by name
  """
  cooks: [Cook!]!
}

"""
Business reason why a Cook Pool command cannot be applied
"""
enum CookPoolProblemCode {
  """
  The name is empty or longer than 64 characters
  """
  COOK_NAME_INVALID
  """
  The cook is preparing an order and cannot leave the line
  """
  COOK_BUSY
  """
  The cook is on line and cannot leave the pool
  """
  COOK_ON_LINE
  """
  The cook left the pool and cannot return
  """
  COOK_RETIRED
}

type CookPoolPayload {
  """
  Cook Pool after the command
  """
  cookPool: CookPool!
  """
  Business problem, null on success
  """
  problem: CookPoolProblemCode
}

"""
Active orders of one restaurant for its kitchen staff; the entity key lets the
Router resolve kitchenChanged events (ADR 36)
"""
type Kitchen @key(fields: "restaurantId") {
  """
  Identifier of the restaurant the kitchen belongs to
  """
  restaurantId: ID!
  """
  Restaurant the kitchen belongs to
  """
  restaurant: RestaurantSummary!
  """
  Orders in RECEIVED, QUEUED, PREPARING, ASSEMBLED and READY: RECEIVED by ascending
  receivedAt, then the kitchen queue order, then the rest by ascending receivedAt
  """
  orders: [KitchenOrder!]!
  """
  Cooks of the restaurant and the load of its line; changes of cooks push
  kitchenChanged too
  """
  cookPool: CookPool!
}

"""
Command of the kitchen over one restaurant order
"""
enum KitchenAction {
  """
  Accept a RECEIVED order into the kitchen queue
  """
  ACCEPT
  """
  Reject a RECEIVED order
  """
  REJECT
  """
  Mark a PREPARING order assembled
  """
  MARK_ASSEMBLED
  """
  Mark an ASSEMBLED order ready for pickup
  """
  MARK_READY
}

input KitchenActionInput {
  """
  Restaurant of the order
  """
  restaurantId: ID!
  """
  Restaurant order identifier (KitchenOrder.id)
  """
  kitchenOrderId: ID!
  """
  Command to apply
  """
  action: KitchenAction!
}

"""
Business reason why a kitchen command cannot be applied
"""
enum KitchenActionProblemCode {
  """
  The order is not in a stage that allows this command
  """
  ORDER_STAGE_CONFLICT
  """
  No cook on line is free to start preparing; the order stays in the queue
  """
  NO_COOK_AVAILABLE
}

type KitchenActionPayload {
  """
  Order after the command; null if problem is set or the order left the kitchen
  """
  order: KitchenOrder
  """
  Business problem, null on success
  """
  problem: KitchenActionProblemCode
}

"""
Availability of a courier for new deliveries
"""
enum CourierAvailability {
  """
  Courier receives delivery offers
  """
  AVAILABLE
  """
  Courier is on a delivery
  """
  BUSY
  """
  Courier does not receive delivery offers
  """
  UNAVAILABLE
}

"""
Delivery offered to the courier, valid until expiresAt
"""
type DeliveryOffer {
  """
  Offer identifier
  """
  id: ID!
  """
  Delivery the offer is for
  """
  deliveryId: ID!
  """
  Customer order the delivery is for
  """
  orderId: ID!
  """
  Moment in RFC 3339 after which the offer cannot be accepted
  """
  expiresAt: String!
}

"""
Stage of a delivery assigned to the courier
"""
enum CourierDeliveryStage {
  """
  Courier is going to the restaurant
  """
  ASSIGNED
  """
  Courier has the order and is going to the customer
  """
  PICKED_UP
}

"""
Delivery the courier is currently carrying out
"""
type CourierDelivery {
  """
  Delivery identifier
  """
  id: ID!
  """
  Customer order identifier
  """
  orderId: ID!
  """
  Current stage
  """
  stage: CourierDeliveryStage!
}

"""
Work of the current courier; the entity key lets the Router resolve
courierChanged events (ADR 36)
"""
type Courier @key(fields: "id") {
  """
  Courier identifier, the subject of the current user
  """
  id: ID!
