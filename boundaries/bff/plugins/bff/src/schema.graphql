  """
  changed: Boolean!
}

type Mutation {
  """
  Place an order for the current customer
  """
  placeOrder(input: PlaceOrderInput!): PlaceOrderPayload!
  """
  Request cancellation of an order of the current customer
  """
  requestOrderCancellation(input: RequestOrderCancellationInput!): RequestOrderCancellationPayload!
  """
  Open a restaurant of the current user for new orders; repeating it changes nothing
  """
  openRestaurant(restaurantId: ID!): RestaurantOpeningPayload!
  """
  Close a restaurant of the current user for new orders; repeating it changes nothing
  """
  closeRestaurant(restaurantId: ID!): RestaurantOpeningPayload!
  """
  Apply a kitchen command to a restaurant order; repeating MARK_READY changes nothing
  """
  applyKitchenAction(input: KitchenActionInput!): KitchenActionPayload!
  """
  Start preparing the head of the kitchen queue: premium orders first, the kitchen does not
  choose the order. requestId is chosen per attempt and reused on a manual retry, which starts
  no other order. order is null when the queue is empty
  """
  startNextPreparation(restaurantId: ID!, requestId: String!): KitchenActionPayload!
  """
  Add a cook off line to the Cook Pool of a restaurant; requires its staff or owner
  """
  hireCook(restaurantId: ID!, name: String!): CookPoolPayload!
  """
  Put a cook on line or take them off line; repeating it changes nothing
  """
  setCookOnLine(restaurantId: ID!, cookId: ID!, onLine: Boolean!): CookPoolPayload!
  """
  Take a cook off line out of the Cook Pool for good
  """
  retireCook(restaurantId: ID!, cookId: ID!): CookPoolPayload!
  """
  Change whether the current courier receives delivery offers; AVAILABLE or UNAVAILABLE only
  """
  setCourierAvailability(availability: CourierAvailability!): CourierPayload!
  """
  Accept a delivery offer addressed to the current courier
  """
  acceptDeliveryOffer(offerId: ID!): CourierPayload!
  """
  Apply a command to the current delivery of the courier
  """
  applyCourierDeliveryAction(deliveryId: ID!, action: CourierDeliveryAction!): CourierPayload!
  """
  Add an available courier to the Courier Pool at the start point of new couriers; requires
  a dispatcher or the operator
  """
  addCourier(name: String!): CourierPoolPayload!
  """
  Put a courier on line or take them off line; repeating it changes nothing
  """
  setCourierOnLine(courierId: ID!, onLine: Boolean!): CourierPoolPayload!
  """
  Take a courier off line out of the Courier Pool for good
  """
  retireCourier(courierId: ID!): CourierPoolPayload!
  """
  Offer the delivery of an order to a chosen courier of the Courier Pool; the courier accepts
  or rejects it. Requires a dispatcher or the operator
  """
  offerDeliveryToCourier(orderId: ID!, courierId: ID!): CourierPoolPayload!
  """
  Switch the demo Simulator in orders, restaurants and delivery; requires the operator
  """
  setSimulatorEnabled(enabled: Boolean!): Simulator!
}
