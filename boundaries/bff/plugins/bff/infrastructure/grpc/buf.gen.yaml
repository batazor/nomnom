# Go-клиенты API контекстов, которые вызывают слайсы BFF. До публикации модулей в BSR код генерируется из workspace, как
# в orders (ADR 7; после публикации — закреплённый BSR commit). Integration Events BFF не нужны.
# Запуск: make proto-generate в boundaries/bff.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/batazor/nomnom/boundaries/bff/plugins/bff/infrastructure/grpc/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt:
      - paths=source_relative
inputs:
  - directory: ../../../../../orders/infrastructure/grpc
    exclude_paths:
      - ../../../../../orders/infrastructure/grpc/nomnom/orders/v1/events.proto
      - ../../../../../orders/infrastructure/grpc/nomnom/orders/v1/relationships.proto
  - directory: ../../../../../restaurants/infrastructure/grpc
    exclude_paths:
      - ../../../../../restaurants/infrastructure/grpc/nomnom/restaurants/v1/events.proto
  - directory: ../../../../../delivery/infrastructure/grpc
    exclude_paths:
      - ../../../../../delivery/infrastructure/grpc/nomnom/delivery/v1/events.proto
