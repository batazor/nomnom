[project]
name = "nomnom-payments"
version = "0.1.0"
description = "Payments bounded context for nomnom"
requires-python = ">=3.10"
dependencies = [
    "authzed>=1.25.0",
    "grpcio>=1.84.1",
    "protobuf>=7.36.2",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.15.1",
]

[tool.uv]
package = false

[tool.ruff]
# Keep the existing source-style baseline while the generated protobuf runtime
# itself requires Python 3.10 or newer.
target-version = "py39"
line-length = 100
extend-exclude = ["infrastructure/grpc/gen"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["entrypoints", "pkg", "slices", "tests"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
