[project]
name = "nomnom-payments"
version = "0.1.0"
description = "Payments bounded context for nomnom"
requires-python = ">=3.14"
dependencies = [
    "authzed>=1.25.0",
    "dependency-injector>=4.49.1",
    "grpcio>=1.84.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "protobuf>=7.36.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.15.1",
    "yoyo-migrations>=9.0.0",
]

[tool.uv]
package = false

[tool.ruff]
# Matches the runtime image (python:3.14, ADR 5).
target-version = "py314"
line-length = 100
extend-exclude = ["infrastructure/grpc/gen"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B", "UP",
    "SIM", "RUF", "RET", "BLE", "S", "T20", "LOG", "N",
    "DTZ", "PERF", "C4", "PIE", "PTH", "ERA", "G", "FURB", "ISC", "D",
]
# Code comments are written in Russian.
# D105: magic methods need no docstring; D107: __init__ is documented on the class.
ignore = ["RUF001", "RUF002", "RUF003", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# unittest suites: plain asserts and fixed test secrets are expected.
"tests/**" = ["S101", "S105", "S106", "BLE001", "D"]
# Process entrypoints report startup failures on stderr and turn any error into exit code 1.
"entrypoints/**" = ["T201", "BLE001"]

[tool.ty.environment]
python-version = "3.14"

# Every ty rule is an error, including the ones that are off or warnings by default.
[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["di", "entrypoints", "pkg", "slices", "tests"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.91",
]
watch = [
    "watchfiles>=1.3.0",
]

# Architecture boundaries (ADR 5, ADR 6): `uv run lint-imports`.
[tool.importlinter]
root_packages = ["di", "entrypoints", "infrastructure", "pkg", "slices"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Process layers: entrypoints → di → infrastructure → slices → pkg"
type = "layers"
layers = ["entrypoints", "di", "infrastructure", "slices", "pkg"]

[[tool.importlinter.contracts]]
name = "Slice layers: applications → domains"
type = "layers"
containers = ["slices.payment"]
layers = ["applications", "domains"]

[[tool.importlinter.contracts]]
name = "Domain and application code stay free of frameworks and drivers"
type = "forbidden"
source_modules = ["slices", "pkg.application"]
forbidden_modules = [
    "dependency_injector",
    "grpc",
    "psycopg",
    "psycopg_pool",
    "authzed",
    "jwt",
    "pydantic_settings",
    "opentelemetry",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = [".", "tests"]
