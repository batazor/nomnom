{{- /*
ADR 37: коннектор Debezium, который доставляет Outbox payments из WAL в Kafka. Конфигурация —
cdc.connector (контракт Outbox, общий для окружений) поверх cdc.database (адрес базы и
ссылка на пароль в Kafka Connect). Chart создаёт ресурс Strimzi KafkaConnector в namespace KafkaConnect (FR-538): Cluster
Operator регистрирует коннектор и сам перезапускает упавшие задачи (autoRestart). Release без cdc.enabled коннектор не
трогает.
*/ -}}
{{- if .Values.cdc.enabled }}
{{- $name := required "cdc.connector.name is required" .Values.cdc.connector.name }}
{{- $cluster := required "cdc.connect.cluster is required (FR-538)" .Values.cdc.connect.cluster }}
{{- $namespace := required "cdc.connect.namespace is required (FR-538)" .Values.cdc.connect.namespace }}
{{- $db := .Values.cdc.database }}
{{- $config := merge (dict
      "transforms.schema.registry.url" (required "cdc.schemaRegistryUrl is required (FR-714)" .Values.cdc.schemaRegistryUrl)
      "database.hostname" (required "cdc.database.hostname is required" $db.hostname)
      "database.port" ($db.port | toString)
      "database.dbname" (required "cdc.database.name is required" $db.name)
      "database.user" (required "cdc.database.user is required" $db.user)
      "database.password" (required "cdc.database.password is required" $db.password))
    .Values.cdc.connector.config }}
{{- $class := required "cdc.connector.config.connector.class is required" (index $config "connector.class") }}
# Ресурс в namespace KafkaConnect: Strimzi читает KafkaConnector только там. connector.class —
# поле class ресурса, а не конфигурация.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
    {{- include "payments.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  class: {{ $class }}
  tasksMax: 1
  # Задача в FAILED (запись без схемы, FR-718; publication, которую миграция ещё не создала)
  # перезапускается с backoff без деплоя.
  autoRestart:
    enabled: true
  config:
    {{- omit $config "connector.class" | toYaml | nindent 4 }}
{{- end }}
