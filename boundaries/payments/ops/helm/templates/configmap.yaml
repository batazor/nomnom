{{- /*
Файл конфигурации процесса (ADR 17): только несекретные настройки. Секреты подключаются
внешними Kubernetes Secret через env (secretKeyRef, envFrom, extraEnv) и этим chart не
создаются.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "payments.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
data:
  config.yaml: |
    {{- include "payments.config" . | nindent 4 }}
