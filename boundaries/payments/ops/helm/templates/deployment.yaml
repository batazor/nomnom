apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "payments.labels" (dict "customLabels" (dict) "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Изменение файла конфигурации перезапускает pod: процесс читает его только при старте.
        checksum/config: {{ include "payments.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "payments.labels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
    spec:
      {{- include "payments.validateShutdownBudget" . }}
      {{- include "payments.validateIdentity" . }}
      {{- include "payments.validateSpiceDB" . }}
      {{- include "payments.validateDatabase" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "payments.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "payments.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "common.compatibility.renderSecurityContext" (dict "secContext" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ include "payments.port" (dict "context" $ "section" "server" "key" "port") }}
              protocol: TCP
            - name: metrics
              containerPort: {{ include "payments.port" (dict "context" $ "section" "management" "key" "port") }}
              protocol: TCP
            - name: webhooks
              containerPort: {{ include "payments.port" (dict "context" $ "section" "provider" "key" "webhookPort") }}
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          env:
            # Несекретная конфигурация — только файл (ADR 17); env задаёт путь к нему и секреты.
            - name: CONFIG_FILE
              value: /etc/nomnom/config.yaml
            # service.instance.id процесса.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPICEDB__PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spicedb.presharedKeySecret.name | quote }}
                  key: {{ .Values.spicedb.presharedKeySecret.key | quote }}
            - name: EVENT_STORE__SUBJECT_KEKS
              valueFrom:
                secretKeyRef:
                  name: {{ required "eventStore.subjectKeysSecret.name is required" .Values.eventStore.subjectKeysSecret.name | quote }}
                  key: {{ .Values.eventStore.subjectKeysSecret.keksKey | quote }}
            - name: EVENT_STORE__SUBJECT_REF_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "eventStore.subjectKeysSecret.name is required" .Values.eventStore.subjectKeysSecret.name | quote }}
                  key: {{ .Values.eventStore.subjectKeysSecret.refKeyKey | quote }}
            {{- with .Values.database.uriSecret }}
            {{- if .name }}
            - name: DATABASE__URI
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with get $.Values $probe }}
          {{- if .enabled }}
          {{ $probe }}:
            {{- include "common.tplvalues.render" (dict "value" (omit . "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nomnom/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: identity-jwks
              mountPath: /etc/nomnom/identity
              readOnly: true
            - name: user-identity-jwks
              mountPath: /etc/nomnom/user-identity
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        # Файл конфигурации процесса (ADR 17).
        - name: config
          configMap:
            name: {{ include "common.names.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
        # Публичные ключи кластера для проверки service identity (ADR 27).
        - name: identity-jwks
          configMap:
            name: {{ .Values.identity.jwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        # Публичные ключи BFF для проверки user assertions (ADR 32).
        - name: user-identity-jwks
          configMap:
            name: {{ .Values.identity.userJwksConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        {{- with .Values.volumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
