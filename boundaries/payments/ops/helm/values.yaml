# Default values for payments.
# Базовый chart не содержит значений конкретного окружения: registry, tag, ресурсы,
# адреса внешних систем и kind-specific настройки задаются отдельными values-файлами
# или флагами --set при установке.

replicaCount: 1

image:
  # Имя образа из документации локальной сборки (docker build -t nomnom/<service>:local).
  # Registry и publishing pipeline ещё не определены и задаются values окружения.
  # Registry задаётся окружением или global.imageRegistry.
  registry: ""
  repository: nomnom/payments
  # Tag образа задаётся окружением. Пустое значение означает "latest" — для реальных
  # окружений всегда задавайте tag явно.
  tag: ""
  # IfNotPresent позволяет использовать образ, загруженный в kind через kind load docker-image.
  pullPolicy: IfNotPresent
  # Digest имеет приоритет над tag.
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
# Labels, добавляемые ко всем ресурсам chart.
commonLabels: {}

# Глобальные параметры library chart bitnami/common: global.imageRegistry,
# global.compatibility.openshift.adaptSecurityContext и т. п.
global: {}

# Label app.kubernetes.io/component.
component: api

# Роль процесса — metadata.name файла конфигурации (ADR 17); процесс сверяет её со своей.
# Обязательна. У chart payments одна роль.
role: payments

# Файл конфигурации процесса (ADR 17, docs/cloud-native-runtime.md): config.spec попадает в
# ConfigMap ключом config.yaml как есть вместе с apiVersion config.nomnom.dev/v1alpha1,
# kind Payments и metadata.name из role. Файл монтируется в /etc/nomnom/config.yaml (env
# CONFIG_FILE); при его изменении pod перезапускается (аннотация checksum/config). Ключи —
# camelCase, неизвестный ключ процесс отвергает при старте; пример со всеми ключами —
# config.example.yaml приложения. Chart дописывает только то, чем владеет:
# spec.identity.jwksFile и spec.identity.userJwksFile (пути смонтированных JWKS) и
# spec.telemetry.resourceAttributes["service.version"] (image.tag). Задать их в values —
# ошибка helm template. Секретов в spec нет: они приходят из Secret через env.
config:
  spec:
    # Бизнес-порт gRPC; он же containerPort с именем service.portName.
    server:
      port: 8084
    # Технический порт runtime contract (docs/cloud-native-runtime.md): /health/* и metrics.
    # Имя порта metrics задано моделью NetworkPolicy (ADR 16) и не меняется. Порт не входит в
    # Service и не публикуется через gateway.
    management:
      port: 9084
    # Бюджет graceful shutdown, <int>(ms|s|m). readinessDelay должен превышать время, за
    # которое readinessProbe замечает not ready (periodSeconds × failureThreshold), плюс
    # распространение EndpointSlice и конфигурации internal gateway.
    shutdown:
      readinessDelay: 5s
      drainTimeout: 20s
      telemetryFlushTimeout: 5s
    # Service identity по projected ServiceAccount token (ADR 27) и user assertions BFF
    # (ADR 32). Все значения обязательны (иначе helm template завершается ошибкой); пути JWKS
    # дописывает chart (см. identity ниже).
    identity:
      # Issuer токенов кластера (/.well-known/openid-configuration).
      issuer: ""
      # Audience этого контекста: token другого контекста отклоняется.
      audience: "nomnom.payments"
      # Allowlist через запятую: namespace/serviceaccount=service-name,
      # например nomnom/orders-worker=orders-worker.
      serviceAccounts: ""
      # Ожидаемый iss user assertion, например nomnom-bff.
      userIssuer: ""
      # Services, которым разрешено передавать user, через запятую, например bff.
      userDelegates: ""
    # Authorization через SpiceDB (ADR 18): endpoint обязателен, preshared key — из Secret
    # spicedb.presharedKeySecret (env SPICEDB__PRESHARED_KEY).
    spicedb:
      # gRPC endpoint host:port, например spicedb.nomnom-authz.svc.cluster.local:50051.
      endpoint: ""
      # Plaintext gRPC без TLS — только для kind и локальных окружений.
      insecure: false
      # Deadline одного CheckPermission в формате <int>(ms|s|m); при превышении use case
      # отклоняется UNAVAILABLE (fail closed).
      timeout: "2s"
    # Платёжный провайдер. kind (fake или stripe) задаёт окружение; webhookPort — HTTP-приём
    # webhooks провайдера (POST /webhooks/provider), порт входит в Service, снаружи доступен
    # только путь /webhooks/provider через public gateway (в kind —
    # ops/kind/manifests/gateway/public-gateway.yaml). Секрет подписи webhooks — env
    # PROVIDER__WEBHOOK_SECRET из Secret (extraEnv или envFrom).
    provider:
      webhookPort: 8085
    # Пул процесса (ADR 8, локальный ADR 1). За пулером PostgreSQL в session mode каждое
    # соединение держит server-соединение: replicas × maxConns должна помещаться в pool_size
    # пулера (README, «Пулер PostgreSQL»). maxConns — по конкурентности процесса: API с
    # webhooks 10.
    database:
      maxConns: 10
      # 0 или 1: простаивающие соединения тоже держат server-соединения пулера.
      minConns: 1
      # psycopg_pool сам закрывает соединение на 0-5% раньше lifetime (jitter).
      maxConnLifetime: "30m"
      maxConnIdleTime: "5m"
      # connect_timeout libpq (целые секунды) и ожидание свободного соединения пула.
      connectTimeout: "5s"
      acquireTimeout: "5s"
    # eventStore.snapshotEvery обязателен и задаётся окружением (локальный ADR 2).
    # ADR 9: telemetry.endpoint, protocol, serviceName, resourceAttributes, tracing.enabled,
    # metrics.enabled, metrics.exportInterval, logging.level — общий формат всех chart.
    telemetry:
      resourceAttributes: {}

serviceAccount:
  create: true
  # Имя ServiceAccount. Пустое значение — <fullname>.
  name: ""
  annotations: {}
  # Доступ к Kubernetes API приложению не нужен. Включение token automount —
  # отдельное явное решение.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # Runtime-образ: python:3.14-slim-bookworm, пользователь app (10001) из Dockerfile. Числовой UID нужен для проверки runAsNonRoot.
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  # Порт Service; targetPort — именованный порт контейнера (config.spec.server.port).
  port: 8084
  # Имя бизнес-порта: он обслуживает nomnom.payments.v1 по gRPC/HTTP2.
  portName: grpc
  appProtocol: kubernetes.io/h2c
  annotations: {}

# Requests/limits не задаются: профиль потребления приложения ещё не измерен.
resources:
  requests: {}
  limits: {}

# Секреты окружения из внешних Secret; несекретные настройки — только config.spec.
# Дополнительные источники переменных окружения, в том числе внешние Secret:
# envFrom:
#   - secretRef:
#       name: payments-secrets
envFrom: []

# Отдельные переменные окружения, включая valueFrom из внешних Secret:
# extraEnv:
#   - name: DATABASE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: payments-database
#         key: password
extraEnv: []

# Должен быть больше config.spec.shutdown.readinessDelay + drainTimeout + telemetryFlushTimeout
# с запасом на выход процесса; chart отказывается рендериться при нарушении.
terminationGracePeriodSeconds: 35

# Probes используют health contract на техническом порту. Поля, кроме enabled, передаются
# в Kubernetes как есть.
startupProbe:
  enabled: true
  httpGet:
    path: /health/startup
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

# Liveness не зависит от внешних систем и остаётся успешной во время shutdown.
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# После SIGTERM readiness сразу отвечает 503; один провал исключает pod из endpoints.
readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: metrics
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

# JWKS для проверки service identity (ADR 27) и user assertions BFF (ADR 32). Оба значения
# обязательны (иначе helm template завершается ошибкой). ConfigMap jwksConfigMap (публичные
# ключи кластера, /openid/v1/jwks) монтируется read-only в /etc/nomnom/identity/jwks.json,
# userJwksConfigMap (публичные ES256 ключи BFF) — в /etc/nomnom/user-identity/jwks.json; эти
# пути chart пишет в config.spec.identity.jwksFile и userJwksFile.
identity:
  # Имя ConfigMap с ключом jwks.json; создаётся развёртыванием, не этим chart.
  jwksConfigMap: ""
  # Имя ConfigMap с ключом jwks.json (JWKS BFF); создаётся развёртыванием, не этим chart.
  userJwksConfigMap: ""

# Secret с preshared key SpiceDB (env SPICEDB__PRESHARED_KEY) создаётся развёртыванием, не этим
# chart; ключ в values не хранится. name обязателен.
spicedb:
  presharedKeySecret:
    name: ""
    key: "preshared-key"

# Секреты ключей субъектов (crypto-shredding, локальный ADR 2). Secret создаётся развёртыванием,
# не этим chart; name обязателен. keks — JSON {"<версия>": "<KEK>"}, ref-key не меняется никогда.
eventStore:
  subjectKeysSecret:
    name: ""
    keksKey: "keks"
    refKeyKey: "ref-key"

# PostgreSQL (ADR 8, локальный ADR 1). Connection URI (postgresql://…) берётся из внешнего Secret
# (env DATABASE__URI) и не хранится в values; без uriSecret.name переменная не задаётся и процесс
# не стартует. Пул процесса — config.spec.database.
database:
  # Secret создаётся развёртыванием, не этим chart.
  uriSecret:
    name: ""
    key: "dsn"

# ADR 37: Outbox payments доставляет Debezium (Kafka Connect) из WAL. Release контекста
# создаёт ресурс KafkaConnector cdc.connector.name в KafkaConnect cdc.connect.
cdc:
  enabled: false
  # KafkaConnect, к которому относится ресурс KafkaConnector (FR-538): имя и namespace, например
  # kafka-connect и nomnom-infra.
  connect:
    cluster: ""
    namespace: ""
  # Schema Registry для SchemaFraming коннектора (FR-714), например
  # http://schema-registry.nomnom-infra.svc.cluster.local:8081.
  schemaRegistryUrl: ""
  # Адрес базы для Kafka Connect. password — ссылка config provider Connect, не сам пароль,
  # например ${dir:/mnt/cdc:payments-password}.
  database:
    hostname: ""
    port: 5432
    name: ""
    user: ""
    password: ""
  # Контракт Outbox (ADR 37): таблица payments_outbox, publication payments_outbox (миграция
  # 00002), слот payments_outbox; топик — поле topic, ключ — aggregate_id, value — payload как
  # есть, Event Envelope — заголовки из полей записи (как у прежнего payments-relay).
  connector:
    name: payments-outbox
    config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      plugin.name: pgoutput
      topic.prefix: payments-outbox
      slot.name: payments_outbox
      publication.name: payments_outbox
      publication.autocreate.mode: disabled
      table.include.list: public.payments_outbox
      snapshot.mode: no_data
      skipped.operations: u,d,t
      tombstones.on.delete: "false"
      extended.headers.enabled: "false"
      key.converter: org.apache.kafka.connect.storage.StringConverter
      value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
      header.converter: org.apache.kafka.connect.storage.SimpleHeaderConverter
      # SchemaFraming (FR-714): value стримов Integration Events — wire format Schema Registry
      # по header event_type; Change Notification streams (*-changes) в topics не входят.
      transforms: outbox,schema
      transforms.schema.type: nomnom.connect.SchemaFraming
      transforms.schema.topics: payments.v1.payment-events
      transforms.schema.cache.ttl.ms: "60000"
      transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
      transforms.outbox.table.field.event.id: event_id
      transforms.outbox.table.field.event.key: aggregate_id
      transforms.outbox.table.field.event.payload: payload
      transforms.outbox.table.expand.json.payload: "false"
      transforms.outbox.route.by.field: topic
      transforms.outbox.route.topic.replacement: ${routedByValue}
      transforms.outbox.table.fields.additional.placement: event_id:header:_watermill_message_uuid,event_id:header:event_id,event_type:header:event_type,occurred_at:header:occurred_at,aggregate_type:header:aggregate_type,aggregate_id:header:aggregate_id,aggregate_version:header:aggregate_version,traceparent:header:traceparent

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
