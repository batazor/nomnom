# Skaffold-описание тестового kind-окружения. Запускается из этого каталога (пути
# относительны рабочему каталогу Skaffold), kube-context передаётся флагом --kube-context.
# Версии charts закреплены здесь: Skaffold не подставляет environment в remoteChart/version.
# Остальные версии (kind, node image, Skaffold, Gateway API CRD, образы) — в ../versions.env.
#
#   platform — CNI (Cilium + Hubble), controller gateways (Envoy Gateway + Gateway API CRD) и
#              cert-manager;
#   apps     — образы bounded contexts, их Helm charts, internal gateway и pod проверок.
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: platform
deploy:
  statusCheckDeadlineSeconds: 600
  helm:
    releases:
      # Параметры для kind по официальной инструкции Cilium; kube-proxy сохраняется.
      - name: cilium
        remoteChart: oci://quay.io/cilium/charts/cilium
        version: 1.20.4
        namespace: kube-system
        wait: true
        setValues:
          image.pullPolicy: IfNotPresent
          ipam.mode: kubernetes
          operator.replicas: 1
          hubble.enabled: true
          hubble.relay.enabled: false
          hubble.ui.enabled: false
      - name: envoy-gateway
        remoteChart: oci://docker.io/envoyproxy/gateway-helm
        version: v1.9.2
        namespace: envoy-gateway-system
        createNamespace: true
        wait: true
      # После Envoy Gateway: поддержка Gateway API включается, только если CRD уже есть.
      # Выпускает сертификаты public gateway от локального CA (manifests/certs/issuers.yaml).
      - name: cert-manager
        remoteChart: oci://quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        namespace: cert-manager
        createNamespace: true
        wait: true
        setValues:
          crds.enabled: true
          config.apiVersion: controller.config.cert-manager.io/v1alpha1
          config.kind: ControllerConfiguration
          config.enableGatewayAPI: true
    hooks:
      after:
        # Установленные chart Envoy Gateway CRD должны совпадать с закреплённой версией Gateway API.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                bundle="$(kubectl --context "$SKAFFOLD_KUBE_CONTEXT" get crd grpcroutes.gateway.networking.k8s.io \
                  -o jsonpath='{.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}')"
                test "$bundle" = "$GATEWAY_API_VERSION" || {
                  echo "Gateway API CRD $bundle installed, versions.env expects $GATEWAY_API_VERSION" >&2
                  exit 1
                }
                kubectl --context "$SKAFFOLD_KUBE_CONTEXT" label namespace envoy-gateway-system \
                  nomnom.dev/tier=gateway-data-plane --overwrite
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: apps
# Без requires: platform ставит make kind-up, а make kind-deploy/kind-dev запускают только
# --module apps, чтобы итерация dev loop не передеплоивала Cilium и Envoy Gateway.
build:
  local:
    push: false
    useBuildkit: true
    # По умолчанию 1: образы четырёх контекстов собирались бы последовательно.
    concurrency: 0
  # Локальная сборка без push: Skaffold тегирует образ его image ID, поэтому кластер
  # запускает именно собранную версию; в kind образы загружаются без registry.
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: nomnom/orders
      context: ../../../boundaries/orders
      docker:
        target: runtime
    - image: nomnom/restaurants
      context: ../../../boundaries/restaurants
      docker:
        target: runtime
    - image: nomnom/delivery
      context: ../../../boundaries/delivery
      docker:
        target: runtime
    - image: nomnom/payments
      context: ../../../boundaries/payments
      docker:
        target: runtime
    # BFF (ADR 10): Cosmo Router с закреплённым SHA-256, router plugin и execution config.
    - image: nomnom/bff
      context: ../../../boundaries/bff
      docker:
        target: runtime
    # Образ проверок kind E2E (e2e/probe): контекст — корень репозитория ради proto всех
    # контекстов, лишнее отсекает e2e/probe/Dockerfile.dockerignore.
    - image: nomnom/e2e-probe
      context: ../../..
      docker:
        dockerfile: ops/kind/e2e/probe/Dockerfile
manifests:
  # SpiceDB, PostgreSQL и MongoDB (данные в памяти и emptyDir) применяет только before-hook:
  # rawYaml добавляет pod template label skaffold.dev/run-id, и каждый deploy перезапускал бы
  # их с пустыми данными уже после миграций приложений.
  rawYaml:
    - ../manifests/base/namespaces.yaml
    - ../manifests/gateway/gateway.yaml
    - ../manifests/certs/issuers.yaml
    - ../manifests/gateway/public-gateway.yaml
    - ../manifests/fixtures/net-probe.yaml
    - ../manifests/observability/trace-capture.yaml
deploy:
  statusCheckDeadlineSeconds: 300
  kubectl:
    hooks:
      after:
        # Skaffold status check не знает conditions Gateway API: ждём их явно.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k wait gatewayclass/nomnom-internal --for=condition=Accepted --timeout=300s
                k wait gatewayclass/nomnom-public --for=condition=Accepted --timeout=300s
                k -n nomnom-gateway wait gateway/internal --for=condition=Accepted --timeout=300s
                k -n nomnom-gateway wait gateway/internal --for=condition=Programmed --timeout=300s
                # ResolvedRefs=False — нет ReferenceGrant или Service backend'а: gateway ответил бы 500.
                k -n nomnom-gateway wait grpcroute --all --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n nomnom-gateway wait grpcroute --all --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}'=True
                k -n nomnom-gateway wait backendtrafficpolicy --all --timeout=300s \
                  --for=jsonpath='{.status.ancestors[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n envoy-gateway-system wait deployment --for=condition=Available --timeout=300s \
                  -l gateway.envoyproxy.io/owning-gateway-name=internal
                k -n nomnom-gateway wait gateway/public --for=condition=Programmed --timeout=300s
                k -n nomnom-gateway wait httproute/payments-provider-webhooks --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n envoy-gateway-system wait deployment --for=condition=Available --timeout=300s \
                  -l gateway.envoyproxy.io/owning-gateway-name=public
                test "$(k -n envoy-gateway-system get service internal-gateway -o jsonpath='{.spec.type}')" = ClusterIP
  # Bounded contexts и BFF ставятся собственными charts (ADR 12) с values тестового окружения.
  helm:
    # Releases независимы и ставятся параллельно; порядок задаёт dependsOn.
    concurrency: 0
    hooks:
      before:
        # Skaffold применяет rawYaml после helm, поэтому всё, что charts читают при старте,
        # создаётся здесь: namespaces, JWKS (ADR 27), ключ и JWKS BFF, JWKS тестового identity
        # provider (ADR 32), bootstrap и preshared key SpiceDB
        # (ADR 18), Secrets и PostgreSQL orders, payments и delivery, MongoDB restaurants (ADR 8, ADR 31).
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k apply -f ../manifests/base/namespaces.yaml
                ../scripts/identity-jwks.sh "$SKAFFOLD_KUBE_CONTEXT"
                ../scripts/bff-identity.sh "$SKAFFOLD_KUBE_CONTEXT"
                ../scripts/authz.sh "$SKAFFOLD_KUBE_CONTEXT"
                ../scripts/postgres.sh "$SKAFFOLD_KUBE_CONTEXT"
                ../scripts/mongodb.sh "$SKAFFOLD_KUBE_CONTEXT" secrets
                k apply -f ../manifests/authz/spicedb.yaml -f ../manifests/data/postgres-orders.yaml \
                  -f ../manifests/data/postgres-payments.yaml -f ../manifests/data/postgres-delivery.yaml \
                  -f ../manifests/data/mongodb-restaurants.yaml
                k -n nomnom-authz wait deployment/spicedb --for=condition=Available --timeout=300s
                for db in orders payments delivery; do
                  k -n nomnom-data wait "deployment/postgres-${db}" --for=condition=Available --timeout=300s
                done
                k -n nomnom-data wait deployment/mongodb-restaurants --for=condition=Available --timeout=300s
                ../scripts/mongodb.sh "$SKAFFOLD_KUBE_CONTEXT" init
        # Kafka и Temporal dev server для orders-consumer (ADR 28) нужны до установки charts:
        # consumer подключается к ним при startup.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k apply -f ../manifests/messaging/infrastructure.yaml
                k -n nomnom-infra wait deployment/kafka deployment/temporal --for=condition=Available --timeout=300s
    releases:
      - name: orders
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        valuesFiles: [../values/orders.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      - name: restaurants
        chartPath: ../../../boundaries/restaurants/ops/helm
        namespace: nomnom-restaurants
        createNamespace: true
        valuesFiles: [../values/restaurants.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_restaurants}}"
          image.tag: "{{.IMAGE_TAG_nomnom_restaurants}}"
      - name: delivery
        chartPath: ../../../boundaries/delivery/ops/helm
        namespace: nomnom-delivery
        createNamespace: true
        valuesFiles: [../values/delivery.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_delivery}}"
          image.tag: "{{.IMAGE_TAG_nomnom_delivery}}"
      - name: payments
        chartPath: ../../../boundaries/payments/ops/helm
        namespace: nomnom-payments
        createNamespace: true
        valuesFiles: [../values/payments.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_payments}}"
          image.tag: "{{.IMAGE_TAG_nomnom_payments}}"
      # Kafka consumer orders (ADR 28): тот же образ и chart, command /orders-consumer.
      - name: orders-consumer
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [orders]
        valuesFiles:
          - ../../../boundaries/orders/ops/helm/values-consumer.yaml
          - ../values/orders-consumer.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      # Outbox relay payments (ADR 31): тот же образ и chart, один активный экземпляр.
      - name: payments-relay
        chartPath: ../../../boundaries/payments/ops/helm
        namespace: nomnom-payments
        createNamespace: true
        dependsOn: [payments]
        valuesFiles:
          - ../../../boundaries/payments/ops/helm/values-relay.yaml
          - ../values/payments-relay.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_payments}}"
          image.tag: "{{.IMAGE_TAG_nomnom_payments}}"
      # Outbox relay delivery (ADR 31): тот же образ и chart, один активный экземпляр.
      - name: delivery-relay
        chartPath: ../../../boundaries/delivery/ops/helm
        namespace: nomnom-delivery
        createNamespace: true
        dependsOn: [delivery]
        valuesFiles:
          - ../../../boundaries/delivery/ops/helm/values-relay.yaml
          - ../values/delivery-relay.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_delivery}}"
          image.tag: "{{.IMAGE_TAG_nomnom_delivery}}"
      # Outbox relay restaurants (ADR 31): тот же образ и chart, один активный экземпляр.
      - name: restaurants-relay
        chartPath: ../../../boundaries/restaurants/ops/helm
        namespace: nomnom-restaurants
        createNamespace: true
        dependsOn: [restaurants]
        valuesFiles:
          - ../../../boundaries/restaurants/ops/helm/values-relay.yaml
          - ../values/restaurants-relay.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_restaurants}}"
          image.tag: "{{.IMAGE_TAG_nomnom_restaurants}}"
      # Kafka consumer restaurants (ADR 11, ADR 28): тот же образ и chart, OrderPlaced →
      # Restaurant Order через Inbox. После restaurants: его init container создаёт Inbox.
      - name: restaurants-consumer
        chartPath: ../../../boundaries/restaurants/ops/helm
        namespace: nomnom-restaurants
        createNamespace: true
        dependsOn: [restaurants]
        valuesFiles:
          - ../../../boundaries/restaurants/ops/helm/values-consumer.yaml
          - ../values/restaurants-consumer.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_restaurants}}"
          image.tag: "{{.IMAGE_TAG_nomnom_restaurants}}"
      # Temporal worker orders: Order Fulfillment Workflow, тот же образ и chart,
      # command /orders-worker. После orders: его init container применяет миграции.
      - name: orders-worker
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [orders]
        valuesFiles:
          - ../../../boundaries/orders/ops/helm/values-worker.yaml
          - ../values/orders-worker.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      # Outbox forwarder orders (ADR 13): тот же образ и chart, один активный экземпляр.
      - name: orders-forwarder
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [orders]
        valuesFiles:
          - ../../../boundaries/orders/ops/helm/values-forwarder.yaml
          - ../values/orders-forwarder.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      # BFF (ADR 32): контексты только через internal gateway; access tokens тестового identity
      # provider, ключ assertions — scripts/bff-identity.sh. Последний release: индексы в
      # patches профилей не меняются.
      - name: bff
        chartPath: ../../../boundaries/bff/ops/helm
        namespace: nomnom-bff
        createNamespace: true
        valuesFiles: [../values/bff.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_bff}}"
          image.tag: "{{.IMAGE_TAG_nomnom_bff}}"
profiles:
  # make kind-deploy GRAFANA_CLOUD=1: метрики, traces и логи сервисов → Alloy → Grafana Cloud.
  # Индексы releases 0–10 — все процессы orders, restaurants, delivery, payments (BFF — Cosmo,
  # своя telemetry); при изменении порядка releases поправить patches.
  - name: grafana-cloud
    patches:
      - op: add
        path: /deploy/helm/hooks/before/-
        value:
          host:
            command: ["sh", "-c", "../scripts/grafana-cloud.sh \"$SKAFFOLD_KUBE_CONTEXT\""]
      - op: add
        path: /deploy/helm/releases/0/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/1/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/2/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/3/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/4/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/5/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/6/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/7/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/8/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/9/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/10/valuesFiles/-
        value: ../values/grafana-cloud.yaml
  # make kind-dev: restaurants и payments собираются из stage dev и получают file sync —
  # правка исходников копируется в контейнер, процесс перезапускает node --watch / watchfiles.
  # Go и Rust компилируются (а orders на distroless без tar), поэтому идут через пересборку.
  # Индексы artifacts: 1 — restaurants, 3 — payments; при изменении порядка поправить patches.
  - name: dev
    activation:
      - command: dev
    patches:
      - op: replace
        path: /build/artifacts/1/docker/target
        value: dev
      - op: add
        path: /build/artifacts/1/sync
        value:
          manual:
            - src: "cmd/**/*.ts"
              dest: .
            - src: "di/**/*.ts"
              dest: .
            - src: "infrastructure/**/*.ts"
              dest: .
            - src: "infrastructure/**/*.js"
              dest: .
            - src: "pkg/**/*.ts"
              dest: .
            - src: "slices/**/*.ts"
              dest: .
      # Индекс releases: 1 — restaurants.
      - op: add
        path: /deploy/helm/releases/1/valuesFiles/-
        value: ../values/restaurants-dev.yaml
      # Индекс releases: 7 — restaurants-relay.
      - op: add
        path: /deploy/helm/releases/7/valuesFiles/-
        value: ../values/restaurants-relay-dev.yaml
      # Индекс releases: 8 — restaurants-consumer.
      - op: add
        path: /deploy/helm/releases/8/valuesFiles/-
        value: ../values/restaurants-consumer-dev.yaml
      - op: replace
        path: /build/artifacts/3/docker/target
        value: dev
      - op: add
        path: /build/artifacts/3/sync
        value:
          manual:
            - src: "di/**/*.py"
              dest: .
            - src: "entrypoints/**/*.py"
              dest: .
            - src: "infrastructure/**/*.py"
              dest: .
            - src: "pkg/**/*.py"
              dest: .
            - src: "slices/**/*.py"
              dest: .
