# Skaffold-описание тестового kind-окружения. Запускается из этого каталога (пути
# относительны рабочему каталогу Skaffold), kube-context передаётся флагом --kube-context.
# Версии charts закреплены здесь: Skaffold не подставляет environment в remoteChart/version.
# Остальные версии (kind, node image, Skaffold, Gateway API CRD, образы) — в ../versions.env.
#
#   platform — CNI (Cilium, Hubble observer без relay), controller gateways (Envoy Gateway + Gateway API CRD),
#              cert-manager, Temporal Worker Controller и Strimzi;
#   apps     — образы bounded contexts, их Helm charts, internal gateway и pod проверок.
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: platform
deploy:
  statusCheckDeadlineSeconds: 600
  helm:
    releases:
      # Параметры для kind по официальной инструкции Cilium; kube-proxy сохраняется.
      # upgradeOnChange: Skaffold по умолчанию не обновляет установленный remote chart, и
      # правка values платформы не доходила бы до существующего кластера.
      - name: cilium
        remoteChart: oci://quay.io/cilium/charts/cilium
        version: 1.20.4
        namespace: kube-system
        upgradeOnChange: true
        wait: true
        setValues:
          image.pullPolicy: IfNotPresent
          ipam.mode: kubernetes
          operator.replicas: 1
          # Только observer в агенте: kubectl exec ds/cilium -- hubble observe (e2e/netpol,
          # scripts/diagnostics.sh). Relay, UI и метрики выключены ради памяти и CPU ноутбука:
          # кластер одноузловой, все flows видит единственный агент.
          hubble.enabled: true
          hubble.relay.enabled: false
          hubble.ui.enabled: false
      - name: envoy-gateway
        remoteChart: oci://docker.io/envoyproxy/gateway-helm
        version: v1.9.2
        namespace: envoy-gateway-system
        createNamespace: true
        upgradeOnChange: true
        wait: true
      # После Envoy Gateway: поддержка Gateway API включается, только если CRD уже есть.
      # Выпускает сертификаты public gateway от локального CA и ключ user assertions BFF
      # (chart ../bootstrap, templates/certs.yaml и templates/identity.yaml).
      - name: cert-manager
        remoteChart: oci://quay.io/jetstack/charts/cert-manager
        version: v1.21.3
        namespace: cert-manager
        createNamespace: true
        upgradeOnChange: true
        wait: true
        setValues:
          crds.enabled: true
          config.apiVersion: controller.config.cert-manager.io/v1alpha1
          config.kind: ControllerConfiguration
          config.enableGatewayAPI: true
      # Temporal Worker Controller (ADR 5 orders): Deployment на каждый Build ID worker'а,
      # регистрация Worker Deployment Version и маршрутизация новых workflow. CRD — отдельный
      # chart, ставится первым; сертификат webhook выпускает cert-manager.
      - name: temporal-worker-controller-crds
        remoteChart: oci://docker.io/temporalio/temporal-worker-controller-crds
        version: 0.33.0
        namespace: temporal-system
        createNamespace: true
        upgradeOnChange: true
        wait: true
      - name: temporal-worker-controller
        remoteChart: oci://docker.io/temporalio/temporal-worker-controller
        version: 0.33.0
        namespace: temporal-system
        createNamespace: true
        upgradeOnChange: true
        wait: true
      # Strimzi Cluster Operator (FR-720): Apache Kafka, topics, Kafka Connect и коннекторы
      # ресурсами Kafka, KafkaNodePool, KafkaTopic, KafkaConnect и KafkaConnector в nomnom-infra.
      # watchAnyNamespace: nomnom-infra создаёт before-hook модуля apps, его ещё нет при
      # установке платформы, а RoleBinding в несуществующем namespace chart не создаст.
      - name: strimzi
        remoteChart: oci://quay.io/strimzi-helm/strimzi-kafka-operator
        version: 1.3.0
        namespace: strimzi
        createNamespace: true
        upgradeOnChange: true
        wait: true
        setValues:
          watchAnyNamespace: true
          # NetworkPolicy стенда — manifests/netpol (ADR 16); сгенерированные Strimzi закрыли бы
          # REST Kafka Connect от Console и проверок e2e.
          generateNetworkPolicy: false
    hooks:
      after:
        # Установленные chart Envoy Gateway CRD должны совпадать с закреплённой версией Gateway API.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                bundle="$(kubectl --context "$SKAFFOLD_KUBE_CONTEXT" get crd grpcroutes.gateway.networking.k8s.io \
                  -o jsonpath='{.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}')"
                test "$bundle" = "$GATEWAY_API_VERSION" || {
                  echo "Gateway API CRD $bundle installed, versions.env expects $GATEWAY_API_VERSION" >&2
                  exit 1
                }
                kubectl --context "$SKAFFOLD_KUBE_CONTEXT" label namespace envoy-gateway-system \
                  nomnom.dev/tier=gateway-data-plane --overwrite
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: apps
# Без requires: platform ставит make kind-up, а make kind-deploy/kind-dev запускают только
# --module apps, чтобы итерация dev loop не передеплоивала Cilium и Envoy Gateway.
build:
  local:
    push: false
    useBuildkit: true
    # Не больше трёх сборок одновременно: без ограничения семь образов (Rust, Go, Node, Python)
    # собираются разом и забирают весь CPU ноутбука.
    concurrency: 3
  # Локальная сборка без push: Skaffold тегирует образ его image ID, поэтому кластер
  # запускает именно собранную версию; в kind образы загружаются без registry.
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: nomnom/orders
      context: ../../../boundaries/orders
      docker:
        target: runtime
    - image: nomnom/restaurants
      context: ../../../boundaries/restaurants
      docker:
        target: runtime
    - image: nomnom/delivery
      context: ../../../boundaries/delivery
      docker:
        target: runtime
    - image: nomnom/payments
      context: ../../../boundaries/payments
      docker:
        target: runtime
    # Kafka Connect с Debezium и JMX exporter (ADR 37).
    - image: nomnom/kafka-connect
      context: ../kafka-connect
    # BFF (ADR 10): Cosmo Router с закреплённым SHA-256, router plugin и execution config.
    - image: nomnom/bff
      context: ../../../boundaries/bff
      docker:
        target: runtime
    # Образ проверок kind E2E (e2e/probe): контекст — корень репозитория ради proto всех
    # контекстов, лишнее отсекает e2e/probe/Dockerfile.dockerignore.
    - image: nomnom/e2e-probe
      context: ../../..
      docker:
        dockerfile: ops/kind/e2e/probe/Dockerfile
    # Seed демо-данных (chart ../demo): стадия demo-seed того же Dockerfile — образ проверок
    # с python3 и openssl.
    - image: nomnom/demo-seed
      context: ../../..
      docker:
        dockerfile: ops/kind/e2e/probe/Dockerfile
        target: demo-seed
    # Control plane (ADR 41): реестр Cell и Market.
    - image: nomnom/controlplane
      context: ../../../boundaries/controlplane
      docker:
        target: runtime
    # Customer UI (локальный ADR 2 UI): vite build за nginx. Контекст — boundaries/ ради
    # клиентской схемы BFF; лишнее отсекает ui/Dockerfile.dockerignore. Индексы в
    # patches профилей (1, 3, 5) не меняются.
    - image: nomnom/ui
      context: ../../../boundaries
      docker:
        dockerfile: ui/Dockerfile
        target: runtime
    # Регистрация схем Integration Events (FR-712): контекст — корень репозитория ради .proto
    # модулей контекстов, лишнее отсекает Dockerfile.dockerignore. Добавлен после ui: индексы
    # в patches профилей не меняются.
    - image: nomnom/schema-registration
      context: ../../..
      docker:
        dockerfile: ops/schema-registration/Dockerfile
        target: runtime
manifests:
  # SpiceDB, PostgreSQL и MongoDB (данные в памяти и emptyDir) ставит chart ../bootstrap из
  # before-hook: rawYaml и releases Skaffold получают pod template label skaffold.dev/run-id, и
  # каждый deploy перезапускал бы их с пустыми данными уже после миграций приложений.
  rawYaml:
    - ../manifests/base/namespaces.yaml
    - ../manifests/gateway/public-gateway.yaml
  # Internal gateway: profile grafana-cloud заменяет путь на ../manifests/observability,
  # которая включает его и переключает spans gateway на Alloy.
  kustomize:
    paths: [../manifests/gateway]
deploy:
  statusCheckDeadlineSeconds: 300
  kubectl:
    hooks:
      after:
        # Skaffold status check не знает conditions Gateway API: ждём их явно.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k wait gatewayclass/nomnom-internal --for=condition=Accepted --timeout=300s
                k wait gatewayclass/nomnom-public --for=condition=Accepted --timeout=300s
                k -n nomnom-gateway wait gateway/internal --for=condition=Accepted --timeout=300s
                k -n nomnom-gateway wait gateway/internal --for=condition=Programmed --timeout=300s
                # ResolvedRefs=False — нет ReferenceGrant или Service backend'а: gateway ответил бы 500.
                k -n nomnom-gateway wait grpcroute --all --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n nomnom-gateway wait grpcroute --all --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}'=True
                k -n nomnom-gateway wait backendtrafficpolicy --all --timeout=300s \
                  --for=jsonpath='{.status.ancestors[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n envoy-gateway-system wait deployment --for=condition=Available --timeout=300s \
                  -l gateway.envoyproxy.io/owning-gateway-name=internal
                k -n nomnom-gateway wait gateway/public --for=condition=Programmed --timeout=300s
                k -n nomnom-gateway wait httproute/payments-provider-webhooks --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n nomnom-gateway wait httproute/ui httproute/dex --timeout=300s \
                  --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True
                k -n envoy-gateway-system wait deployment --for=condition=Available --timeout=300s \
                  -l gateway.envoyproxy.io/owning-gateway-name=public
                test "$(k -n envoy-gateway-system get service internal-gateway -o jsonpath='{.spec.type}')" = ClusterIP
  # Bounded contexts и BFF ставятся собственными charts (ADR 12) с values тестового окружения.
  helm:
    # Releases независимы и ставятся параллельно; порядок задаёт dependsOn.
    concurrency: 0
    hooks:
      before:
        # Skaffold применяет rawYaml после helm, поэтому всё, что charts читают при старте,
        # создаётся здесь (ADR 34): namespaces и chart ../bootstrap — локальный CA и ключ BFF
        # (cert-manager), SpiceDB с bootstrap и preshared key (ADR 18), PostgreSQL orders,
        # payments, delivery, controlplane, MongoDB, Valkey restaurants и delivery со случайными паролями, сохраняемыми между
        # deploy (ADR 8, ADR 31), JWKS кластера, BFF и тестового identity provider (ADR 27,
        # ADR 32). --wait ждёт readiness хранилищ, затем hook Jobs инициализируют replica set
        # MongoDB и публикуют JWKS. --take-ownership принимает ресурсы, созданные до chart.
        # Admission-политика workloads (ADR 17) — до первого workload, иначе chart bootstrap и
        # charts приложений прошли бы мимо неё.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                kubectl --context "$SKAFFOLD_KUBE_CONTEXT" apply -f ../manifests/base/namespaces.yaml
                kubectl --context "$SKAFFOLD_KUBE_CONTEXT" apply -f ../manifests/admission/workload-baseline.yaml
                helm upgrade --install bootstrap ../bootstrap --kube-context "$SKAFFOLD_KUBE_CONTEXT" \
                  --namespace nomnom-data --take-ownership --server-side=true --force-conflicts \
                  --wait --timeout 10m \
                  --set-file authz.schema=../../../authorization/schema.zed \
                  --set-file authz.bootstrap=../../../authorization/bootstrap.yaml \
                  --set-file authz.kindBootstrap=../authz/bootstrap-kind.yaml \
                  --set-file identity.idpJwks=../../../tests/identity/fixtures/idp-jwks.json
        # Брокер, topics, Schema Registry и Temporal dev server нужны до установки charts:
        # consumers подключаются к ним при startup, а broker не создаёт topics сам (FR-720,
        # FR-721). Kafka, KafkaNodePool и KafkaTopic приводит к кластеру Strimzi Cluster Operator
        # платформы; hook ждёт их Ready. Schema Registry стартует после брокера: его topic
        # _schemas — тоже KafkaTopic.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k apply -f ../manifests/messaging/infrastructure.yaml
                k apply -f ../manifests/messaging/kafka.yaml
                k -n nomnom-infra wait kafka/kafka --for=condition=Ready --timeout=600s
                k apply -f ../manifests/messaging/topics.yaml
                k -n nomnom-infra wait kafkatopic --all --for=condition=Ready --timeout=300s
                k apply -f ../manifests/messaging/schema-registry.yaml
                k -n nomnom-infra wait deployment/schema-registry deployment/temporal \
                  --for=condition=Available --timeout=300s
      after:
        # Skaffold status check не знает WorkerDeployment: ждём, пока Temporal Worker Controller
        # сделает версию orders-worker текущей, иначе новые заказы не на чем исполнять.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                kubectl --context "$SKAFFOLD_KUBE_CONTEXT" -n nomnom-orders wait workerdeployment/orders-worker \
                  --for=condition=Ready --timeout=300s
        # Skaffold status check не знает ресурсов Strimzi: Kafka Connect и коннекторы контекстов
        # (FR-722, FR-538) ждём явно.
        - host:
            command:
              - sh
              - -c
              - |
                set -eu
                k() { kubectl --context "$SKAFFOLD_KUBE_CONTEXT" "$@"; }
                k -n nomnom-infra wait kafkaconnect/kafka-connect --for=condition=Ready --timeout=600s
                k -n nomnom-infra wait kafkaconnector --all --for=condition=Ready --timeout=300s
    releases:
      - name: orders
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [kafka-connect]
        valuesFiles: [../values/orders.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      - name: restaurants
        chartPath: ../../../boundaries/restaurants/ops/helm
        namespace: nomnom-restaurants
        createNamespace: true
        dependsOn: [kafka-connect]
        valuesFiles: [../values/restaurants.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_restaurants}}"
          image.tag: "{{.IMAGE_TAG_nomnom_restaurants}}"
      - name: delivery
        chartPath: ../../../boundaries/delivery/ops/helm
        namespace: nomnom-delivery
        createNamespace: true
        dependsOn: [kafka-connect]
        valuesFiles: [../values/delivery.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_delivery}}"
          image.tag: "{{.IMAGE_TAG_nomnom_delivery}}"
      - name: payments
        chartPath: ../../../boundaries/payments/ops/helm
        namespace: nomnom-payments
        createNamespace: true
        dependsOn: [kafka-connect]
        valuesFiles: [../values/payments.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_payments}}"
          image.tag: "{{.IMAGE_TAG_nomnom_payments}}"
      # Kafka consumer orders (ADR 28): тот же образ и chart, command /orders-consumer.
      - name: orders-consumer
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [orders]
        valuesFiles:
          - ../../../boundaries/orders/ops/helm/values-consumer.yaml
          - ../values/orders-consumer.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      # Kafka consumer restaurants (ADR 11, ADR 28): тот же образ и chart, OrderPlaced →
      # Restaurant Order через Inbox. Схему каждый процесс создаёт сам при старте (ADR 42).
      - name: restaurants-consumer
        chartPath: ../../../boundaries/restaurants/ops/helm
        namespace: nomnom-restaurants
        createNamespace: true
        dependsOn: [restaurants]
        valuesFiles:
          - ../../../boundaries/restaurants/ops/helm/values-consumer.yaml
          - ../values/restaurants-consumer.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_restaurants}}"
          image.tag: "{{.IMAGE_TAG_nomnom_restaurants}}"
      # Temporal worker orders: Order Fulfillment Workflow, тот же образ и chart,
      # command /orders-worker. Миграции процесс применяет сам при старте (ADR 42).
      - name: orders-worker
        chartPath: ../../../boundaries/orders/ops/helm
        namespace: nomnom-orders
        createNamespace: true
        dependsOn: [orders]
        valuesFiles:
          - ../../../boundaries/orders/ops/helm/values-worker.yaml
          - ../values/orders-worker.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_orders}}"
          image.tag: "{{.IMAGE_TAG_nomnom_orders}}"
      # BFF (ADR 32): контексты только через internal gateway; access tokens тестового identity
      # provider, ключ assertions — Secret bff-assertion-key от cert-manager (chart ../bootstrap).
      # Последний release: индексы в patches профилей не меняются.
      - name: bff
        chartPath: ../../../boundaries/bff/ops/helm
        namespace: nomnom-bff
        createNamespace: true
        valuesFiles: [../values/bff.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_bff}}"
          image.tag: "{{.IMAGE_TAG_nomnom_bff}}"
      # Fixtures проверок kind E2E (ADR 33): Helm-релиз, а не rawYaml — профиль core убирает его
      # из конфигурации и снимает helm uninstall. Индекс 8 — в patches core.
      - name: e2e
        chartPath: ../e2e/chart
        namespace: nomnom-bff
        createNamespace: true
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_e2e_probe}}"
          image.tag: "{{.IMAGE_TAG_nomnom_e2e_probe}}"
      # Демо-данные flow board (только kind): Job наполняет контексты через internal gateway —
      # рестораны с меню, персонал, курьер на линии, идемпотентно.
      - name: demo
        chartPath: ../demo
        namespace: nomnom-bff
        createNamespace: true
        dependsOn: [orders, restaurants, delivery, payments, bff, controlplane]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_demo_seed}}"
          image.tag: "{{.IMAGE_TAG_nomnom_demo_seed}}"
      # Kafka Connect с Debezium (ADR 37): доставляет Outbox контекстов. wait — releases
      # контекстов (dependsOn) регистрируют коннекторы hook Jobs, когда Connect уже готов.
      - name: kafka-connect
        chartPath: ../kafka-connect/chart
        namespace: nomnom-infra
        createNamespace: true
        wait: true
        # Коннекторы оформляют записи по зарегистрированным схемам (FR-716): Connect — после них.
        dependsOn: [schema-registration]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_kafka_connect}}"
          image.tag: "{{.IMAGE_TAG_nomnom_kafka_connect}}"
      # Control plane (ADR 41): глобальный реестр Cell, Market и Market Placement; БД и SpiceDB
      # готовит chart ../bootstrap. Cell cell-1 и Market berlin регистрирует Job chart ../demo.
      # Индекс 11 — в patches grafana-cloud.
      - name: controlplane
        chartPath: ../../../boundaries/controlplane/ops/helm
        namespace: nomnom-controlplane
        createNamespace: true
        valuesFiles: [../values/controlplane.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_controlplane}}"
          image.tag: "{{.IMAGE_TAG_nomnom_controlplane}}"
      # Customer UI (локальный ADR 2 UI): https://app.nomnom.localhost:18085, HTTPRoute ui —
      # manifests/gateway/public-gateway.yaml. Индекс 12 — в patches grafana-cloud.
      - name: ui
        chartPath: ../../../boundaries/ui/ops/helm
        namespace: nomnom-ui
        createNamespace: true
        valuesFiles: [../values/ui.yaml]
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_ui}}"
          image.tag: "{{.IMAGE_TAG_nomnom_ui}}"
      # Temporal worker delivery (FR-708): Assignment Workflow, тот же образ и chart, command
      # /usr/local/bin/delivery-worker. Схему мигрирует release delivery. Индекс 13 — в
      # patches grafana-cloud.
      - name: delivery-worker
        chartPath: ../../../boundaries/delivery/ops/helm
        namespace: nomnom-delivery
        createNamespace: true
        dependsOn: [delivery]
        valuesFiles:
          - ../../../boundaries/delivery/ops/helm/values-worker.yaml
          - ../values/delivery-worker.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_delivery}}"
          image.tag: "{{.IMAGE_TAG_nomnom_delivery}}"
      # Схемы Integration Events в Confluent Schema Registry (FR-716): hook Job до kafka-connect.
      # Последний release (индекс 14): индексы в patches профилей не меняются.
      - name: schema-registration
        chartPath: ../schema-registration
        namespace: nomnom-infra
        createNamespace: true
        wait: true
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_nomnom_schema_registration}}"
          image.tag: "{{.IMAGE_TAG_nomnom_schema_registration}}"
profiles:
  # make kind-dev / KIND_STAND=core: стенд для ручной работы без fixtures проверок kind E2E
  # (без release e2e и образа e2e-probe) — make kind-test на нём не проходит.
  - name: core
    patches:
      # Индексы: releases 8 — e2e, build artifacts 5 — e2e-probe.
      - op: remove
        path: /deploy/helm/releases/8
      - op: remove
        path: /build/artifacts/5
      # Skaffold не удаляет releases, исчезнувшие из конфигурации: fixtures, оставшиеся от
      # полного стенда, снимаются здесь.
      - op: add
        path: /deploy/helm/hooks/before/-
        value:
          host:
            command: [sh, -c, 'helm uninstall e2e --kube-context "$SKAFFOLD_KUBE_CONTEXT" -n nomnom-bff --ignore-not-found']
  # make kind-deploy GRAFANA_CLOUD=1: метрики, traces и логи сервисов → Alloy → Grafana Cloud.
  # Индексы releases 0–6, 11 и 13 — все процессы orders, restaurants, delivery, payments и
  # controlplane (BFF — Cosmo, своя telemetry); при изменении порядка releases поправить patches.
  - name: grafana-cloud
    patches:
      # Alloy и Secret grafana-cloud-otlp из ops/grafana-cloud/.env.grafana-cloud (kustomize
      # secretGenerator, ADR 34); Secret alloy-postgres создаёт chart ../bootstrap.
      - op: replace
        path: /manifests/kustomize
        value:
          paths: [../manifests/observability]
          buildArgs: [--load-restrictor, LoadRestrictionsNone]
      - op: add
        path: /deploy/helm/releases/0/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/1/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/2/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/3/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/4/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/5/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      - op: add
        path: /deploy/helm/releases/6/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      # controlplane (индекс 11).
      - op: add
        path: /deploy/helm/releases/11/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      # delivery-worker (индекс 13).
      - op: add
        path: /deploy/helm/releases/13/valuesFiles/-
        value: ../values/grafana-cloud.yaml
      # BFF (Cosmo Router): свои переменные telemetry, не OTEL_* charts сервисов.
      - op: add
        path: /deploy/helm/releases/7/valuesFiles/-
        value: ../values/bff-grafana-cloud.yaml
      # Customer UI (индекс 12): Faro collector публичного gateway.
      - op: add
        path: /deploy/helm/releases/12/valuesFiles/-
        value: ../values/ui-grafana-cloud.yaml
  # make kind-dev: restaurants и payments собираются из stage dev и получают file sync —
  # правка исходников копируется в контейнер, процесс перезапускает node --watch / watchfiles.
  # Go и Rust компилируются (а orders на distroless без tar), поэтому идут через пересборку.
  # Индексы artifacts: 1 — restaurants, 3 — payments; при изменении порядка поправить patches.
  - name: dev
    activation:
      - command: dev
    patches:
      - op: replace
        path: /build/artifacts/1/docker/target
        value: dev
      - op: add
        path: /build/artifacts/1/sync
        value:
          manual:
            - src: "cmd/**/*.ts"
              dest: .
            - src: "di/**/*.ts"
              dest: .
            - src: "infrastructure/**/*.ts"
              dest: .
            - src: "infrastructure/**/*.js"
              dest: .
            - src: "pkg/**/*.ts"
              dest: .
            - src: "slices/**/*.ts"
              dest: .
      # Индекс releases: 5 — restaurants-consumer.
      - op: add
        path: /deploy/helm/releases/5/valuesFiles/-
        value: ../values/restaurants-consumer-dev.yaml
      - op: replace
        path: /build/artifacts/3/docker/target
        value: dev
      - op: add
        path: /build/artifacts/3/sync
        value:
          manual:
            - src: "di/**/*.py"
              dest: .
            - src: "entrypoints/**/*.py"
              dest: .
            - src: "infrastructure/**/*.py"
              dest: .
            - src: "pkg/**/*.py"
              dest: .
            - src: "slices/**/*.py"
              dest: .
