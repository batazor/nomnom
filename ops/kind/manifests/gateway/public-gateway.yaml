# Public gateway: входящие вызовы внешних систем (webhooks платёжного провайдера),
# customer UI (app.nomnom.localhost, локальный ADR 2 UI), вход в браузере через Dex
# (auth.nomnom.localhost, ADR 35),
# публичный API клиентов (api.nomnom.localhost — router ячеек, ADR 41) и browser telemetry
# customer UI (telemetry.nomnom.localhost, route в manifests/observability/faro-route.yaml —
# только с profile grafana-cloud).
# Отдельный от internal gateway data plane: внешний трафик не попадает на listener
# service-to-service вызовов. Публикуется только явно перечисленные HTTP-пути.
#
# Только HTTPS: TLS терминирует Envoy сертификатом, который cert-manager выпускает по
# аннотации Gateway от локального CA (chart ops/kind/bootstrap, templates/certs.yaml) и продлевает сам.
# kind: NodePort 30085 → host 127.0.0.1:${WEBHOOKS_HOST_PORT} (cluster.yaml); имена
# webhooks, app, auth и api.nomnom.localhost резолвятся в 127.0.0.1.
#
# Маршруты listener api (HTTPRoute market-<market_id> и список Market markets) пишет control
# plane из своего реестра (server-side apply, ADR 41); здесь — только их политики.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-gateway
  namespace: nomnom-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: public-gateway
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: https-8443
                  port: 8443
                  nodePort: 30085
      envoyDeployment:
        replicas: 1
        pod:
          labels:
            nomnom.dev/component: public-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nomnom-public
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: public-gateway
    namespace: nomnom-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: nomnom-gateway
  annotations:
    cert-manager.io/cluster-issuer: nomnom-local-ca
spec:
  gatewayClassName: nomnom-public
  listeners:
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: webhooks.nomnom.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    # ADR 41: router ячеек — /m/{market_id} в Cosmo Router Cell Market, GET /markets.
    # Тот же сертификат: cert-manager собирает dnsNames всех listeners с этим Secret.
    - name: api
      protocol: HTTPS
      port: 8443
      hostname: api.nomnom.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    # Customer UI: статика nginx (chart boundaries/ui/ops/helm, release ui в nomnom-ui).
    - name: app
      protocol: HTTPS
      port: 8443
      hostname: app.nomnom.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    # Dex (ADR 35): issuer https://auth.nomnom.localhost:<host-порт>/dex, HTTPRoute dex.
    - name: auth
      protocol: HTTPS
      port: 8443
      hostname: auth.nomnom.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    - name: telemetry
      protocol: HTTPS
      port: 8443
      hostname: telemetry.nomnom.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
---
# Webhook провайдера быстрый: короткий timeout, без retries (провайдер повторяет сам).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: public-gateway-defaults
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  timeout:
    http:
      requestTimeout: 15s
---
# Маршруты Market (метка nomnom.dev/route=market, ставит control plane) — без request timeout:
# SSE-подписки (ADR 36) длятся, пока клиент открыт; политика маршрута сильнее политики Gateway.
#
# Rate limit публичного API (локальный ADR 3 BFF): у каждого маршрута Market свой счётчик,
# то есть квота на Market — tenant Cell (ADR 41). Local: token bucket в каждой реплике Envoy,
# без внешнего хранилища; при N репликах предел Market — N × requests. Подписка — один
# долгий запрос и квоту не расходует. Сверх квоты Envoy отвечает 429 с
# x-envoy-ratelimited, запрос до Router не доходит. Квота на клиента (IP, subject) требует
# global rate limit с Redis — не введён.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: public-gateway-market-routes
  namespace: nomnom-gateway
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        nomnom.dev/route: market
  timeout:
    http:
      requestTimeout: 0s
  rateLimit:
    local:
      rules:
        - limit:
            requests: 100
            unit: Second
---
# Ограничение размера тела совпадает с MAX_BODY_BYTES payments (64 KiB); публичный API
# клиентов (listener api) им не ограничен.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: public-gateway-client
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      sectionName: telemetry
  connection:
    bufferLimit: 64Ki
---
# CORS списка Market (GET /markets, Envoy отвечает сам через HTTPRouteFilter directResponse)
# задаёт control plane заголовками ответа в HTTPRoute markets: CORS-политику Envoy берёт из
# route entry, которого у direct response нет, поэтому SecurityPolicy cors здесь не действует.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-provider-webhooks
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /webhooks/provider
      backendRefs:
        - name: payments
          namespace: nomnom-payments
          port: 8085
---
# Dex (ADR 35): discovery, authorize, token и keys под /dex; CORS отвечает сам Dex
# (web.allowedOrigins). ReferenceGrant — в chart ops/kind/bootstrap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: public
      sectionName: auth
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dex
      backendRefs:
        - name: dex
          namespace: nomnom-data
          port: 5556
---
# Customer UI: весь listener app — в nginx UI (SPA: любой путь отдаёт index.html).
# ReferenceGrant — в chart UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: public
      sectionName: app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ui
          namespace: nomnom-ui
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-public-gateway
  namespace: nomnom-payments
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: payments
