# Internal gateway: Gateway API — декларативные ресурсы, Envoy Gateway — controller,
# Envoy Proxy — data plane. Proxy pods и Service internal-gateway создаются controller
# в envoy-gateway-system.
#
# Реестр маршрутов — GRPCRoute в nomnom-gateway: единственное место, где логический gRPC API
# сопоставляется с Kubernetes Service. Порядок публикации RPC описан в ops/kind/README.md.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-gateway
  namespace: nomnom-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Стабильное имя для INTERNAL_GATEWAY_ADDR; gateway доступен только внутри кластера.
        name: internal-gateway
        type: ClusterIP
      envoyDeployment:
        # Одна реплика в тестовом окружении; production-окружение задаёт несколько реплик
        # на разных узлах.
        replicas: 1
        pod:
          labels:
            nomnom.dev/component: internal-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nomnom-internal
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal-gateway
    namespace: nomnom-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: nomnom-gateway
spec:
  gatewayClassName: nomnom-internal
  listeners:
    # gRPC поверх HTTP/2 cleartext внутри кластера.
    - name: grpc
      protocol: HTTP
      port: 8080
      allowedRoutes:
        # Маршруты централизованы в nomnom-gateway; backend-неймспейсы выдают ReferenceGrant.
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
---
# Транспортные политики по умолчанию для всех маршрутов gateway.
# Встроенный request timeout Envoy Gateway (15s) обрезал бы длинные gRPC deadlines,
# поэтому задан явный верхний предел; фактический deadline определяет grpc-timeout клиента.
# Retries задают политики reads и commands на route; Gateway по умолчанию не повторяет.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: internal-gateway-defaults
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  timeout:
    http:
      requestTimeout: 300s
---
# Команды orders (PlaceOrder, RequestOrderCancellation): совпадение только по сервису —
# самое общее правило; методы с точным совпадением ниже его перекрывают.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: orders-v1
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
      backendRefs:
        - name: orders
          namespace: nomnom-orders
          port: 8081
---
# Идемпотентные чтения orders: совпадение по методу точнее совпадения по сервису,
# поэтому эти RPC не попадают в orders-v1.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: orders-v1-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: GetOrder
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: ListCustomerOrders
      backendRefs:
        - name: orders
          namespace: nomnom-orders
          port: 8081
---
# Публичные чтения restaurants: каталог Place Order и BFF.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetMenu
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListRestaurants
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListOwnedRestaurants
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды restaurants, которые вызывает Order Fulfillment (orders-worker).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReceiveOrderRequest
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CancelRestaurantOrder
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды управления рестораном и меню, которые вызывает BFF от имени управляющего
# (restaurant#manage, restaurant#manage_menu).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-management
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: OpenRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CloseRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CreateMenu
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AddMenuItem
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: UpdateMenuItem
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: SetMenuItemAvailability
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды кухни от имени сотрудника ресторана (restaurant#operate_kitchen): их вызывает BFF
# (kitchen-экран) и в kind — fixture e2e-driver (e2e/chart/templates/e2e-driver.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-kitchen
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AcceptRestaurantOrder
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RejectRestaurantOrder
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: StartPreparation
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: MarkRestaurantOrderAssembled
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: MarkRestaurantOrderReady
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReportPreparationDelay
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReportPreparationFailure
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Чтения кухни (restaurant#operate_kitchen): идемпотентны, повторяются политикой reads.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-kitchen-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetKitchenQueue
        # Новые заказы (RECEIVED): Kitchen Queue показывает только принятые (QUEUED).
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListIncomingOrders
        # Вся текущая работа кухни (RECEIVED…READY) для kitchen-экрана BFF.
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListActiveRestaurantOrders
        # Cook Pool ресторана (restaurant#view_orders): линия и загрузка кухни.
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetCookPool
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Cook Pool ресторана (restaurant#manage_cooks): найм, линия и выбытие поваров; их вызывает
# BFF (flow-board) и в kind — Job demo-seed.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-cook-pool
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: HireCook
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: PutCookOnLine
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: TakeCookOffLine
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RetireCook
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Администрирование ресторанов: регистрация оператором платформы
# (platform#register_restaurant), персонал — владельцем (restaurant#manage).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-administration
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RegisterRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AssignStaff
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RevokeStaff
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды delivery, которые вызывает Order Fulfillment (orders-worker).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: CreateDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ReplanDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: CancelDelivery
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Команды курьера (courier#act) и Report Delivery Failure (курьер или диспетчер,
# platform#dispatch_delivery). Их вызывает BFF (courier-экран) и в kind — fixture e2e-driver.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-courier
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: UpdateCourierLocation
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: SetCourierAvailability
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: AcceptDeliveryOffer
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: RejectDeliveryOffer
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ConfirmPickup
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ConfirmDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ReportDeliveryFailure
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Чтения курьера (courier#act): идемпотентны, повторяются политикой reads.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-courier-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ListAvailableDeliveryOffers
        # Статус курьера и текущая доставка для courier-экрана BFF.
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: GetCourierCurrentDelivery
        # Курьер заказа для того, кто видит заказ (order#view): имя в отслеживании покупателя.
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: GetOrderCourier
        # Courier Pool диспетчера (platform#manage_couriers): линия и загрузка курьеров.
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: GetCourierPool
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Courier Pool (platform#manage_couriers: оператор или диспетчер): регистрация и выбытие
# курьеров; их вызывает BFF (flow-board), в kind — Job demo-seed и fixture e2e-driver.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-administration
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: RegisterCourier
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: RetireCourier
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
