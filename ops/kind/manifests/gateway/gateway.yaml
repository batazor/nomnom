# Internal gateway: Gateway API — декларативные ресурсы, Envoy Gateway — controller,
# Envoy Proxy — data plane. Proxy pods и Service internal-gateway создаются controller
# в envoy-gateway-system.
#
# Реестр маршрутов — GRPCRoute в nomnom-gateway: единственное место, где логический gRPC API
# сопоставляется с Kubernetes Service. Порядок публикации RPC описан в ops/kind/README.md.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-gateway
  namespace: nomnom-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Стабильное имя для INTERNAL_GATEWAY_ADDR; gateway доступен только внутри кластера.
        name: internal-gateway
        type: ClusterIP
      envoyDeployment:
        # Одна реплика в тестовом окружении; production-окружение задаёт несколько реплик
        # на разных узлах.
        replicas: 1
        pod:
          labels:
            nomnom.dev/component: internal-gateway
  # Span gateway между client span вызывающего и server span backend'а: без него время
  # в gateway (очередь, retries, connect) не видно в trace. Envoy продолжает traceparent
  # вызывающего и передаёт backend'у свой. Приёмник по умолчанию — trace-capture проверок
  # kind; profile grafana-cloud переключает его на Alloy (manifests/observability).
  telemetry:
    tracing:
      # Решение о sampling принимает вызывающий (parent-based); 100 — для запросов без него.
      samplingRate: 100
      provider:
        type: OpenTelemetry
        serviceName: internal-gateway
        openTelemetry:
          # service.namespace проходит фильтр nomnom Alloy (только процессы nomnom).
          resourceAttributes:
            service.namespace: nomnom
            deployment.environment.name: kind
        backendRefs:
          - name: trace-capture
            namespace: nomnom-observability
            port: 4317
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nomnom-internal
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal-gateway
    namespace: nomnom-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: nomnom-gateway
spec:
  gatewayClassName: nomnom-internal
  listeners:
    # gRPC поверх HTTP/2 cleartext внутри кластера.
    - name: grpc
      protocol: HTTP
      port: 8080
      allowedRoutes:
        # Маршруты централизованы в nomnom-gateway; backend-неймспейсы выдают ReferenceGrant.
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
---
# Транспортные политики по умолчанию для всех маршрутов gateway.
# Встроенный request timeout Envoy Gateway (15s) обрезал бы длинные gRPC deadlines,
# поэтому задан явный верхний предел; фактический deadline определяет grpc-timeout клиента.
# Retries задают политики reads и commands на route; Gateway по умолчанию не повторяет.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: internal-gateway-defaults
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  timeout:
    http:
      requestTimeout: 300s
---
# Команды orders (PlaceOrder, RequestOrderCancellation): совпадение только по сервису —
# самое общее правило; методы с точным совпадением ниже его перекрывают.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: orders-v1
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
      backendRefs:
        - name: orders
          namespace: nomnom-orders
          port: 8081
---
# Идемпотентные чтения orders: совпадение по методу точнее совпадения по сервису,
# поэтому эти RPC не попадают в orders-v1.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: orders-v1-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: GetOrder
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: ListCustomerOrders
      backendRefs:
        - name: orders
          namespace: nomnom-orders
          port: 8081
---
# Публичные чтения restaurants: каталог Place Order и BFF.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetMenu
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListRestaurants
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды restaurants, которые вызывает Order Fulfillment (orders-worker).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReceiveOrderRequest
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CancelRestaurantOrder
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды управления рестораном и меню, которые вызывает BFF от имени управляющего
# (restaurant#manage, restaurant#manage_menu).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-management
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: OpenRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CloseRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: CreateMenu
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AddMenuItem
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: UpdateMenuItem
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: SetMenuItemAvailability
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды кухни от имени сотрудника ресторана (restaurant#operate_kitchen). Клиента кухни
# ещё нет: в kind их вызывает fixture e2e-driver (manifests/fixtures/net-probe.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-kitchen
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AcceptRestaurantOrder
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RejectRestaurantOrder
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: StartPreparation
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: MarkRestaurantOrderAssembled
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: MarkRestaurantOrderReady
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReportPreparationDelay
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ReportPreparationFailure
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Чтения кухни (restaurant#operate_kitchen): идемпотентны, повторяются политикой reads.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-kitchen-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: GetKitchenQueue
        # Новые заказы (RECEIVED): Kitchen Queue показывает только принятые (QUEUED).
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: ListIncomingOrders
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Администрирование ресторанов: регистрация оператором платформы
# (platform#register_restaurant), персонал — владельцем (restaurant#manage).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: restaurants-v1-administration
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RegisterRestaurant
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: AssignStaff
        - method:
            type: Exact
            service: nomnom.restaurants.v1.RestaurantsService
            method: RevokeStaff
      backendRefs:
        - name: restaurants
          namespace: nomnom-restaurants
          port: 8082
---
# Команды delivery, которые вызывает Order Fulfillment (orders-worker).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: CreateDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ReplanDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: CancelDelivery
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Команды курьера (courier#act) и Report Delivery Failure (курьер или диспетчер,
# platform#dispatch_delivery). Клиента курьера ещё нет: в kind их вызывает fixture e2e-driver.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-courier
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: UpdateCourierLocation
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: SetCourierAvailability
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: AcceptDeliveryOffer
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: RejectDeliveryOffer
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ConfirmPickup
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ConfirmDelivery
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ReportDeliveryFailure
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Чтения курьера (courier#act): идемпотентны, повторяются политикой reads.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-courier-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: ListAvailableDeliveryOffers
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Администрирование курьеров: регистрация оператором платформы (platform#register_courier).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delivery-v1-administration
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.delivery.v1.DeliveryService
            method: RegisterCourier
      backendRefs:
        - name: delivery
          namespace: nomnom-delivery
          port: 8083
---
# Команды payments, которые вызывает Order Fulfillment (orders-worker).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: payments-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CreatePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: AuthorizePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CapturePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CancelAuthorization
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: RefundPayment
      backendRefs:
        - name: payments
          namespace: nomnom-payments
          port: 8084
---
# Retries идемпотентных чтений (ADR 15). Политика route заменяет политику Gateway, поэтому
# верхний предел 300s повторяется. Не более 2 повторов на отказы до обработки и UNAVAILABLE;
# без per-try timeout — все попытки укладываются в deadline клиента; cancelled и
# deadline-exceeded не повторяются.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: reads
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: orders-v1-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-kitchen-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-courier-reads
  timeout:
    http:
      requestTimeout: 300s
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - unavailable
        - connect-failure
        - refused-stream
        - reset-before-request
---
# Retries команд (ADR 15): только отказы, при которых запрос гарантированно не дошёл до
# приложения — соединение не установлено, stream отклонён (REFUSED_STREAM) или headers не
# отправлены. UNAVAILABLE от приложения не повторяется: команда могла быть частично
# выполнена. Повторы после обработки — дело вызывающего: activities Temporal повторяются
# с тем же idempotency key.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: commands
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: orders-v1
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-commands
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-management
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-kitchen
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-administration
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-commands
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-courier
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-administration
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: payments-v1-commands
  timeout:
    http:
      requestTimeout: 300s
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset-before-request
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-internal-gateway
  namespace: nomnom-orders
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: orders
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-internal-gateway
  namespace: nomnom-restaurants
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: restaurants
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-internal-gateway
  namespace: nomnom-delivery
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: delivery
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-internal-gateway
  namespace: nomnom-payments
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: payments
