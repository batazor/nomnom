  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CreatePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: AuthorizePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CapturePayment
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: CancelAuthorization
        - method:
            type: Exact
            service: nomnom.payments.v1.PaymentsService
            method: RefundPayment
      backendRefs:
        - name: payments
          namespace: nomnom-payments
          port: 8084
---
# Control plane (ADR 41): чтения топологии для BFF — Markets и Placement Map.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: controlplane-v1-reads
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.controlplane.v1.ControlPlaneService
            method: ListMarkets
        - method:
            type: Exact
            service: nomnom.controlplane.v1.ControlPlaneService
            method: GetPlacementMap
      backendRefs:
        - name: controlplane
          namespace: nomnom-controlplane
          port: 8086
---
# Control plane (ADR 41): команды оператора (platform#manage_markets) — Cell и Market.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: controlplane-v1-commands
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.controlplane.v1.ControlPlaneService
            method: RegisterCell
        - method:
            type: Exact
            service: nomnom.controlplane.v1.ControlPlaneService
            method: CreateMarket
      backendRefs:
        - name: controlplane
          namespace: nomnom-controlplane
          port: 8086
---
# Retries идемпотентных чтений (ADR 15). Политика route заменяет политику Gateway, поэтому
# верхний предел 300s повторяется. Не более 2 повторов на отказы до обработки и UNAVAILABLE;
# без per-try timeout — все попытки укладываются в deadline клиента; cancelled и
# deadline-exceeded не повторяются.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: reads
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: orders-v1-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-kitchen-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-courier-reads
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: controlplane-v1-reads
  timeout:
    http:
      requestTimeout: 300s
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - unavailable
        - connect-failure
        - refused-stream
        - reset-before-request
---
# Retries команд (ADR 15): только отказы, при которых запрос гарантированно не дошёл до
# приложения — соединение не установлено, stream отклонён (REFUSED_STREAM) или headers не
# отправлены. UNAVAILABLE от приложения не повторяется: команда могла быть частично
# выполнена. Повторы после обработки — дело вызывающего: activities Temporal повторяются
# с тем же idempotency key.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: commands
  namespace: nomnom-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: orders-v1
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-commands
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-management
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-kitchen
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-cook-pool
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: restaurants-v1-administration
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-commands
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-courier
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delivery-v1-administration
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: payments-v1-commands
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: controlplane-v1-commands
  timeout:
    http:
      requestTimeout: 300s
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset-before-request
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
