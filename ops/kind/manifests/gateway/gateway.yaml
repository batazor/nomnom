---
# Simulator (platform#operate_simulator): его вызывает BFF от имени оператора (FR-604).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: orders-v1-simulator
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: internal
      sectionName: grpc
  rules:
    - matches:
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: GetSimulator
        - method:
            type: Exact
            service: nomnom.orders.v1.OrdersService
            method: SetSimulatorEnabled
      backendRefs:
        - name: orders
          namespace: nomnom-orders
