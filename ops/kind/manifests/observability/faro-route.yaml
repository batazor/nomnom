# Faro collector customer UI на public gateway: https://telemetry.nomnom.localhost:${WEBHOOKS_HOST_PORT}/collect
# → faro.receiver Alloy. Только POST /collect; CORS и rate limit — в faro.receiver (alloy/apps.alloy).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: faro-collector
  namespace: nomnom-gateway
spec:
  parentRefs:
    - name: public
      sectionName: telemetry
  rules:
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /collect
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /collect
      backendRefs:
        - name: alloy
          namespace: nomnom-observability
          port: 12347
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-public-gateway
  namespace: nomnom-observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: nomnom-gateway
  to:
    - group: ""
      kind: Service
      name: alloy
