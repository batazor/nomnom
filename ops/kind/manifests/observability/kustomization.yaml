# Alloy → Grafana Cloud (ADR 9) для Skaffold profile grafana-cloud: alloy.yaml, route Faro и
# internal gateway (../gateway) со spans в Alloy; без профиля Skaffold применяет ../gateway
# напрямую, и gateway spans не пишет. Secret grafana-cloud-otlp генерируется из
# ops/grafana-cloud/.env.grafana-cloud (вне каталога kustomization, поэтому Skaffold передаёт
# --load-restrictor LoadRestrictionsNone). Суффикс-хеш имени Secret перезапускает Alloy при
# изменении файла. Без файла рендер падает сразу; пустые значения отвергает init container.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alloy.yaml
  - faro-route.yaml
  - ../gateway
secretGenerator:
  - name: grafana-cloud-otlp
    namespace: nomnom-observability
    envs:
      - ../../../grafana-cloud/.env.grafana-cloud
patches:
  # В файле есть и ключи для других инструментов (stack URL, token service account Editor для
  # gcx и Grafana MCP): в кластер попадают только переменные OTLP.
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-cloud-otlp
        namespace: nomnom-observability
      data:
        GRAFANA_CLOUD_STACK_URL: null
        GRAFANA_CLOUD_SA_TOKEN: null
  # Span gateway между client span вызывающего и server span backend'а: без него время в
  # gateway (очередь, retries, connect) не видно в trace. Envoy продолжает traceparent
  # вызывающего и передаёт backend'у свой; spans — туда же, куда spans сервисов.
  - patch: |-
      - op: add
        path: /spec/telemetry
        value:
          tracing:
            # Решение о sampling принимает вызывающий (parent-based); 100 — для запросов без него.
            samplingRate: 100
            provider:
              type: OpenTelemetry
              serviceName: internal-gateway
              openTelemetry:
                # service.namespace проходит фильтр nomnom Alloy (только процессы nomnom).
                resourceAttributes:
                  service.namespace: nomnom
                  deployment.environment.name: kind
              backendRefs:
                - name: alloy
                  namespace: nomnom-observability
                  port: 4317
    target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal-gateway
