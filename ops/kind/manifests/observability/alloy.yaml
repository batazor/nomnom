# Grafana Alloy тестового окружения (ADR 9): приём OTLP метрик приложений и отправка в
# Grafana Cloud (free tier). Подключается Skaffold profile grafana-cloud через
# kustomization.yaml рядом: Secret grafana-cloud-otlp генерируется из
# ops/grafana-cloud/.env.grafana-cloud, Secrets alloy-postgres и alloy-valkey создаёт chart ops/kind/bootstrap.
# Namespace nomnom-observability — manifests/base/namespaces.yaml.
# Free tier ограничен активными series, поэтому уходят только метрики service.namespace=nomnom
# и allowlist инфраструктуры (SpiceDB, PostgreSQL, internal gateway, pods nomnom-*),
# traces процессов nomnom и internal gateway и stdout-логи прикладных неймспейсов; без
# profiles и собственных метрик Alloy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: nomnom-observability
data:
  config.alloy: |
    otelcol.receiver.otlp "apps" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.memory_limiter.default.input]
        traces  = [otelcol.processor.memory_limiter.default.input]
      }
    }

    // Browser telemetry customer UI (Faro Web SDK, boundaries/ui/src/shared/telemetry):
    // публикуется public gateway на telemetry.nomnom.localhost (faro-route.yaml). Traces
    // идут через тот же фильтр nomnom (app.namespace = nomnom), логи и события — в Loki-путь.
    // Source maps не скачиваются: Alloy не ходит к origin браузера.
    faro.receiver "browser" {
      extra_log_labels = {
        service_name      = "customer-ui",
        service_namespace = "nomnom",
      }
      server {
        listen_address           = "0.0.0.0"
        listen_port              = 12347
        // Vite dev server customer UI (boundaries/ui, npm run dev).
        cors_allowed_origins     = ["http://localhost:4173"]
        max_allowed_payload_size = "1MiB"
        rate_limiting {
          rate       = 50
          burst_size = 100
        }
      }
      sourcemaps {
        download = false
      }
      output {
        logs   = [loki.process.browser_logs.receiver]
        traces = [otelcol.processor.memory_limiter.default.input]
      }
    }

    // Строка Faro — logfmt с полями app_*, page_url (уже без id, beforeSend SDK), session_id.
    loki.process "browser_logs" {
      stage.logfmt {
        mapping = {
          environment = "app_environment",
        }
      }
      stage.labels {
        values = {
          environment = "",
        }
      }
      forward_to = [otelcol.receiver.loki.app_logs.receiver]
    }

    otelcol.processor.memory_limiter "default" {
      check_interval = "1s"
      limit          = "200MiB"
      output {
        metrics = [otelcol.processor.filter.nomnom.input]
        traces  = [otelcol.processor.transform.router_plugin.input]
      }
    }

    // Plugin BFF: Cosmo router-plugin задаёт resource сам (service.name, wg.is_plugin) и не
    // принимает другие attributes; namespace nomnom получает только он, по имени и флагу.
    otelcol.processor.transform "router_plugin" {
      error_mode = "ignore"
      trace_statements {
        context    = "resource"
        statements = [
          `set(attributes["service.namespace"], "nomnom") where attributes["service.name"] == "bff-plugin" and attributes["wg.is_plugin"] == true`,
        ]
      }
      output {
        traces = [otelcol.processor.filter.nomnom.input]
      }
    }

    // Только процессы nomnom: случайный OTLP-клиент в кластере не расходует квоту series.
    otelcol.processor.filter "nomnom" {
      error_mode = "ignore"
      metrics {
        metric = [
          "resource.attributes[\"service.namespace\"] != \"nomnom\"",
          // Cosmo Router (BFF): только инструменты overview, остальное — квота series.
          "resource.attributes[\"service.name\"] == \"bff\" and not IsMatch(name, \"^router\\\\.http\\\\.(requests|requests\\\\.error|request\\\\.duration_milliseconds)$\")",
        ]
      }
      traces {
        span = ["resource.attributes[\"service.namespace\"] != \"nomnom\""]
      }
      output {
        metrics = [otelcol.processor.transform.bff_metrics.input]
        traces  = [otelcol.processor.batch.signals.input]
      }
    }

    // Labels Router: клиент, версии router и operation name/hash размножают series, а
    // dashboards BFF группируют только по типу операции, subgraph и HTTP-статусу.
    otelcol.processor.transform "bff_metrics" {
      error_mode = "ignore"
      metric_statements {
        context    = "datapoint"
        statements = [
          "keep_keys(attributes, [\"wg.operation.type\", \"wg.subgraph.name\", \"http.status_code\"]) where resource.attributes[\"service.name\"] == \"bff\"",
        ]
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
      }
    }

    // Traces и logs: короткий batch, чтобы trace и его логи появлялись в Grafana быстро.
    otelcol.processor.batch "signals" {
      timeout = "5s"
      output {
        traces = [otelcol.exporter.otlphttp.grafana_cloud.input]
        logs   = [otelcol.exporter.otlphttp.grafana_cloud.input]
      }
    }


    // Logs (docs/observability.md#логи): JSON-строки stdout pods прикладных неймспейсов.
    // Поля записи поднимаются в OTLP: resource service.*, severity, trace_id/span_id —
    // переход log → trace в Grafana. Строка не-JSON уходит как есть, с namespace и pod.
    discovery.kubernetes "app_pods" {
      role = "pod"
      namespaces {
        names = ["nomnom-orders", "nomnom-payments", "nomnom-delivery", "nomnom-restaurants", "nomnom-bff"]
      }
    }

    discovery.relabel "app_pods" {
      targets = discovery.kubernetes.app_pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "app_pods" {
      targets    = discovery.relabel.app_pods.output
      forward_to = [loki.process.app_logs.receiver]
    }

    loki.process "app_logs" {
      stage.json {
        expressions = {
          severity          = "severity",
          service_name      = "\"service.name\"",
          service_namespace = "\"service.namespace\"",
          service_version   = "\"service.version\"",
          environment       = "\"deployment.environment.name\"",
          trace_id          = "trace_id",
          span_id           = "span_id",
        }
      }
      // Индекс Loki — только ограниченный набор; trace_id и версия — structured metadata.
      stage.labels {
        values = {
          severity          = "",
          service_name      = "",
          service_namespace = "",
          environment       = "",
        }
      }
      stage.structured_metadata {
        values = {
          trace_id        = "",
          span_id         = "",
          service_version = "",
        }
      }
      forward_to = [otelcol.receiver.loki.app_logs.receiver]
    }

    otelcol.receiver.loki "app_logs" {
      output {
        logs = [otelcol.processor.transform.app_logs.input]
      }
    }

    // Loki labels → OTLP: resource attributes сервиса и поля trace context записи.
    otelcol.processor.transform "app_logs" {
      error_mode = "ignore"
      log_statements {
        context    = "log"
        statements = [
          `set(resource.attributes["service.name"], attributes["service_name"]) where attributes["service_name"] != nil`,
          // Не-JSON строка (процесс ещё без structured logs): сервис — имя контейнера.
          `set(resource.attributes["service.name"], attributes["container"]) where attributes["service_name"] == nil`,
          `set(resource.attributes["service.namespace"], attributes["service_namespace"]) where attributes["service_namespace"] != nil`,
          `set(resource.attributes["service.namespace"], "nomnom") where attributes["service_namespace"] == nil`,
          `set(resource.attributes["service.version"], attributes["service_version"]) where attributes["service_version"] != nil`,
          `set(resource.attributes["deployment.environment.name"], attributes["environment"]) where attributes["environment"] != nil`,
          `set(resource.attributes["k8s.namespace.name"], attributes["namespace"])`,
          `set(resource.attributes["k8s.pod.name"], attributes["pod"])`,
          `set(severity_text, attributes["severity"]) where attributes["severity"] != nil`,
          `set(trace_id.string, attributes["trace_id"]) where attributes["trace_id"] != nil`,
          `set(span_id.string, attributes["span_id"]) where attributes["span_id"] != nil`,
          `delete_matching_keys(attributes, "^(service_name|service_namespace|service_version|environment|severity|trace_id|span_id|container)$")`,
        ]
      }
      output {
        logs = [otelcol.processor.batch.signals.input]
      }
    }

    otelcol.processor.batch "default" {
      timeout = "30s"
      output {
        metrics = [otelcol.exporter.otlphttp.grafana_cloud.input]
      }
    }

    // Инфраструктура: Prometheus scrape → OTLP мимо фильтра nomnom (у этих метрик нет
    // service.namespace). Каждый источник ограничен allowlist метрик: квота series free tier.
    otelcol.receiver.prometheus "infra" {
      output {
        metrics = [otelcol.processor.batch.default.input]
      }
    }

    // SpiceDB: серверная сторона Check/Write, кэш dispatch и datastore. Health-check gRPC и
    // buckets datastore отбрасываются.
    discovery.kubernetes "spicedb" {
      role = "pod"
      namespaces {
        names = ["nomnom-authz"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=spicedb"
      }
    }

    discovery.relabel "spicedb" {
      targets = discovery.kubernetes.spicedb.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9090"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "spicedb" {
      targets         = discovery.relabel.spicedb.output
      job_name        = "infra/spicedb"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.spicedb.receiver]
    }

    prometheus.relabel "spicedb" {
      rule {
        source_labels = ["__name__"]
        regex         = "grpc_server_handled_total|grpc_server_handling_seconds_(bucket|sum|count)|spicedb_v1_check_permissionship_total|spicedb_dispatch_client_check(_from_cache)?_total|spicedb_datastore_query_latency_(sum|count)|process_cpu_seconds_total|process_resident_memory_bytes|go_goroutines"
        action        = "keep"
      }
      rule {
        source_labels = ["grpc_service"]
        regex         = "grpc\\.health\\.v1\\.Health"
        action        = "drop"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // PostgreSQL: по экспортеру на владельца (ADR 8); DSN из Secret alloy-postgres
    // (chart ops/kind/bootstrap). Только своя база владельца, без pg_settings. replication_slot —
    // слот Debezium <owner>_outbox (ADR 37): отставание CDC от WAL и активность слота.
    prometheus.exporter.postgres "orders" {
      data_source_names  = [sys.env("POSTGRES_ORDERS_DSN")]
      enabled_collectors = ["database", "stat_database", "replication_slot"]
      autodiscovery {
        enabled = false
      }
    }

    prometheus.exporter.postgres "payments" {
      data_source_names  = [sys.env("POSTGRES_PAYMENTS_DSN")]
      enabled_collectors = ["database", "stat_database", "replication_slot"]
      autodiscovery {
        enabled = false
      }
    }

    prometheus.exporter.postgres "delivery" {
      data_source_names  = [sys.env("POSTGRES_DELIVERY_DSN")]
      enabled_collectors = ["database", "stat_database", "replication_slot"]
      autodiscovery {
        enabled = false
      }
    }

    discovery.relabel "postgres" {
      targets = array.concat(
        prometheus.exporter.postgres.orders.targets,
        prometheus.exporter.postgres.payments.targets,
        prometheus.exporter.postgres.delivery.targets,
      )
      rule {
        source_labels = ["__meta_component_id"]
        regex         = "prometheus\\.exporter\\.postgres\\.(.+)"
        target_label  = "owner"
      }
      rule {
        source_labels = ["owner"]
        target_label  = "instance"
        replacement   = "postgres-$1"
      }
      // Экспортер задаёт свой job (integrations/postgres), он важнее job_name scrape.
      rule {
        target_label = "job"
        replacement  = "infra/postgresql"
      }
    }

    prometheus.scrape "postgres" {
      targets         = discovery.relabel.postgres.output
      job_name        = "infra/postgresql"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.postgres.receiver]
    }

    prometheus.relabel "postgres" {
      rule {
        source_labels = ["__name__"]
        regex         = "pg_up|pg_database_size_bytes|pg_stat_database_(numbackends|xact_commit|xact_rollback|deadlocks|blks_hit|blks_read|conflicts|temp_bytes)|pg_replication_slot_slot_(current_wal_lsn|confirmed_flush_lsn|is_active)"
        action        = "keep"
      }
      // stat_database и размер есть у каждой базы сервера: только база владельца
      // (datname == owner); pg_up и слоты (без datname, сервер — владельца) проходят всегда.
      rule {
        source_labels = ["__name__", "datname", "owner"]
        regex         = "pg_up;.*;.*|pg_replication_slot_.+;.*;.*|pg_(database_size_bytes|stat_database_.+);(orders;orders|payments;payments|delivery;delivery)"
        action        = "keep"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // Valkey: по экспортеру на владельца (ADR 40); ACL-пользователь exporter без доступа к
    // ключам, пароль из Secret alloy-valkey (chart ops/kind/bootstrap).
    prometheus.exporter.redis "restaurants" {
      redis_addr     = "valkey-restaurants.nomnom-data.svc.cluster.local:6379"
      redis_user     = "exporter"
      redis_password = sys.env("VALKEY_RESTAURANTS_PASSWORD")
    }

    discovery.relabel "valkey" {
      targets = prometheus.exporter.redis.restaurants.targets
      rule {
        source_labels = ["__meta_component_id"]
        regex         = "prometheus\\.exporter\\.redis\\.(.+)"
        target_label  = "owner"
      }
      rule {
        source_labels = ["owner"]
        target_label  = "instance"
        replacement   = "valkey-$1"
      }
      // Экспортер задаёт свой job (integrations/redis), он важнее job_name scrape.
      rule {
        target_label = "job"
        replacement  = "infra/valkey"
      }
    }

    prometheus.scrape "valkey" {
      targets         = discovery.relabel.valkey.output
      job_name        = "infra/valkey"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.valkey.receiver]
    }

    // Только метрики инвентаря (ops/grafana/inventory, раздел valkey): квота series free tier.
    prometheus.relabel "valkey" {
      rule {
        source_labels = ["__name__"]
        regex         = "redis_up|redis_connected_clients|redis_memory_(used|max)_bytes|redis_commands_processed_total|redis_keyspace_(hits|misses)_total|redis_(evicted|expired)_keys_total|redis_db_keys"
        action        = "keep"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // Kafka Connect с Debezium (ADR 37): JMX exporter :9404 (ops/kind/kafka-connect/metrics.yaml
    // уже ограничивает MBeans) — состояние коннекторов и задач, поток и отставание Debezium.
    discovery.kubernetes "kafka_connect" {
      role = "pod"
      namespaces {
        names = ["nomnom-infra"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=kafka-connect"
      }
    }

    discovery.relabel "kafka_connect" {
      targets = discovery.kubernetes.kafka_connect.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9404"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "kafka_connect" {
      targets         = discovery.relabel.kafka_connect.output
      job_name        = "infra/kafka-connect"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.kafka_connect.receiver]
    }

    prometheus.relabel "kafka_connect" {
      rule {
        source_labels = ["__name__"]
        regex         = "kafka_connect_(connector_status|connector_task_status|worker_.+)|debezium_metrics_(MilliSecondsBehindSource|TotalNumberOfEventsSeen|QueueRemainingCapacity|QueueTotalCapacity|Connected|MilliSecondsSinceLastEvent)"
        action        = "keep"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // Lag consumer groups контекстов, которые читают Kafka сами (orders-consumer — Watermill,
    // restaurants); delivery и payments только публикуют Outbox через Debezium. Только
    // kafka_consumergroup_lag: остальные метрики exporter'а дашборды не используют.
    prometheus.exporter.kafka "infra" {
      kafka_uris          = ["kafka.nomnom-infra.svc.cluster.local:9092"]
      groups_filter_regex = ["^(orders|restaurants)$"]
    }

    prometheus.scrape "kafka" {
      targets         = prometheus.exporter.kafka.infra.targets
      job_name        = "infra/kafka"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.kafka.receiver]
    }

    prometheus.relabel "kafka" {
      rule {
        source_labels = ["__name__"]
        regex         = "kafka_consumergroup_lag"
        action        = "keep"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // Internal gateway (ADR 15): stats Envoy на порту 19001 (NetworkPolicy internal-gateway-ingress
    // пускает только Alloy). Только clusters GRPCRoute и метрики, на которых строятся алерты:
    // retries (скрывают отказ backend'а), pending overflow, timeouts, connect failures и
    // latency. upstream_rq_xx — HTTP-класс финального ответа после retries; gRPC-ошибки
    // приходят с HTTP 200, поэтому статус вызова смотрится по метрикам сервисов.
    discovery.kubernetes "internal_gateway" {
      role = "pod"
      namespaces {
        names = ["envoy-gateway-system"]
      }
      selectors {
        role  = "pod"
        label = "gateway.envoyproxy.io/owning-gateway-name=internal"
      }
    }

    discovery.relabel "internal_gateway" {
      targets = discovery.kubernetes.internal_gateway.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:19001"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "internal_gateway" {
      targets         = discovery.relabel.internal_gateway.output
      job_name        = "infra/internal-gateway"
      metrics_path    = "/stats/prometheus"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.internal_gateway.receiver]
    }

    prometheus.relabel "internal_gateway" {
      rule {
        source_labels = ["__name__"]
        regex         = "envoy_cluster_upstream_rq_(total|xx|retry|retry_success|retry_overflow|retry_limit_exceeded|pending_overflow|timeout)|envoy_cluster_upstream_cx_(connect_fail|active)|envoy_cluster_external_upstream_rq_time_(bucket|sum|count)"
        action        = "keep"
      }
      // Без xds_cluster, prometheus_stats и прочих служебных clusters Envoy.
      rule {
        source_labels = ["envoy_cluster_name"]
        regex         = "grpcroute/.+"
        action        = "keep"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // cert-manager controller: срок действия, плановое продление и Ready всех Certificate
    // кластера (CA, public gateway, ключ assertions BFF). Label namespace метрики —
    // неймспейс Certificate, pod controller'а в labels не нужен.
    discovery.kubernetes "cert_manager" {
      role = "pod"
      namespaces {
        names = ["cert-manager"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=cert-manager,app.kubernetes.io/component=controller"
      }
    }

    discovery.relabel "cert_manager" {
      targets = discovery.kubernetes.cert_manager.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9402"
      }
    }

    prometheus.scrape "cert_manager" {
      targets         = discovery.relabel.cert_manager.output
      job_name        = "infra/cert-manager"
      scrape_interval = "60s"
      forward_to      = [prometheus.relabel.cert_manager.receiver]
    }

    prometheus.relabel "cert_manager" {
      rule {
        source_labels = ["__name__"]
        regex         = "certmanager_certificate_(not_after|renewal)_timestamp_seconds|certmanager_certificate_ready_status"
        action        = "keep"
      }
      // Только текущее состояние: series False/Unknown со значением 0 не нужны.
      rule {
        source_labels = ["__name__", "condition"]
        regex         = "certmanager_certificate_ready_status;(False|Unknown)"
        action        = "drop"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    // Pods nomnom-*: CPU, память и сеть из cAdvisor kubelet (через API server proxy),
    // restarts и readiness из kube-state-metrics.
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      job_name          = "infra/kubernetes"
      scheme            = "https"
      scrape_interval   = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.relabel.pods.receiver]
    }

    prometheus.scrape "kube_state_metrics" {
      targets         = [{"__address__" = "kube-state-metrics.nomnom-observability.svc:8080"}]
      job_name        = "infra/kubernetes"
      scrape_interval = "60s"
      honor_labels    = true
      forward_to      = [prometheus.relabel.pods.receiver]
    }

    prometheus.relabel "pods" {
      rule {
        source_labels = ["__name__"]
        regex         = "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_(receive|transmit)_bytes_total|kube_pod_container_status_restarts_total|kube_pod_status_ready|kube_pod_container_status_waiting_reason"
        action        = "keep"
      }
      rule {
        source_labels = ["namespace"]
        regex         = "nomnom-(orders|payments|delivery|restaurants|bff)"
        action        = "keep"
      }
      // Readiness: достаточно condition="true"; false/unknown утроили бы series.
      rule {
        source_labels = ["__name__", "condition"]
        regex         = "kube_pod_status_ready;(false|unknown)"
        action        = "drop"
      }
      // cAdvisor отдаёт и pod-level cgroup (container=""), и pause (container="POD"):
      // CPU и память считаются по контейнерам, сеть — только на уровне pod.
      rule {
        source_labels = ["__name__", "container"]
        regex         = "container_(cpu_usage_seconds_total|memory_working_set_bytes);(|POD)"
        action        = "drop"
      }
      rule {
        source_labels = ["__name__", "interface"]
        regex         = "container_network_.+;(lo|cilium.*|lxc.*)"
        action        = "drop"
      }
      rule {
        regex  = "id|image|name|endpoint|uid|interface"
        action = "labeldrop"
      }
      forward_to = [otelcol.receiver.prometheus.infra.receiver]
    }

    otelcol.auth.basic "grafana_cloud" {
      username = sys.env("GRAFANA_CLOUD_OTLP_INSTANCE_ID")
      password = sys.env("GRAFANA_CLOUD_OTLP_TOKEN")
    }

    otelcol.exporter.otlphttp "grafana_cloud" {
      client {
        endpoint = sys.env("GRAFANA_CLOUD_OTLP_ENDPOINT")
        auth     = otelcol.auth.basic.grafana_cloud.handler
      }
    }
---
# Discovery pods SpiceDB, internal gateway, Cilium и nodes, cAdvisor kubelet через API server proxy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: nomnom-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nomnom-alloy
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  # loki.source.kubernetes: stdout pods через API server.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nomnom-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nomnom-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: nomnom-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: nomnom-observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Без endpoint, instance ID или token Alloy молча отбрасывал бы метрики: pod не
        # стартует, и Skaffold status check падает с этим сообщением.
        - name: require-grafana-cloud
          image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
          command:
            - sh
            - -c
            - >-
              test -n "$GRAFANA_CLOUD_OTLP_ENDPOINT" && test -n "$GRAFANA_CLOUD_OTLP_INSTANCE_ID" &&
              test -n "$GRAFANA_CLOUD_OTLP_TOKEN" || {
              echo "GRAFANA_CLOUD_OTLP_ENDPOINT, GRAFANA_CLOUD_OTLP_INSTANCE_ID and GRAFANA_CLOUD_OTLP_TOKEN
              must be set in ops/grafana-cloud/.env.grafana-cloud" >&2; exit 1; }
          envFrom:
            - secretRef:
                name: grafana-cloud-otlp
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
          envFrom:
            - secretRef:
                name: grafana-cloud-otlp
            # POSTGRES_<OWNER>_DSN экспортеров PostgreSQL (chart ops/kind/bootstrap).
            - secretRef:
                name: alloy-postgres
            # VALKEY_<OWNER>_PASSWORD экспортеров Valkey (chart ops/kind/bootstrap).
            - secretRef:
                name: alloy-valkey
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
            - name: faro
              containerPort: 12347
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          # OTLP-буферы, Faro и экспортеры PostgreSQL/Valkey в одном процессе.
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: nomnom-observability
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: kubernetes.io/h2c
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: faro
      port: 12347
      targetPort: faro
---
# kube-state-metrics: только pods прикладных неймспейсов и три метрики (restarts,
# readiness, причина ожидания); остальное не генерируется и не расходует квоту.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: nomnom-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nomnom-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nomnom-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nomnom-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: nomnom-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: nomnom-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --resources=pods
            - --namespaces=nomnom-orders,nomnom-payments,nomnom-delivery,nomnom-restaurants,nomnom-bff
            - --metric-allowlist=kube_pod_container_status_restarts_total,kube_pod_status_ready,kube_pod_container_status_waiting_reason
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: nomnom-observability
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
