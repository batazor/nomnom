# Grafana Alloy тестового окружения (ADR 9): приём OTLP приложений, stdout-логи прикладных
# неймспейсов, scrape инфраструктуры и отправка в Grafana Cloud (free tier). Подключается
# Skaffold profile grafana-cloud через kustomization.yaml рядом: ConfigMap alloy собирается
# configMapGenerator из alloy/*.alloy (Alloy загружает каталог целиком), Secret
# grafana-cloud-otlp генерируется из ops/grafana-cloud/.env.grafana-cloud, Secrets
# alloy-postgres и alloy-valkey создаёт chart ops/kind/bootstrap.
# Namespace nomnom-observability — manifests/base/namespaces.yaml.
# Discovery pods SpiceDB, internal gateway, Cilium и nodes, cAdvisor kubelet через API server proxy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: nomnom-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nomnom-alloy
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  # loki.source.kubernetes: stdout pods через API server.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nomnom-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nomnom-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: nomnom-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: nomnom-observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Без endpoint, instance ID или token Alloy молча отбрасывал бы метрики: pod не
        # стартует, и Skaffold status check падает с этим сообщением.
        - name: require-grafana-cloud
          image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
          command:
            - sh
            - -c
            - >-
              test -n "$GRAFANA_CLOUD_OTLP_ENDPOINT" && test -n "$GRAFANA_CLOUD_OTLP_INSTANCE_ID" &&
              test -n "$GRAFANA_CLOUD_OTLP_TOKEN" || {
              echo "GRAFANA_CLOUD_OTLP_ENDPOINT, GRAFANA_CLOUD_OTLP_INSTANCE_ID and GRAFANA_CLOUD_OTLP_TOKEN
              must be set in ops/grafana-cloud/.env.grafana-cloud" >&2; exit 1; }
          envFrom:
            - secretRef:
                name: grafana-cloud-otlp
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
          args:
            - run
            - /etc/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
          envFrom:
            - secretRef:
                name: grafana-cloud-otlp
            # POSTGRES_<OWNER>_DSN экспортеров PostgreSQL (chart ops/kind/bootstrap).
            - secretRef:
                name: alloy-postgres
            # VALKEY_<OWNER>_PASSWORD экспортеров Valkey (chart ops/kind/bootstrap).
            - secretRef:
                name: alloy-valkey
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
            - name: faro
              containerPort: 12347
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          # OTLP-буферы, Faro и экспортеры PostgreSQL/Valkey в одном процессе.
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: nomnom-observability
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: kubernetes.io/h2c
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: faro
      port: 12347
      targetPort: faro
