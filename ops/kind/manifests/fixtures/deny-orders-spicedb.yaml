# Временный отказ зависимости для проверок retries и deadline (ops/kind/e2e/calls): orders не
# достаёт до SpiceDB и отвечает UNAVAILABLE (DEPENDENCY_UNAVAILABLE) после таймаута клиента
# SpiceDB. Применяется и удаляется самим тестом; deny в Cilium приоритетнее любых allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-spicedb-egress
  namespace: nomnom-orders
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: orders
  egressDeny:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nomnom-authz
