# Тестовые pod проверок kind E2E (ops/kind/e2e): вызовы изнутри неймспейсов приложений под их
# NetworkPolicy (net-probe, без service identity), из nomnom-outsider вне прикладного контура
# и с service identity (grpc-caller). Образ у всех — e2e/probe.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-probe
  namespace: nomnom-orders
  labels:
    app.kubernetes.io/name: net-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: net-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: net-probe
    spec:
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      containers:
        - name: net-probe
          # Образ проверок kind E2E (e2e/probe): grpcurl, nc, nslookup, curl.
          image: nomnom/e2e-probe
          imagePullPolicy: IfNotPresent
          env:
            - name: INTERNAL_GATEWAY_ADDR
              value: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            capabilities:
              drop: ["ALL"]
