# Локальный CA тестового окружения: самоподписанный bootstrap issuer выпускает корневой
# сертификат nomnom-local-ca, а ClusterIssuer nomnom-local-ca подписывает им сертификаты
# gateway. Корень для клиентов: scripts/local-ca.sh (curl --cacert).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nomnom-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nomnom-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: nomnom local CA
  secretName: nomnom-local-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: nomnom-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nomnom-local-ca
spec:
  ca:
    secretName: nomnom-local-ca
