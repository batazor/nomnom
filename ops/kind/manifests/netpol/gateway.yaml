# Политики Envoy Proxy internal gateway. Controller Envoy Gateway и прочие pod
# envoy-gateway-system эти политики не выбирают.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-gateway-default-deny
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: internal
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Ingress, Egress]
---
# Ingress: gRPC listener только из прикладных неймспейсов; метрики Envoy — только Alloy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-gateway-ingress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: internal
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: app
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 19001
---
# Egress: только бизнес-API backend'ов, DNS, xDS controller Envoy Gateway и приёмник spans.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-gateway-egress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: internal
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: app
          podSelector:
            matchLabels:
              nomnom.dev/business-api: "true"
      ports:
        - protocol: TCP
          port: grpc
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Spans gateway (OTLP gRPC): Alloy в profile grafana-cloud, иначе trace-capture.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [alloy, trace-capture]
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
              app.kubernetes.io/name: gateway-helm
      ports:
        - protocol: TCP
          port: 18000
