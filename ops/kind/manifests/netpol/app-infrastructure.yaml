# BFF: JWKS identity providers (ADR 35) — Dex и тестовый test-idp; Kafka — Cosmo Streams
# подписок orderChanged (ADR 36); Valkey delivery — подписка courierMoved (FR-668).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: nomnom-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bff
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dex
      ports:
        - protocol: TCP
          port: 5556
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: test-idp
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: delivery
      ports:
        - protocol: TCP
          port: 6379
---
# Customer UI: статика — только от Envoy Proxy public gateway (listener app).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-from-public-gateway
  namespace: nomnom-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
      app.kubernetes.io/instance: ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
              gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
      ports:
        - protocol: TCP
          port: http
---
# BFF (ADR 41): публичный API клиентов — только от Envoy Proxy public gateway по маршрутам
# Market, которые пишет control plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-api-from-public-gateway
  namespace: nomnom-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bff
      app.kubernetes.io/instance: bff
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
              gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
      ports:
        - protocol: TCP
          port: http
---
# controlplane (ADR 41): Kubernetes API — единственная внешняя зависимость: реестр Cell и Market и
# маршруты публичного gateway (Role в nomnom-gateway, chart controlplane). Kafka, Debezium, Temporal,
# PostgreSQL и SpiceDB ему не нужны. Сущность kube-apiserver есть только в политике Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: nomnom-controlplane
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: controlplane
  egress:
    - toEntities:
        - kube-apiserver
---
# payments: Stripe API для PROVIDER__KIND=stripe (ops/kind/values/payments-stripe.yaml). Fake
# наружу не ходит, поэтому в e2e правило не используется. toFQDNs работает по ответам DNS,
# которые видит прокси Cilium: DNS-правило пропускает все имена, разрешённые allow-dns-egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stripe-egress
  namespace: nomnom-payments
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: payments
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.stripe.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
