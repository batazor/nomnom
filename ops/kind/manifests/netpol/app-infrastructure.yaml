# Инфраструктурные подключения через штатные endpoints, по владельцам.
# PostgreSQL в kind — один сервер (chart ops/kind/bootstrap): сеть пускает к нему только
# контексты с базой, а в чужую базу не пускает сам сервер (роль владельца, CONNECT, pg_hba).
# Доступ к БД есть только у её владельца; фикстура инфраструктуру не использует, BFF читает
# JWKS identity providers и Kafka (Cosmo Streams, ADR 36).
---
# orders: своя PostgreSQL, Kafka (Watermill), Temporal Server (SDK и workers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: nomnom-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # ADR 37: hook Job release регистрирует коннектор Outbox в Kafka Connect.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-connect
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    # SpiceDB (ADR 18): authorization checks и relationship writes.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
---
# restaurants: своя MongoDB, свой Valkey (кеш чтения каталога, ADR 40), Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: nomnom-restaurants
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
              app.kubernetes.io/instance: restaurants
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: restaurants
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # ADR 37: hook Job release регистрирует коннектор Outbox в Kafka Connect.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-connect
      ports:
        - protocol: TCP
          port: 8083
    # SpiceDB (ADR 18): authorization checks и relationship writes.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
---
