# Инфраструктурные подключения через штатные endpoints, по владельцам.
# PostgreSQL в kind — один сервер за PgBouncer (chart ops/kind/bootstrap): сеть пускает к пулеру
# только контексты с базой, напрямую к серверу — никого из них, а в чужую базу не пускает сам
# сервер (роль владельца, CONNECT, pg_hba).
# Доступ к БД есть только у её владельца; фикстура инфраструктуру не использует, BFF читает
# JWKS identity providers и Kafka (Cosmo Streams, ADR 36).
---
# orders: своя PostgreSQL, Kafka (Watermill), Temporal Server (SDK и workers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: nomnom-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Schema Registry (FR-719): consumer проверяет subject схемы записи.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: schema-registry
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    # SpiceDB (ADR 18): authorization checks и relationship writes.
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
---
