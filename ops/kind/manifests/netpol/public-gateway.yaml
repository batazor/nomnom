# Политики Envoy Proxy public gateway: ingress из любого источника на HTTPS listener,
# egress только к портам webhooks прикладных pod, DNS и xDS controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-gateway-default-deny
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: public
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-gateway-ingress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: public
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 19001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-gateway-egress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: public
      gateway.envoyproxy.io/owning-gateway-namespace: nomnom-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              nomnom.dev/tier: app
          podSelector:
            matchLabels:
              nomnom.dev/business-api: "true"
      ports:
        - protocol: TCP
          port: webhooks
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
              app.kubernetes.io/name: gateway-helm
      ports:
        - protocol: TCP
          port: 18000
