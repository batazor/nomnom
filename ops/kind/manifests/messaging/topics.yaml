# Все topics тестового окружения — KafkaTopic Topic Operator ресурса Kafka kafka (FR-721, FR-723).
# Broker auto create выключен (kafka.yaml): topic без ресурса не появится, publish в него —
# ошибка. Удаление ресурса удаляет topic с данными, а partitions можно только увеличить —
# переименование или перенос ресурса из этого файла есть удаление topic.
#
#   стримы Integration Events и Change Notifications — 3 partitions, порядок по ключу aggregate_id;
#   DLQ consumers (ADR 28, docs/dlq.md) — 1 partition, retention 30 дней: окно разбора DLQ;
#   служебные topics Kafka Connect (ADR 37) и Schema Registry — compact, у configs одна partition.
---
# orders: Integration Events Order (ADR 25)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders.v1.order-events
  namespace: nomnom-infra
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
---
