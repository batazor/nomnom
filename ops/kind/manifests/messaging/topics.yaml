# Confluent Schema Registry (kafkastore.topic): имя ресурса без подчёркивания — DNS-имя Kubernetes
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schemas
  namespace: nomnom-infra
  labels:
    strimzi.io/cluster: kafka
spec:
