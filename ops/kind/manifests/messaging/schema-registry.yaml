# Confluent Schema Registry Integration Events (FR-716, ADR 25): схемы хранит в topic _schemas
# брокера Strimzi (KafkaTopic schemas, topics.yaml). Регистрирует их только hook Job release
# schema-registration; SMT SchemaFraming и consumers читают Registry по
# http://schema-registry.nomnom-infra.svc.cluster.local:8081, egress consumers разрешает
# manifests/netpol/app-infrastructure.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: nomnom-infra
  labels:
    app.kubernetes.io/name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-registry
          image: docker.io/confluentinc/cp-schema-registry:8.4.0@sha256:12cd2770fa25df65243dabafd5eef5337ea1145a3cb85afc8a27f7151dfa2999
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kafka-kafka-bootstrap.nomnom-infra.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: _schemas
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: -Xms128m -Xmx256m
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: nomnom-infra
  labels:
    app.kubernetes.io/name: schema-registry
spec:
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http
