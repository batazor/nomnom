# Namespace nomnom-infra и Temporal dev server для orders-consumer, orders-worker и
# delivery-worker (ADR orders 2). Apache Kafka под Strimzi — kafka.yaml, topics — topics.yaml,
# Schema Registry — schema-registry.yaml, Kafka Connect с Debezium (ADR 37) — release
# kafka-connect (../../kafka-connect/chart). Данные хранятся в emptyDir и теряются при рестарте
# pod. Egress к ним из прикладных неймспейсов разрешает manifests/netpol/app-infrastructure.yaml
# (tier infra, порты 9092, 8081, 7233).
apiVersion: v1
kind: Namespace
metadata:
  name: nomnom-infra
  labels:
    nomnom.dev/tier: infra
---
# Temporal dev server (тот же образ, что TemporalImage в boundaries/orders/pkg/testfixture).
# matching.enableFairness включает Task Queue Fairness: orders-worker делит воркер между
# ресторанами по fairness key = restaurant_id (ADR 5 orders); Priority включён по умолчанию.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: nomnom-infra
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: docker.io/temporalio/temporal:1.9.1
          args: [server, start-dev, --ip, 0.0.0.0, --namespace, default, --dynamic-config-value, matching.enableFairness=true]
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: nomnom-infra
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
