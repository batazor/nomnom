# PostgreSQL delivery тестового окружения (ADR 8): emptyDir, данные не переживают
# пересоздание Pod. Пароль и DSN создаёт scripts/postgres.sh (Secret postgres-delivery
# здесь и Secret delivery-postgres в nomnom-delivery).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-delivery
  namespace: nomnom-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: delivery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_DB
              value: delivery
            - name: POSTGRES_USER
              value: delivery
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-delivery
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "delivery", "-d", "delivery"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-delivery
  namespace: nomnom-data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: delivery
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
