# MongoDB restaurants тестового окружения (ADR 8, ADR 31): single-node replica set rs0,
# нужен для multi-document транзакций. emptyDir, данные не переживают пересоздание Pod.
# Root-пароль, пароль restaurants и keyFile создаёт scripts/mongodb.sh (Secret
# mongodb-restaurants здесь и Secret restaurants-mongodb в nomnom-restaurants); там же
# выполняется rs.initiate и создаётся пользователь restaurants.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-restaurants
  namespace: nomnom-data
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: restaurants
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: restaurants
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: restaurants
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # mongod отвергает keyFile, доступный группе: копия с режимом 0400 владельца 999.
        - name: keyfile
          image: mongo:8.3.13
          command: ["sh", "-c", "cp /secret/keyfile /keyfile/keyfile && chmod 0400 /keyfile/keyfile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: mongo:8.3.13
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/keyfile"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-restaurants
                  key: root-password
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secret
          secret:
            secretName: mongodb-restaurants
            items:
              - key: keyfile
                path: keyfile
        - name: keyfile
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-restaurants
  namespace: nomnom-data
spec:
  type: ClusterIP
  # rs.initiate регистрирует member по DNS Service: адрес должен резолвиться до readiness.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: restaurants
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
