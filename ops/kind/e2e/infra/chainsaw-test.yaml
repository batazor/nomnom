# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Инфраструктурные подключения и здоровье workloads под NetworkPolicy (ADR 16, ADR 17).
# Подключения, без которых процесс не стартует (PostgreSQL, Kafka и Temporal orders, MongoDB
# restaurants), доказывает сам деплой: Skaffold status check ждёт readiness.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-connectivity
spec:
  description: >
    Под политиками delivery и payments достают Kafka, а чужие БД и Temporal закрыты: БД
    доступна только владельцу, Temporal — только orders.
  scenarios:
    - bindings:
        - {name: from_namespace, value: nomnom-delivery}
        - {name: host, value: kafka-kafka-bootstrap.nomnom-infra.svc.cluster.local}
        - {name: port, value: 9092}
        - {name: expect, value: open}
    - bindings:
        - {name: from_namespace, value: nomnom-payments}
        - {name: host, value: kafka-kafka-bootstrap.nomnom-infra.svc.cluster.local}
        - {name: port, value: 9092}
        - {name: expect, value: open}
    - bindings:
        - {name: from_namespace, value: nomnom-restaurants}
        - {name: host, value: postgres.nomnom-data.svc.cluster.local}
        - {name: port, value: 5432}
        - {name: expect, value: closed}
    - bindings:
        - {name: from_namespace, value: nomnom-payments}
        - {name: host, value: temporal.nomnom-infra.svc.cluster.local}
        - {name: port, value: 7233}
        - {name: expect, value: closed}
  steps:
    - name: policies applied
      use:
        template: ../templates/netpol-applied.yaml
    - name: connect
      use:
        template: ../templates/tcp-connect.yaml
        with:
          bindings:
            - {name: from, value: net-probe}
  catch:
    - script:
        content: kubectl get networkpolicy -A
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workloads-healthy-under-policies
spec:
  description: >
    После применения политик deployments Available, контейнеры не перезапускались и kubelet-пробы
    работающих pods (приложения, Envoy Proxy, CoreDNS, Cilium) не проваливались. Момент
    применения — creationTimestamp политики internal gateway.
  steps:
    - name: policies applied
      use:
        template: ../templates/netpol-applied.yaml
    - name: probes settle
      try:
        # Пробы kubelet идут с периодом до 10 s: время им провалиться, если политики их режут.
        - sleep:
            duration: 20s
    - name: 6a.1-6a.3 health since policies were applied
      bindings:
        - name: applied_at
          value: (x_k8s_get($client, 'networking.k8s.io/v1', 'NetworkPolicy', 'envoy-gateway-system', 'internal-gateway-default-deny').metadata.creationTimestamp)
        - name: namespaces
          value: [nomnom-orders, nomnom-restaurants, nomnom-delivery, nomnom-payments, nomnom-controlplane, nomnom-bff, envoy-gateway-system, kube-system]
        # Пробы проверяются у pods, которые работают сейчас. Pod, заменённый выкаткой после
        # политик, при остановке сам отвечает readiness 503 на время drain (ADR 17, pkg
        # lifecycle контекстов) — это штатное завершение, а не отказ пробы под политиками.
        - name: live
          value: (x_k8s_list($client, 'v1', 'Pod', '').items[?contains($namespaces, metadata.namespace)].metadata.name)
      try:
        # Списки ниже — имена нарушителей: пустой список и есть проверка.
        - assert:
            resource:
              (x_k8s_list($client, 'apps/v1', 'Deployment', '').items[?contains($namespaces, metadata.namespace) && !(status.conditions[?type == 'Available' && status == 'True'])].metadata.name): []
        - assert:
            resource:
              (x_k8s_list($client, 'v1', 'Pod', '').items[?status.containerStatuses[?lastState.terminated && time_after(lastState.terminated.finishedAt, $applied_at)]].metadata.name): []
        - assert:
            resource:
              (x_k8s_list($client, 'v1', 'Event', '').items[?reason == 'Unhealthy' && involvedObject.kind == 'Pod' && contains($live, involvedObject.name) && time_after(lastTimestamp || eventTime, $applied_at)].involvedObject.name): []
      catch:
        - events:
            namespace: '*'
