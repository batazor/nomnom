# Values chart kind-e2e. image задаёт Skaffold (setValueTemplates) тегом локальной сборки
# e2e/probe; профиль core (skaffold.yaml) выключает chart целиком.

image:
  repository: nomnom/e2e-probe
  tag: latest
  # Образ загружен через kind load.
  pullPolicy: IfNotPresent

# net-probe в неймспейсах приложений и nomnom-outsider, grpc-caller и e2e-driver в nomnom-bff.
enabled: true
