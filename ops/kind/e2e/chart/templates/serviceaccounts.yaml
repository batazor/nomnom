# ServiceAccounts fixtures рендерятся и при enabled=false: chart не бывает пустым (post-renderer
# Skaffold падает на пустом выводе), а pod они не создают.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpc-caller
  namespace: nomnom-bff
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-driver
  namespace: nomnom-bff
automountServiceAccountToken: false
