# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Control plane (ADR 41): реестр — ресурсы Cell и Market, их проверяет API server и контроллер, а
# маршруты публичного gateway контроллер пишет сам из реестра.
#
# cell-1 и berlin объявляет chart ops/kind/demo. Ресурсы теста создаёт script, а не операции
# chainsaw apply и create: те удаляют созданное в cleanup, а удаление реестра запрещено. Поэтому у
# каждого прогона свои имена, и Market прогона уходит в архив.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: controlplane-registry
spec:
  description: >
    Контроллер публикует HTTPRoute market-berlin (/m/berlin → Service bff cell-1) и список Market;
    API server отклоняет неверные значения, изменение и удаление реестра; Market без Cell и с
    неизвестным поясом не публикуется; архивный Market уходит с gateway; менять реестр могут только
    субъекты с nomnom-topology-editor; у control plane нет PostgreSQL, SpiceDB и identity.
  steps:
    - name: policies applied
      use:
        template: ../templates/netpol-applied.yaml
    - name: controlplane Available
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: controlplane
                namespace: nomnom-controlplane
              status:
                (conditions[?type == 'Available'].status): ['True']
    - name: routes of the registry
      try:
        - assert:
            timeout: 4m
            resource:
              apiVersion: controlplane.nomnom.dev/v1alpha1
              kind: Market
              metadata:
                name: berlin
              status:
                (conditions[?type == 'Ready'].status): ['True']
        - assert:
            resource:
              apiVersion: controlplane.nomnom.dev/v1alpha1
              kind: Cell
              metadata:
                name: cell-1
              status:
                (conditions[?type == 'Ready'].status): ['True']
        - assert:
            timeout: 1m
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: market-berlin
                namespace: nomnom-gateway
                labels:
                  nomnom.dev/route: market
                  nomnom.dev/cell: cell-1
              spec:
                parentRefs:
                  - name: public
                    sectionName: api
                rules:
                  - matches:
                      - path: {type: PathPrefix, value: /m/berlin}
                    backendRefs:
                      - name: bff
                        namespace: nomnom-bff
                        port: 3010
        - script:
            content: |
              kubectl -n nomnom-gateway get configmap markets -o jsonpath='{.data.response\.body}'
            check:
              ($error): ~
              (length(json_parse($stdout).markets[?id == 'berlin' && name == 'Berlin' && currency == 'EUR'])): 1
    # AC-1002, AC-1003, AC-1005, AC-1006, AC-1009: dry run проходит схему, CEL и admission, не меняя реестр.
    - name: the API server refuses wrong values, changes and deletion
      try:
        - script:
            content: |
              set -u
              refused() {
                if "$@" >/dev/null 2>&1; then echo "accepted: $*"; exit 1; fi
              }
              cell() {
                printf 'apiVersion: controlplane.nomnom.dev/v1alpha1\nkind: Cell\nmetadata: {name: %s}\nspec: {router: {namespace: nomnom-bff, name: %s, port: %s}}\n' "$1" "$2" "$3"
              }
              market() {
                printf 'apiVersion: controlplane.nomnom.dev/v1alpha1\nkind: Market\nmetadata: {name: %s}\nspec: {displayName: Berlin, currency: %s, timeZone: "%s", cellRef: %s}\n' "$1" "$2" "$3" "$4"
              }
              apply() { kubectl apply --server-side --field-manager e2e --force-conflicts --dry-run=server -f -; }
              check() { "$@" | apply >/dev/null 2>&1 && { echo "accepted: $*"; exit 1; }; return 0; }
              check cell cell-e2e Bff_1 3010
              check cell cell-e2e bff 0
              check cell cell-1 bff 3011
              check market Berlin_1 EUR Europe/Berlin cell-1
              check market e2e-market eur Europe/Berlin cell-1
              check market e2e-market EUR "" cell-1
              check market berlin EUR Europe/Berlin cell-2
              refused kubectl delete market berlin --dry-run=server
              refused kubectl delete cell cell-1 --dry-run=server
              echo refused
            check:
              ($error): ~
              (trim_space($stdout)): refused
    # AC-1007, AC-1008, AC-1010, AC-1011: проверка контроллером и архив.
    - name: a Market waits for its Cell and leaves the gateway in the archive
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              run="e2e-$(date +%s)"
              declare_market() {
                kubectl apply --server-side --field-manager e2e -f - <<EOF
              apiVersion: controlplane.nomnom.dev/v1alpha1
              kind: Market
              metadata: {name: $1}
              spec: {displayName: "Kind e2e $1", currency: EUR, timeZone: "$2", cellRef: $3, archived: $4}
              EOF
              }
              reason() { kubectl get market "$1" -o jsonpath='{.status.conditions[?(@.type=="Ready")].reason}'; }
              wait_reason() {
                for _ in $(seq 1 60); do
                  [ "$(reason "$1")" = "$2" ] && return 0
                  sleep 2
                done
                echo "market $1 has reason $(reason "$1"), expected $2" >&2
                exit 1
              }
              archive() { kubectl patch market "$1" --type merge -p '{"spec":{"archived":true}}' >/dev/null; }
              trap 'archive "$run" || true; archive "$run-tz" || true' EXIT

              # Market объявлен раньше Cell.
              declare_market "$run" Europe/Berlin "$run" false >/dev/null
              wait_reason "$run" CellNotFound
              kubectl -n nomnom-gateway get httproute "market-$run" >/dev/null 2>&1 && { echo "route without a Cell" >&2; exit 1; }
              kubectl apply --server-side --field-manager e2e -f - >/dev/null <<EOF
              apiVersion: controlplane.nomnom.dev/v1alpha1
              kind: Cell
              metadata: {name: $run}
              spec: {router: {namespace: nomnom-bff, name: bff, port: 3010}}
              EOF
              wait_reason "$run" RoutesApplied
              kubectl -n nomnom-gateway get httproute "market-$run" >/dev/null

              # Неизвестный пояс не мешает остальным.
              declare_market "$run-tz" Mars/Olympus cell-1 false >/dev/null
              wait_reason "$run-tz" InvalidTimeZone
              kubectl -n nomnom-gateway get httproute "market-$run-tz" >/dev/null 2>&1 && { echo "route with a wrong time zone" >&2; exit 1; }
              kubectl -n nomnom-gateway get httproute market-berlin >/dev/null

              # Архив.
              archive "$run"
              wait_reason "$run" Archived
              kubectl -n nomnom-gateway get httproute "market-$run" >/dev/null 2>&1 && { echo "route of an archived Market" >&2; exit 1; }
              kubectl -n nomnom-gateway get configmap markets -o jsonpath='{.data.response\.body}' | grep -q "\"$run\"" && { echo "archived Market in the list" >&2; exit 1; }
              if kubectl patch market "$run" --type merge -p '{"spec":{"archived":false}}' >/dev/null 2>&1; then
                echo "a Market left the archive" >&2
                exit 1
              fi
              echo done
            check:
              ($error): ~
              (trim_space($stdout)): done
    # AC-814, AC-1012, AC-1013.
    - name: only the editor role changes the registry
      try:
        - script:
            content: |
              can() { kubectl auth can-i "$@" 2>/dev/null || true; }
              bff=system:serviceaccount:nomnom-bff:bff
              controlplane=system:serviceaccount:nomnom-controlplane:controlplane
              echo "$(can create markets --as "$bff") $(can get markets --as "$bff") $(can patch markets --as "$controlplane") $(can patch markets --subresource=status --as "$controlplane")"
            check:
              ($error): ~
              (trim_space($stdout)): no no no yes
    # AC-1014.
    - name: the control plane has no API, database and SpiceDB
      try:
        - script:
            content: |
              kubectl -n nomnom-controlplane get deployment controlplane -o json | jq -r '
                [.spec.template.spec.containers[0].env[].name | select(test("^(POSTGRES|SPICEDB|IDENTITY)__"))] | length'
              kubectl -n nomnom-controlplane get service -o json | jq -r '.items | length'
            check:
              ($error): ~
              (trim_space($stdout)): |-
                0
                0
  catch:
    - podLogs:
        namespace: nomnom-controlplane
        selector: app.kubernetes.io/name=controlplane
        tail: 30
    - script:
        content: kubectl get cells,markets -o wide
