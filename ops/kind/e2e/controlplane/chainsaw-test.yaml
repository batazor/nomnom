# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Control plane (ADR 41): реестр Cell и Market — только оператору (platform#manage_markets), а
# маршруты публичного gateway control plane пишет сам из реестра.
#
# cell-1 и berlin регистрирует Job chart ops/kind/demo (ops/kind/demo/files/seed.json), поэтому
# проверка маршрутов ждёт, пока Job их не создаст. Projected token BFF (ServiceAccount
# nomnom-bff/bff, audience nomnom.controlplane) тест выпускает на хосте TokenRequest'ом
# (kubectl create token) и предъявляет из pod grpc-caller в nomnom-bff — под NetworkPolicy
# неймспейса BFF.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: controlplane-registry
spec:
  description: >
    Control plane публикует HTTPRoute market-berlin (/m/berlin → Service bff cell-1) и список
    Market; BFF без оператора не читает и не пишет реестр (PERMISSION_DENIED); workload вне
    allowlist control plane получает UNAUTHENTICATED.
  bindings:
    - name: gateway
      value: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
  steps:
    - name: policies applied
      use:
        template: ../templates/netpol-applied.yaml
    - name: controlplane Available
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: controlplane
                namespace: nomnom-controlplane
              status:
                (conditions[?type == 'Available'].status): ['True']
    - name: routes of the registry
      try:
        - assert:
            timeout: 4m
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: market-berlin
                namespace: nomnom-gateway
                labels:
                  nomnom.dev/route: market
                  nomnom.dev/cell: cell-1
              spec:
                parentRefs:
                  - name: public
                    sectionName: api
                rules:
                  - matches:
                      - path: {type: PathPrefix, value: /m/berlin}
                    backendRefs:
                      - name: bff
                        namespace: nomnom-bff
                        port: 3010
        - script:
            content: |
              kubectl -n nomnom-gateway get configmap markets -o jsonpath='{.data.response\.body}'
            check:
              ($error): ~
              (length(json_parse($stdout).markets[?id == 'berlin' && name == 'Berlin' && currency == 'EUR'])): 1
    - name: BFF without operator neither reads nor writes the registry
      try:
        - script:
            env:
              - name: GATEWAY
                value: ($gateway)
            content: |
              set -eu
              token="$(kubectl -n nomnom-bff create token bff --audience nomnom.controlplane --duration 10m)"
              kubectl -n nomnom-bff exec deploy/grpc-caller -- sh -c '
                grpcurl -plaintext -max-time 10 -format-error -protoset /protos/nomnom.binpb -protoset /protos/googleapis.binpb \
                  -H "authorization: Bearer $0" -d "{}" \
                  "$1" nomnom.controlplane.v1.ControlPlaneService/ListMarkets 2>&1 || true
              ' "$token" "$GATEWAY"
            check:
              ($error): ~
              (json_parse($stdout).code): 7
              (contains(json_parse($stdout).details[].reason, 'OPERATION_NOT_ALLOWED')): true
        - script:
            env:
              - name: GATEWAY
                value: ($gateway)
            content: |
              set -eu
              token="$(kubectl -n nomnom-bff create token bff --audience nomnom.controlplane --duration 10m)"
              kubectl -n nomnom-bff exec deploy/grpc-caller -- sh -c '
                grpcurl -plaintext -max-time 10 -format-error -protoset /protos/nomnom.binpb -protoset /protos/googleapis.binpb \
                  -H "authorization: Bearer $0" \
                  -d "{\"cellId\":\"cell-e2e\",\"router\":{\"namespace\":\"nomnom-bff\",\"name\":\"bff\",\"port\":3010}}" \
                  "$1" nomnom.controlplane.v1.ControlPlaneService/RegisterCell 2>&1 || true
              ' "$token" "$GATEWAY"
            check:
              ($error): ~
              (json_parse($stdout).code): 7
              (contains(json_parse($stdout).details[].reason, 'OPERATION_NOT_ALLOWED')): true
    # grpc-caller не входит в allowlist control plane (и его token выпущен для nomnom.orders).
    - name: workload outside the allowlist is unauthenticated
      use:
        template: ../templates/grpc-call.yaml
        with:
          bindings:
            - {name: method, value: nomnom.controlplane.v1.ControlPlaneService/ListMarkets}
            - {name: authorize, value: true}
            - {name: code, value: 16}
            - {name: message, value: caller identity is not authenticated}
            - {name: reason, value: AUTHENTICATION_REQUIRED}
  catch:
    - podLogs:
        namespace: nomnom-controlplane
        selector: app.kubernetes.io/name=controlplane
        tail: 30
    - podLogs:
        namespace: nomnom-bff
        selector: app.kubernetes.io/name=demo-seed
        tail: 30
