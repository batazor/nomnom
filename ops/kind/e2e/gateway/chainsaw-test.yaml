# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Реестр маршрутов internal gateway (ADR 15, ops/kind/README.md): опубликованные сервисы
# доходят до своего backend'а. Accepted и ResolvedRefs всех GRPCRoute ждёт hook Skaffold,
# маршрут OrdersService и UNIMPLEMENTED для незарегистрированного сервиса — шаги 2.3 и 2.4
# netpol-blocks-direct-calls, остальные методы вызывает order-lifecycle.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gateway-routes-to-backends
spec:
  description: >
    Сервисы restaurants, delivery и payments доходят до backend'а через gateway: ответ
    формирует backend, а не Envoy. Token grpc-caller выпущен для audience nomnom.orders,
    поэтому backend'ы отвечают UNAUTHENTICATED своим текстом.
  scenarios:
    - bindings:
        - {name: method, value: nomnom.restaurants.v1.RestaurantsService/ReceiveOrderRequest}
        - {name: request, value: '{}'}
        - {name: message, value: verified caller identity is required}
    - bindings:
        - {name: method, value: nomnom.delivery.v1.DeliveryService/CreateDelivery}
        # ADR 41: market_id обязателен; ответ всё равно решает аутентификация.
        - {name: request, value: '{"marketId":"berlin"}'}
        - {name: message, value: verified caller identity is required}
    - bindings:
        - {name: method, value: nomnom.payments.v1.PaymentsService/CreatePayment}
        - {name: request, value: '{"marketId":"berlin"}'}
        - {name: message, value: invalid caller identity}
  steps:
    - use:
        template: ../templates/grpc-call.yaml
        with:
          bindings:
            - {name: authorize, value: true}
            - {name: request, value: ($request)}
            - {name: code, value: 16}
