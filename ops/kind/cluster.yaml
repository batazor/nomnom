# Тестовый кластер из одного узла: kind снимает taint control-plane, workloads запускаются на нём.
# Создаётся make kind-cluster: имя и node image (versions.env) — флагами kind, host-порт
# __WEBHOOKS_HOST_PORT__ подставляет Make.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # CNI устанавливается отдельно (Cilium), чтобы NetworkPolicy реально применялись.
  disableDefaultCNI: true
  ipFamily: ipv4
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    extraPortMappings:
      # Public gateway (webhooks внешних систем и публичный API клиентов, ADR 41):
      # NodePort 30085 → 127.0.0.1:${WEBHOOKS_HOST_PORT}.
      - containerPort: 30085
        hostPort: __WEBHOOKS_HOST_PORT__
        listenAddress: 127.0.0.1
        protocol: TCP
