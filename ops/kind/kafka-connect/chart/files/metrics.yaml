# Правила Prometheus JMX exporter для Kafka Connect и Debezium (ADR 37). Только то, что
# читают dashboards и alerts ops/grafana: состояние коннекторов и задач, поток и отставание
# Debezium, очередь коннектора. Остальные MBeans не экспортируются (cardinality, объём).
lowercaseOutputName: false
lowercaseOutputLabelNames: false
whitelistObjectNames:
  - "kafka.connect:type=connector-metrics,*"
  - "kafka.connect:type=connector-task-metrics,*"
  - "kafka.connect:type=connect-worker-metrics"
  - "debezium.*:type=connector-metrics,context=streaming,*"
rules:
  # Строковое состояние → gauge 1 с label status (running, paused, failed, unassigned).
  - pattern: "kafka.connect<type=connector-metrics, connector=([^>]+)><>status: ([a-z-]+)"
    name: kafka_connect_connector_status
    value: 1
    type: GAUGE
    labels:
      connector: "$1"
      status: "$2"
  - pattern: "kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>status: ([a-z-]+)"
    name: kafka_connect_connector_task_status
    value: 1
    type: GAUGE
    labels:
      connector: "$1"
      task: "$2"
      status: "$3"
  - pattern: "kafka.connect<type=connect-worker-metrics><>(connector-count|task-count|connector-startup-failure-total|task-startup-failure-total): "
    name: kafka_connect_worker_$1
    type: GAUGE
  # Streaming metrics Debezium: server — topic.prefix коннектора (<context>-outbox). Имя
  # атрибута заканчивается на ": ", иначе правило захватит и производные (…P95, …MaxValue).
  - pattern: "debezium.([^:]+)<type=connector-metrics, context=streaming, server=([^,>]+)(, .*)?><>(MilliSecondsBehindSource|TotalNumberOfEventsSeen|NumberOfEventsFiltered|QueueRemainingCapacity|QueueTotalCapacity|Connected|MilliSecondsSinceLastEvent): "
    name: debezium_metrics_$4
    type: GAUGE
    labels:
      plugin: "$1"
      name: "$2"
