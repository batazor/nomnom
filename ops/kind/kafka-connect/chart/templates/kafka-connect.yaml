{{- /*
Kafka Connect с Debezium (ADR 37, FR-722): доставляет Outbox контекстов в брокер из журналов
баз (PostgreSQL WAL через pgoutput, MongoDB change streams) — без опроса таблиц. Pod приводит к
этому ресурсу Strimzi Cluster Operator. Config, offsets и status хранятся в topics брокера
(KafkaTopic nomnom-cdc-*, manifests/messaging/topics.yaml), сам Connect stateless.

Коннекторы — только ресурсы KafkaConnector charts контекстов (strimzi.io/use-connector-resources),
REST API для регистрации не используется. Пароли читает DirectoryConfigProvider из Secret
cdc-credentials (chart ../bootstrap): ${dir:/mnt/cdc:<ключ>}. Метрики — :9404 по
правилам files/metrics.yaml, их скрейпит Alloy (job infra/kafka-connect, label
app.kubernetes.io/name=kafka-connect ставит Strimzi).
*/ -}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: nomnom-infra
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  replicas: 1
  image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
  bootstrapServers: kafka-kafka-bootstrap.nomnom-infra.svc.cluster.local:9092
  groupId: nomnom-cdc
  configStorageTopic: nomnom-cdc-configs
  offsetStorageTopic: nomnom-cdc-offsets
  statusStorageTopic: nomnom-cdc-status
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    # Плагины по манифестам ServiceLoader (KIP-898) вместо сканирования всех классов
    # classgraph: скан — пик heap на старте выше 256MB.
    plugin.discovery: service_load
    config.providers: dir
    config.providers.dir.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
    config.providers.dir.param.allowed.paths: /mnt/cdc
  # Живых данных в heap ~70MB (jvm_memory_used_bytes, 2026-10-26). Serial GC и два процессора
  # для эргономики: без CPU limit JVM видит все ядра узла и заводит по ним потоки GC и JIT, а
  # Metaspace и code cache ничем не ограничены — RSS вдвое больше heap.
  jvmOptions:
    -Xms: 64m
    -Xmx: 256m
    -XX:
      UseSerialGC: "true"
      ActiveProcessorCount: "2"
      MaxMetaspaceSize: 128m
      ReservedCodeCacheSize: 64m
      MaxDirectMemorySize: 64m
      MinHeapFreeRatio: "10"
      MaxHeapFreeRatio: "30"
  resources:
    requests:
      memory: 384Mi
    limits:
      memory: 768Mi
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: kafka-connect-metrics
        key: metrics.yaml
  template:
    pod:
      volumes:
        - name: cdc-credentials
          secret:
            secretName: cdc-credentials
    connectContainer:
      env:
        # glibc по умолчанию держит до 8 malloc-арен на CPU: ~110 потоков JVM набирали >100 арен —
        # ~200MB RSS вне heap и OOMKilled на старте. Двух арен на процесс достаточно.
        - name: MALLOC_ARENA_MAX
          value: "2"
      # Strimzi монтирует дополнительные volumes только под /mnt.
      volumeMounts:
        - name: cdc-credentials
          mountPath: /mnt/cdc
          readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-metrics
  namespace: nomnom-infra
data:
  metrics.yaml: |-
{{ .Files.Get "files/metrics.yaml" | indent 4 }}
