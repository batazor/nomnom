# Учётные данные коннекторов Outbox (ADR 37) для Kafka Connect в nomnom-infra. Connect читает их
# DirectoryConfigProvider из смонтированного Secret: ${dir:/etc/nomnom/cdc:<ключ>}; в
# конфигурации коннекторов, которую регистрируют charts контекстов, паролей нет. ТОЛЬКО для kind:
# коннекторы работают под ролями владельцев баз (REPLICATION; pg_hba пускает логическую репликацию
# только в свою базу, templates/postgres.yaml), в production —
# отдельный пользователь с REPLICATION и SELECT на таблице Outbox.
{{- $data := dict }}
{{- range $owner := .Values.postgres.owners }}
{{- $password := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-data" "name" (printf "postgres-%s" $owner) "key" "password" "length" 48) }}
{{- $_ := set $data (printf "%s-password" $owner) ($password | b64enc) }}
{{- end }}
{{- $mongoPassword := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-data" "name" "mongodb-restaurants" "key" "root-password" "length" 48) }}
{{- $_ := set $data "restaurants-uri" (printf "mongodb://root:%s@mongodb-restaurants.nomnom-data.svc.cluster.local:27017/?replicaSet=rs0&authSource=admin" $mongoPassword | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: cdc-credentials
  namespace: nomnom-infra
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value }}
  {{- end }}
