# SpiceDB тестового окружения (ADR 18): memory datastore, schema и grants из authorization/
# (ConfigMap spicedb-bootstrap), Secret spicedb-preshared-key в nomnom-authz и в неймспейсах
# контекстов. После рестарта graph восстанавливается только из bootstrap.
{{- $schema := required "authz.schema: --set-file authz.schema=authorization/schema.zed" .Values.authz.schema }}
{{- $bootstrap := required "authz.bootstrap: --set-file authz.bootstrap=authorization/bootstrap.yaml" .Values.authz.bootstrap }}
{{- /* Grants только kind (ops/kind/authz/bootstrap-kind.yaml) дописываются в relationships
       общего bootstrap: SpiceDB загружает один файл, общий файл не меняется. */}}
{{- with .Values.authz.kindBootstrap }}
{{- $kind := fromYaml . }}
{{- $shared := fromYaml $bootstrap }}
{{- if or (hasKey $shared "Error") (hasKey $kind "Error") (not $shared.relationships) (not $kind.relationships) }}
{{- fail "authz.bootstrap and authz.kindBootstrap must be YAML with relationships" }}
{{- end }}
{{- $_ := set $shared "relationships" (printf "%s\n%s" (trimSuffix "\n" $shared.relationships) (trim $kind.relationships)) }}
{{- $bootstrap = toYaml $shared }}
{{- end }}
{{- $key := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-authz" "name" "spicedb-preshared-key" "key" "preshared-key" "length" 64) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spicedb-bootstrap
  namespace: nomnom-authz
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
data:
  schema.zed: {{ $schema | toJson }}
  bootstrap.yaml: {{ $bootstrap | toJson }}
{{- range $namespace := prepend .Values.contexts "authz" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: spicedb-preshared-key
  namespace: nomnom-{{ $namespace }}
  labels:
    {{- include "bootstrap.labels" $ | nindent 4 }}
type: Opaque
data:
  preshared-key: {{ $key | b64enc }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicedb
  namespace: nomnom-authz
  labels:
    app.kubernetes.io/name: spicedb
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spicedb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spicedb
      annotations:
        # Новый bootstrap применяется только при старте memory datastore: SpiceDB
        # перезапускается лишь при изменении schema/bootstrap, иначе повторный deploy стирал
        # бы relationships, записанные приложениями.
        nomnom.dev/bootstrap-checksum: {{ print $schema $bootstrap | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spicedb
          image: {{ .Values.images.spicedb }}
          args:
            - serve
            - --datastore-engine=memory
            - --datastore-bootstrap-files=bootstrap.yaml
            - --http-enabled=false
          workingDir: /authz
          env:
            - name: SPICEDB_GRPC_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: spicedb-preshared-key
                  key: preshared-key
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            grpc:
              port: 50051
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: bootstrap
              mountPath: /authz
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: spicedb-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: spicedb
  namespace: nomnom-authz
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spicedb
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
