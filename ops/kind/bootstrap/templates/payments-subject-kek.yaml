{{- /* Локальный ADR 2 payments: мастер-ключ ключей субъектов. lookup сохраняет значение при upgrade. */ -}}
{{- $kek := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-payments" "name" "payments-subject-kek" "key" "kek" "length" 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: payments-subject-kek
  namespace: nomnom-payments
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
type: Opaque
data:
  kek: {{ $kek | b64enc }}
