# Valkey delivery тестового окружения (FR-661, ADR 43): pub/sub потока позиций курьеров, не кеш —
# ключей нет, persistence не нужна. default-пользователь выключен. ACL-пользователь delivery
# только публикует в каналы delivery.tracks.*; bff (Cosmo Router, подписка courierMoved) только
# подписывается: Router подписывается через PSUBSCRIBE, а шаблон канала PSUBSCRIBE должен буквально
# совпадать с шаблоном ACL, поэтому у bff allchannels — публиковать он всё равно не может.
# Пароли — Secret valkey-delivery (nomnom-data), URL — Secret delivery-valkey (nomnom-delivery) и
# bff-tracks-valkey (nomnom-bff); значения сохраняются между deploy.
{{- $password := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-data" "name" "valkey-delivery" "key" "password" "length" 48) }}
{{- $bffPassword := include "bootstrap.secretValue" (dict "root" $ "namespace" "nomnom-data" "name" "valkey-delivery" "key" "bff-password" "length" 48) }}
{{- $host := "valkey-delivery.nomnom-data.svc.cluster.local:6379" }}
apiVersion: v1
kind: Secret
metadata:
  name: valkey-delivery
  namespace: nomnom-data
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc }}
  bff-password: {{ $bffPassword | b64enc }}
  # HELLO, CLIENT SETINFO/SETNAME и PING — handshake клиентов (redis-rs, go-redis).
  users.acl: {{ printf "user default off\nuser delivery on >%s resetkeys resetchannels &delivery.tracks.* -@all +publish +ping +hello +client|setinfo +client|setname\nuser bff on >%s resetkeys allchannels -@all +subscribe +psubscribe +unsubscribe +punsubscribe +ping +hello +client|setinfo +client|setname\n" $password $bffPassword | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: delivery-valkey
  namespace: nomnom-delivery
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ printf "redis://delivery:%s@%s" $password $host | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bff-tracks-valkey
  namespace: nomnom-bff
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ printf "redis://bff:%s@%s" $bffPassword $host | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-delivery
  namespace: nomnom-data
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: delivery
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: delivery
      annotations:
        # Новый ACL применяется перезапуском: aclfile читается при старте.
        checksum/acl: {{ printf "%s/%s" $password $bffPassword | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.images.valkey }}
          # Только pub/sub: без RDB и AOF, ключей нет.
          args:
            - valkey-server
            - --aclfile
            - /etc/valkey/users.acl
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 32mb
          ports:
            - name: valkey
              containerPort: 6379
          # default выключен: проверка без пароля — TCP.
          readinessProbe:
            tcpSocket:
              port: valkey
          livenessProbe:
            tcpSocket:
              port: valkey
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: acl
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: acl
          secret:
            secretName: valkey-delivery
            items:
              - key: users.acl
                path: users.acl
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-delivery
  namespace: nomnom-data
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: delivery
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
