# Values chart kind-bootstrap (ADR 34). Устанавливается before-hook helm-деплоера Skaffold
# (ops/kind/skaffold/skaffold.yaml) до charts приложений. Файлы вне chart передаются
# --set-file: authz.schema, authz.bootstrap, identity.idpJwks.

images:
  spicedb: authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd
  postgres: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
  pgbouncer: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:c96417dce3f7ee82a1cb6df65309ebb7efec0a449363c333c043e2fe0c636097
  mongodb: mongo:8.3.13@sha256:0e900a3364da37b76d642b73b0bba56bd4c6c509ab470cf700436fd866bee3ff
  # ADR 43: кеш чтения каталога restaurants.
  valkey: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
  # Job публикации JWKS: только stdlib Python, Kubernetes API вызывается напрямую.
  python: python:3.15.1-alpine3.24@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
  # ADR 35: OIDC provider входа в браузере. Не последний релиз: v2.46.1 зависает на первом
  # refresh_token grant (весь HTTP-сервер и проверка storage, memory и sqlite3; проверено
  # 2026-10-25), v2.45.1 проходит вход, обновление и отказ на повторный refresh token.
  dex: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
  # HTTP-раздача JWKS тестового identity provider (test-idp).
  busybox: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

# Неймспейсы bounded contexts: получают preshared key SpiceDB и JWKS (cluster-jwks, bff-jwks).
contexts:
  - orders
  - restaurants
  - delivery
  - payments
  - controlplane

# ADR 18: schema.zed и bootstrap.yaml из authorization/ (--set-file).
authz:
  schema: ""
  bootstrap: ""
  # Grants только kind из ops/kind/authz/bootstrap-kind.yaml (--set-file): их relationships
  # дописываются к relationships bootstrap. Пусто — bootstrap без изменений.
  kindBootstrap: ""

# ADR 8: владельцы баз одного сервера PostgreSQL (templates/postgres.yaml): у каждого своя роль и
# база. Пароль — Secret postgres-<owner> (nomnom-data), DSN — Secret <owner>-postgres
# (nomnom-<owner>, ключ dsn), DSN экспортеров Alloy (роль alloy) — Secret alloy-postgres.
postgres:
  owners:
    - orders
    - payments
    - delivery
    - controlplane
  # templates/pgbouncer.yaml, session mode: соединение клиента держит server-соединение. poolSize
  # базы — Σ(replicas × maxConns) всех процессов владельца, по 2 соединения миграций на процесс и
  # запас на rolling update. Сумма с Debezium и экспортерами помещается в max_connections сервера (100).
  pooler:
    maxClientConn: 200
    poolSize:
      orders: 32
      payments: 16
      delivery: 24
      controlplane: 10

identity:
  # ADR 27: issuer projected ServiceAccount tokens, ожидаемый values контекстов.
  issuer: https://kubernetes.default.svc.cluster.local
  # ADR 32: kid ключа user assertions; совпадает с identity.assertionKeyId в values/bff.yaml.
  bffKeyId: nomnom-bff-kind
  # JWKS тестового identity provider из tests/identity/fixtures/idp-jwks.json (--set-file);
  # раздаёт test-idp (templates/dex.yaml).
  idpJwks: ""

# ADR 35: Dex для входа в браузере (templates/dex.yaml). Браузер видит Dex через listener auth
# публичного gateway, без port-forward; issuer — этот адрес, браузер доверяет корню
# make kind-local-ca. Порт — host-порт gateway (WEBHOOKS_HOST_PORT, 18085): другой порт меняет и
# issuer здесь, в values/bff.yaml и values/ui.yaml. Customer UI — Vite dev server на localhost:4173 (4180 —
# второй dev server, когда 4173 занят, .claude/launch.json customer-ui-kind-login) и образ UI
# за публичным gateway (https://app.nomnom.localhost:18085, values/ui.yaml).
dex:
  issuer: https://auth.nomnom.localhost:18085/dex
  allowedOrigins:
    - http://localhost:4173
    - http://localhost:4180
    - https://app.nomnom.localhost:18085
  uiClientId: nomnom-ui
  uiRedirectURIs:
    - http://localhost:4173/auth/callback
    - http://localhost:4180/auth/callback
    - https://app.nomnom.localhost:18085/auth/callback
  # Audience access token: UI запрашивает scope audience:server:client_id:nomnom-bff, Dex
  # выдаёт его, потому что nomnom-bff доверяет nomnom-ui (trustedPeers).
  bffClientId: nomnom-bff
  tokenLifetime: 1h
  # Пользователи, пароль у всех nomnom (bcrypt). sub в tokens — не userID, а
  # base64url(protobuf{userID, "local"}), например ChFub21ub20tZGVtby1vd25lchIFbG9jYWw для
  # demo. Демо ведёт один пользователь: он покупатель, владелец ресторанов, их кухня и курьер.
  # Его sub — subject демо-данных (ops/kind/demo/files/seed.json, chart ops/kind/demo) и dev token issuer,
  # поэтому вход через Dex и demo-токены действуют от одного пользователя. userID
  # nomnom-demo-owner остался от прежнего владельца: рестораны в MongoDB записаны на него.
  users:
    - email: demo@nomnom.test
      username: demo
      userID: nomnom-demo-owner
      hash: $2y$10$oeFTwhqIb2WGgPVjAMtQN.lkMABy5mKxpUrRgnAS0jDhGqfjGIgyq
    - email: operator@nomnom.test
      username: operator
      userID: kind-operator
      hash: $2y$10$oeFTwhqIb2WGgPVjAMtQN.lkMABy5mKxpUrRgnAS0jDhGqfjGIgyq
