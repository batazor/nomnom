# Values тестового kind-окружения для chart boundaries/bff/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

# ADR 27: service identity BFF — nomnom-bff/bff; её разрешают allowlist и userDelegates
# orders, restaurants и delivery (values/orders.yaml, values/restaurants.yaml,
# values/delivery.yaml) и allowlist/placementReaders controlplane (values/controlplane.yaml).
serviceAccount:
  name: bff

# ADR 15: контексты вызываются только через internal gateway; egress BFF ограничен базовыми
# политиками неймспейса (manifests/netpol/app-baseline). Публикации наружу нет: проверка
# ops/kind/e2e/bff на время прогона открывает ingress к BFF из nomnom-outsider.
internalGateway:
  address: internal-gateway.envoy-gateway-system.svc.cluster.local:8080

# FR-623: новые курьеры встают в центре demo-ресторанов (ops/kind/demo/files/seed.json).
courierPool:
  startLatitude: "52.5255"
  startLongitude: "13.4015"

# ADR 41: Placement Map control plane кешируется в памяти BFF (BFF__PLACEMENT_TTL) и
# обновляется в фоне; неудачное обновление оставляет последнюю карту.
cellRouter:
  placementTTL: "30s"

# Router metrics без профиля grafana-cloud не экспортируются: Alloy нет (values/bff-grafana-cloud.yaml).
env:
  BFF__METRICS_OTLP_ENABLED: "false"

# ADR 36: Router читает orders.v1.order-changes для подписок orderChanged
# (egress — manifests/netpol/app-infrastructure.yaml).
kafka:
  brokers: kafka.nomnom-infra.svc.cluster.local:9092

# ADR 32, ADR 35. ТОЛЬКО для kind: два identity provider из chart ops/kind/bootstrap —
# Dex (вход в браузере, issuer — адрес port-forward на localhost) и тестовый test-idp
# (tests/identity/fixtures, ключ подписи лежит в репозитории; tokens выпускает
# scripts/mint-jwt.py для e2e). JWKS обоих читаются по адресам Service в nomnom-data. Ключ
# подписи user assertions (Secret bff-assertion-key) выпускает cert-manager один раз на
# кластер: ECDSA P-256 в PKCS#8, ключ tls.key, rotationPolicy Never (ADR 34).
identity:
  providers:
    - issuer: http://localhost:5556/dex
      jwksUrl: http://dex.nomnom-data.svc.cluster.local:5556/dex/keys
    - issuer: https://idp.nomnom.test
      jwksUrl: http://test-idp.nomnom-data.svc.cluster.local:8080/jwks.json
  idpAudience: nomnom-bff
  assertionKeySecret:
    name: bff-assertion-key
    key: tls.key
  assertionKeyId: nomnom-bff-kind
  tokenAudiences:
    - nomnom.orders
    - nomnom.restaurants
    - nomnom.delivery
    # ADR 41: Placement Map и Markets control plane (values/controlplane.yaml, placementReaders).
    - nomnom.controlplane

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). 
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
