# Values тестового kind-окружения для release orders-consumer chart boundaries/orders/ops/helm
# поверх values-consumer.yaml (ADR 12, ADR 28). image задаёт Skaffold (setValueTemplates).
image:
  pullPolicy: Never

env:
  KAFKA__BROKERS: kafka.nomnom-infra.svc.cluster.local:9092
  TEMPORAL__HOST_PORT: temporal.nomnom-infra.svc.cluster.local:7233
  TEMPORAL__NAMESPACE: default

# ADR 8: Inbox, Order и Outbox consumer'а — в PostgreSQL orders (Secret создаёт
# scripts/postgres.sh). Миграции выполняет init container release orders и этого release.
postgres:
  dsnSecret:
    name: orders-postgres
