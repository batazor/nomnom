# Values тестового kind-окружения для release orders-forwarder chart boundaries/orders/ops/helm
# поверх values-forwarder.yaml (ADR 12, ADR 13): Outbox orders → Kafka, один активный
# экземпляр. image задаёт Skaffold (setValueTemplates).
image:
  pullPolicy: Never

env:
  KAFKA__BROKERS: kafka.nomnom-infra.svc.cluster.local:9092
  # Kafka ClientID — service.name процесса (квоты и диагностика брокера).
  KAFKA__CLIENT_ID: orders-forwarder
  # Config orders требует адрес gateway при fulfillment neighbours "grpc" (по умолчанию) и
  # для migrate init container тоже: без него forwarder не стартует.
  INTERNAL_GATEWAY_ADDR: internal-gateway.envoy-gateway-system.svc.cluster.local:8080

# ADR 8, ADR 13: Outbox orders — в PostgreSQL orders (Secret создаёт scripts/postgres.sh).
postgres:
  dsnSecret:
    name: orders-postgres

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). Go: GOMEMLIMIT = 90% limit (automemlimit).
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi
