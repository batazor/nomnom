# Необязательное дополнение к values/payments.yaml: Stripe test mode вместо fake.
# Secret payments-stripe создаётся вручную, порядок действий — boundaries/payments/README.md,
# раздел «Stripe test mode». e2e и CI работают на fake и этот файл не используют.
config:
  spec:
    provider:
      kind: stripe

# Список заменяет extraEnv values/payments.yaml целиком, вместе с тестовым секретом webhooks.
extraEnv:
  - name: PROVIDER__STRIPE_API_KEY
    valueFrom:
      secretKeyRef:
        name: payments-stripe
        key: api-key
  - name: PROVIDER__WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: payments-stripe
        key: webhook-secret
