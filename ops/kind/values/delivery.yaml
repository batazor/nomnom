# Values тестового kind-окружения для chart boundaries/delivery/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

podLabels:
  # Pod предоставляет бизнес-API: ingress только от internal gateway (NetworkPolicy).
  nomnom.dev/business-api: "true"

env:
  # Единственный адрес для синхронных вызовов бизнес-API других приложений.
  INTERNAL_GATEWAY_ADDR: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
  # Демо Simulator курьеров (FR-606, FR-667): опрос, границы задержки действия и интервал
  # позиций движущихся курьеров.
  SIMULATOR__INTERVAL: 5s
  SIMULATOR__MIN_DELAY: 30s
  SIMULATOR__MAX_DELAY: 2m
  SIMULATOR__TRACK_INTERVAL: 1s
  # Live tracking (FR-658): Virtual City 12 × 12 кварталов по 150 м накрывает позиции курьеров
  # демо-данных (ops/kind/demo/files/seed.json) и стартовую точку курьеров BFF.
  TRACKING__CITY_ORIGIN_LATITUDE: "52.515"
  TRACKING__CITY_ORIGIN_LONGITUDE: "13.385"
  TRACKING__CITY_BLOCKS: "12"
  TRACKING__BLOCK_METERS: "150"
  TRACKING__PERSIST_INTERVAL: 15s
  # Kafka consumer собственных фактов Delivery для Delivery Duration Statistics (FR-676);
  # группа и начальный offset заданы в chart (values.yaml).
  KAFKA__BROKERS: kafka.nomnom-infra.svc.cluster.local:9092

# ADR 27: проверка projected ServiceAccount tokens по JWKS кластера (ConfigMap cluster-jwks
# публикует Job identity-jwks chart ops/kind/bootstrap) и allowlist вызывающих workloads.
identity:
  issuer: https://kubernetes.default.svc.cluster.local
  jwksConfigMap: cluster-jwks
  # bff — courier-экран (RPC курьера от имени пользователя). e2e-driver — fixture e2e пути
  # заказа (e2e/chart/templates/e2e-driver.yaml): играет оператора и курьера; demo-seed — Job демо-данных (chart ops/kind/demo). Только в kind:
  # chart-default его не содержит (AC-741).
  serviceAccounts: nomnom-orders/orders-worker=orders-worker,nomnom-bff/bff=bff,nomnom-bff/e2e-driver=e2e-driver,nomnom-bff/demo-seed=demo-seed
  # ADR 32: user assertions BFF (ConfigMap bff-jwks публикует Job identity-jwks chart ops/kind/bootstrap);
  # передавать user subject могут service bff и, только в kind, e2e-driver и demo-seed — их assertion
  # тест и Job подписывают тем же kind-ключом BFF.
  userJwksConfigMap: bff-jwks
  userIssuer: nomnom-bff
  userDelegates: bff,e2e-driver,demo-seed

# FR-661: Valkey потока позиций; Secret delivery-valkey (URL ACL-пользователя delivery) создаёт
# chart ops/kind/bootstrap.
valkey:
  urlSecret:
    name: delivery-valkey

# ADR 18: SpiceDB тестового окружения; Secret spicedb-preshared-key создаёт chart ops/kind/bootstrap.
spicedb:
  endpoint: spicedb.nomnom-authz.svc.cluster.local:50051
  insecure: true
  presharedKeySecret:
    name: spicedb-preshared-key

# FR-707: Create Delivery и ответы курьеров запускают и будят Assignment Workflow в Temporal
# dev server (manifests/messaging/infrastructure.yaml); исполняет его release delivery-worker.
temporal:
  hostPort: temporal.nomnom-infra.svc.cluster.local:7233
  namespace: default

# ADR 37: Outbox публикует коннектор Debezium delivery-outbox в Kafka Connect nomnom-infra;
# пароль Connect читает из Secret cdc-credentials (ключ delivery-password).
cdc:
  enabled: true
  connectUrl: http://kafka-connect.nomnom-infra.svc.cluster.local:8083
  database:
    hostname: postgres.nomnom-data.svc.cluster.local
    name: delivery
    user: delivery
    password: ${dir:/etc/nomnom/cdc:delivery-password}

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). 
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 128Mi
