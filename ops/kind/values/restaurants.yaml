# Values тестового kind-окружения для chart boundaries/restaurants/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

podLabels:
  # Pod предоставляет бизнес-API: ingress только от internal gateway (NetworkPolicy).
  nomnom.dev/business-api: "true"

env:
  # Единственный адрес для синхронных вызовов бизнес-API других приложений.
  INTERNAL_GATEWAY_ADDR: internal-gateway.envoy-gateway-system.svc.cluster.local:8080

# ADR 27: проверка projected ServiceAccount tokens по JWKS кластера (ConfigMap cluster-jwks
# создаёт scripts/identity-jwks.sh) и allowlist вызывающих workloads.
identity:
  issuer: https://kubernetes.default.svc.cluster.local
  jwksConfigMap: cluster-jwks
  # orders — API orders (каталог Place Order: GetRestaurant, GetMenu).
  serviceAccounts: nomnom-orders/orders-worker=orders-worker,nomnom-orders/orders=orders,nomnom-bff/bff=bff
  # ADR 32: user assertions BFF (ConfigMap bff-jwks создаёт scripts/bff-identity.sh);
  # передавать user subject может только service bff.
  userJwksConfigMap: bff-jwks
  userIssuer: nomnom-bff
  userDelegates: bff

# ADR 18: SpiceDB тестового окружения; Secret spicedb-preshared-key создаёт scripts/authz.sh.
spicedb:
  endpoint: spicedb.nomnom-authz.svc.cluster.local:50051
  insecure: true
  presharedKeySecret:
    name: spicedb-preshared-key

# ADR 8, ADR 31: MongoDB restaurants тестового окружения; Secret restaurants-mongodb создаёт scripts/mongodb.sh.
mongodb:
  uriSecret:
    name: restaurants-mongodb
