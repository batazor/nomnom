# Values тестового kind-окружения для chart boundaries/restaurants/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

podLabels:
  # Pod предоставляет бизнес-API: ingress только от internal gateway (NetworkPolicy).
  nomnom.dev/business-api: "true"

env:
  # Единственный адрес для синхронных вызовов бизнес-API других приложений.
  INTERNAL_GATEWAY_ADDR: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
  # Demo Simulator кухни (FR-606): обязательны, без default в коде.
  SIMULATOR__INTERVAL: 5s
  SIMULATOR__MIN_DELAY: 30s
  SIMULATOR__MAX_DELAY: 2m
  # Демо идёт в темпе Simulator (минуты, не десятки минут): базовое время ожидания, пока
  # выборка Wait Time Statistics не набрана (FR-645). Совпадает с restaurants-consumer.
  KITCHEN__PREPARATION_TIME: 1m
  # Wait Time Statistics (FR-645, FR-657): оценка в каталоге и expected_ready_at; те же значения у consumer.
  WAIT_TIME__SAMPLE_SIZE: "50"
  WAIT_TIME__RECENT_WINDOW: 30m
  WAIT_TIME__ELEVATED_FACTOR: "1.5"
  WAIT_TIME__NORMAL_FACTOR: "1.2"
  # Kitchen Queue (FR-241): обычный заказ после стольких базовых времён ожидания идёт с премиум-заказами.
  KITCHEN_QUEUE__AGING_FACTOR: "2"

# ADR 27: проверка projected ServiceAccount tokens по JWKS кластера (ConfigMap cluster-jwks
# публикует Job identity-jwks chart ops/kind/bootstrap) и allowlist вызывающих workloads.
identity:
  issuer: https://kubernetes.default.svc.cluster.local
  jwksConfigMap: cluster-jwks
  # orders — API orders (каталог Place Order: GetRestaurant, GetMenu). e2e-driver — fixture
  # e2e пути заказа (e2e/chart/templates/e2e-driver.yaml): играет оператора, владельца и кухню,
  # клиентов которых ещё нет; demo-seed — Job демо-данных (chart ops/kind/demo). Только в kind: chart-default его не содержит (AC-741).
  serviceAccounts: nomnom-orders/orders-worker=orders-worker,nomnom-orders/orders=orders,nomnom-bff/bff=bff,nomnom-bff/e2e-driver=e2e-driver,nomnom-bff/demo-seed=demo-seed
  # ADR 32: user assertions BFF (ConfigMap bff-jwks публикует Job identity-jwks chart ops/kind/bootstrap);
  # передавать user subject могут service bff и, только в kind, e2e-driver и demo-seed — их assertion
  # тест и Job подписывают тем же kind-ключом BFF.
  userJwksConfigMap: bff-jwks
  userIssuer: nomnom-bff
  userDelegates: bff,e2e-driver,demo-seed

# ADR 18: SpiceDB тестового окружения; Secret spicedb-preshared-key создаёт chart ops/kind/bootstrap.
spicedb:
  endpoint: spicedb.nomnom-authz.svc.cluster.local:50051
  insecure: true
  presharedKeySecret:
    name: spicedb-preshared-key

# ADR 8, ADR 31: MongoDB restaurants тестового окружения; Secret restaurants-mongodb создаёт chart ops/kind/bootstrap.
mongodb:
  uriSecret:
    name: restaurants-mongodb
  # Новый pod первые секунды живёт с identity init Cilium, пока label'ы не дошли до агента,
  # а ingress MongoDB ещё не знает его настоящую identity: SYN отбрасываются. 5s server
  # selection не переживали этого при выкатке (restart consumer, 2026-10-27); 20s — с запасом
  # в бюджете startupProbe (60s).
  timeout: 20s

# ADR 37: Outbox доставляет Debezium в Kafka Connect nomnom-infra. URI replica set Connect читает
# из Secret cdc-credentials (ключ restaurants-uri) через DirectoryConfigProvider.
cdc:
  enabled: true
  connect:
    cluster: kafka-connect
    namespace: nomnom-infra
  schemaRegistryUrl: http://schema-registry.nomnom-infra.svc.cluster.local:8081
  connectionString: ${dir:/mnt/cdc:restaurants-uri}

# ADR 43: кеш чтения каталога; Secret restaurants-valkey (URL ACL-пользователя restaurants)
# создаёт chart ops/kind/bootstrap.
valkey:
  urlSecret:
    name: restaurants-valkey

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). Node: V8 heap и native память внутри limit.
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 512Mi
