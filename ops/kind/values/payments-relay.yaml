# Values тестового kind-окружения для release payments-relay chart boundaries/payments/ops/helm
# поверх values-relay.yaml (ADR 31). image задаёт Skaffold (setValueTemplates).
image:
  pullPolicy: Never

env:
  KAFKA__BROKERS: kafka.nomnom-infra.svc.cluster.local:9092
  KAFKA__CLIENT_ID: payments-relay

database:
  urlSecret:
    name: payments-postgres

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). 
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 384Mi
