# Values тестового kind-окружения для release orders-worker chart boundaries/orders/ops/helm
# поверх values-worker.yaml (ADR 12): Order Fulfillment Workflow. image задаёт Skaffold
# (setValueTemplates). ServiceAccount nomnom-orders/orders-worker допущен allowlist restaurants,
# delivery и payments (values/restaurants.yaml, values/delivery.yaml, values/payments.yaml);
# projected tokens этих audiences задаёт values-worker.yaml.
image:
  pullPolicy: Never

# ADR 8: состояние Order Fulfillment — в PostgreSQL orders (Secret создаёт chart ops/kind/bootstrap).
postgres:
  dsnSecret:
    name: orders-postgres

config:
  spec:
    # Activities вызывают restaurants, delivery и payments только через internal gateway.
    internalGateway:
      address: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
    # Temporal dev server (manifests/messaging/infrastructure.yaml): файл worker'а, Connection и
    # WorkerDeployment. Dev server держит namespace в памяти: Search Attribute стадии workflow
    # создаёт сам worker при старте, иначе он не стартует.
    temporal:
      hostPort: temporal.nomnom-infra.svc.cluster.local:7233
      namespace: default
      registerSearchAttributes: true

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). Go: GOMEMLIMIT = 90% limit (automemlimit).
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi
