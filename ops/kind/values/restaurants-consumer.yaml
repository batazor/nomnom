# Values тестового kind-окружения для release restaurants-consumer chart
# boundaries/restaurants/ops/helm поверх values-consumer.yaml (ADR 11, ADR 28).
# image задаёт Skaffold (setValueTemplates).
image:
  pullPolicy: Never

env:
  KAFKA__BROKERS: kafka.nomnom-infra.svc.cluster.local:9092
  # Wait Time Statistics (FR-645, FR-657): уровень ожидания считает consumer; значения
  # совпадают с release restaurants, иначе каталог и уровень разойдутся.
  KITCHEN__PREPARATION_TIME: 1m
  WAIT_TIME__SAMPLE_SIZE: "50"
  WAIT_TIME__RECENT_WINDOW: 30m
  WAIT_TIME__ELEVATED_FACTOR: "1.5"
  WAIT_TIME__NORMAL_FACTOR: "1.2"

# ADR 8, ADR 31: Inbox и Restaurant Orders — в MongoDB restaurants; Secret restaurants-mongodb
# создаёт chart ops/kind/bootstrap, коллекции и индексы процесс мигрирует сам при старте.
mongodb:
  uriSecret:
    name: restaurants-mongodb
  # Новый pod первые секунды живёт с identity init Cilium, пока label'ы не дошли до агента,
  # а ingress MongoDB ещё не знает его настоящую identity: SYN отбрасываются. 5s server
  # selection не переживали этого при выкатке (restart consumer, 2026-10-27); 20s — с запасом
  # в бюджете startupProbe (60s).
  timeout: 20s

# ADR 43: обновление кеша каталога; Secret restaurants-valkey создаёт chart ops/kind/bootstrap.
valkey:
  urlSecret:
    name: restaurants-valkey

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). Node: V8 heap и native память внутри limit.
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 512Mi
