# Values тестового kind-окружения для chart boundaries/orders/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

podLabels:
  # Pod предоставляет бизнес-API: ingress только от internal gateway (NetworkPolicy).
  nomnom.dev/business-api: "true"

# ADR 27: проверка projected ServiceAccount tokens по JWKS кластера (ConfigMap cluster-jwks
# публикует Job identity-jwks chart ops/kind/bootstrap). ADR 32: user assertions BFF (ConfigMap
# bff-jwks публикует тот же Job). Каталог Place Order читает GetRestaurant и GetMenu restaurants
# через gateway с projected token audience nomnom.restaurants (spec.identity.tokenDir).
identity:
  jwksConfigMap: cluster-jwks
  userJwksConfigMap: bff-jwks
  tokenAudiences:
    - nomnom.restaurants

# ADR 18: Secret spicedb-preshared-key создаёт chart ops/kind/bootstrap.
spicedb:
  presharedKeySecret:
    name: spicedb-preshared-key

# ADR 8: PostgreSQL orders тестового окружения; Secret orders-postgres создаёт chart ops/kind/bootstrap.
postgres:
  dsnSecret:
    name: orders-postgres

config:
  spec:
    # Единственный адрес для синхронных вызовов бизнес-API других приложений.
    internalGateway:
      address: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
    # Place Order и Request Order Cancellation обращаются к fulfillment workflow; client
    # lazy, поэтому старт API от Temporal не зависит.
    temporal:
      hostPort: temporal.nomnom-infra.svc.cluster.local:7233
      namespace: default
    # Demo customer Simulator (FR-605): покупатель — демо-пользователь demo@nomnom.test
    # (sub Dex, ops/kind/bootstrap/values.yaml); включается переключателем «Эмулятор».
    simulator:
      interval: 5s
      minDelay: 30s
      maxDelay: 2m
      customerId: ChFub21ub20tZGVtby1vd25lchIFbG9jYWw
      # ADR 41: Market демо-покупателя — berlin из ops/kind/demo/files/seed.json.
      marketIds: berlin
    identity:
      issuer: https://kubernetes.default.svc.cluster.local
      # grpc-caller — фикстура проверок (e2e/chart/templates/probes.yaml): допущенный
      # workload, но не делегат; с ним проверяется отказ assertion от чужого workload.
      serviceAccounts: nomnom-bff/bff=bff,nomnom-bff/grpc-caller=grpc-caller
      userIssuer: nomnom-bff
      # Передавать user subject может только service bff.
      userDelegates: bff
    # ADR 18: SpiceDB тестового окружения.
    spicedb:
      endpoint: spicedb.nomnom-authz.svc.cluster.local:50051
      insecure: true

# Burstable без CPU limit: request — доля CPU под конкуренцией, limit троттлит и при
# свободной ноде. Memory request — steady state в kind, limit — пик e2e (Chainsaw, 54 теста)
# с запасом не меньше 3× (замер kubelet stats/summary 2026-10-25). Go: GOMEMLIMIT = 90% limit (automemlimit).
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

# ADR 37: коннектор Debezium orders-outbox (Outbox → Kafka из WAL) — ресурс KafkaConnector этого
# release. Пароль Kafka Connect читает из Secret cdc-credentials (chart ../bootstrap).
cdc:
  enabled: true
  connect:
    cluster: kafka-connect
    namespace: nomnom-infra
  schemaRegistryUrl: http://schema-registry.nomnom-infra.svc.cluster.local:8081
  database:
    hostname: postgres.nomnom-data.svc.cluster.local
    name: orders
    user: orders
    password: ${dir:/mnt/cdc:orders-password}
