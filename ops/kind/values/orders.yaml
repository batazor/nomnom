# Values тестового kind-окружения для chart boundaries/orders/ops/helm (ADR 12).
# image.repository и image.tag задаёт Skaffold (setValueTemplates) тегом локальной сборки.
image:
  # Образ загружен через kind load; Never гарантирует запуск именно собранной версии.
  pullPolicy: Never

podLabels:
  # Pod предоставляет бизнес-API: ingress только от internal gateway (NetworkPolicy).
  nomnom.dev/business-api: "true"

env:
  # Единственный адрес для синхронных вызовов бизнес-API других приложений.
  INTERNAL_GATEWAY_ADDR: internal-gateway.envoy-gateway-system.svc.cluster.local:8080
  # Traces → приёмник проверок kind (manifests/observability/trace-capture.yaml); metrics
  # по-прежнему уходят только в Alloy профиля grafana-cloud.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://trace-capture.nomnom-observability.svc.cluster.local:4317
  # Place Order и Request Order Cancellation обращаются к fulfillment workflow; client
  # lazy, поэтому старт API от Temporal не зависит.
  TEMPORAL__HOST_PORT: temporal.nomnom-infra.svc.cluster.local:7233
  TEMPORAL__NAMESPACE: default

# ADR 27: проверка projected ServiceAccount tokens по JWKS кластера (ConfigMap cluster-jwks
# публикует Job identity-jwks chart ops/kind/bootstrap) и allowlist вызывающих workloads.
identity:
  issuer: https://kubernetes.default.svc.cluster.local
  jwksConfigMap: cluster-jwks
  # grpc-caller — фикстура проверок (manifests/fixtures/net-probe.yaml): допущенный
  # workload, но не делегат; с ним проверяется отказ assertion от чужого workload.
  serviceAccounts: nomnom-bff/bff=bff,nomnom-bff/grpc-caller=grpc-caller
  # Каталог Place Order читает GetRestaurant и GetMenu restaurants через gateway с
  # projected token audience nomnom.restaurants (IDENTITY__TOKEN_DIR).
  tokenAudiences:
    - nomnom.restaurants
  # ADR 32: user assertions BFF (ConfigMap bff-jwks публикует Job identity-jwks chart ops/kind/bootstrap);
  # передавать user subject может только service bff.
  userJwksConfigMap: bff-jwks
  userIssuer: nomnom-bff
  userDelegates: bff

# ADR 18: SpiceDB тестового окружения; Secret spicedb-preshared-key создаёт chart ops/kind/bootstrap.
spicedb:
  endpoint: spicedb.nomnom-authz.svc.cluster.local:50051
  insecure: true
  presharedKeySecret:
    name: spicedb-preshared-key

# ADR 8: PostgreSQL orders тестового окружения; Secret orders-postgres создаёт chart ops/kind/bootstrap.
postgres:
  dsnSecret:
    name: orders-postgres
