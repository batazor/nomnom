# Values профиля grafana-cloud поверх values окружения для releases orders и orders-consumer:
# OTLP метрик в Alloy (manifests/observability/alloy.yaml). service.name задаёт процесс.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.nomnom-observability.svc.cluster.local:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=kind
  # Free tier Grafana Cloud считает data points per minute: одна точка на series в минуту.
  OTEL_METRIC_EXPORT_INTERVAL: "60000"
