# Git Sync (Grafana 13): repository nomnom = source of truth для overview-dashboard restaurants.
# Read-only (workflows: []): единственный writer — генератор ops/grafana; правки в UI запрещены.
# Доступ к GitHub (token или GitHub App connection) передаётся при создании через secure-поля,
# в репозиторий не коммитится. Применение: gcx resources push -p ops/grafana/git-sync/restaurants.yaml
apiVersion: provisioning.grafana.app/v1beta1
kind: Repository
metadata:
  name: nomnom-restaurants
spec:
  title: nomnom / Restaurants
  description: Overview-dashboard bounded context restaurants (boundaries/restaurants/ops/grafana/dashboards).
  type: github
  github:
    url: https://github.com/batazor/nomnom
    branch: main
    path: boundaries/restaurants/ops/grafana/dashboards
    generateDashboardPreviews: false
  sync:
    enabled: true
    target: folder
    intervalSeconds: 300
  workflows: []
