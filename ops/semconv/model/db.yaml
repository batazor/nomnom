# Метрики раздела db инвентаря ops/grafana/inventory, которых нет в semconv
# db.client.connection.*. Проверка: make semconv-check.
groups:
  - id: metric.nomnom.db.client.connection.pool.clears
    type: metric
    metric_name: nomnom.db.client.connection.pool.clears
    stability: development
    brief: "Connection pool clears: the driver marked the server unhealthy and closed the connections of its pool."
    instrument: counter
    unit: "{clear}"
    attributes:
      - ref: db.client.connection.pool.name
        requirement_level: required
