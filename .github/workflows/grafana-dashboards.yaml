# Dashboards as code (ADR 29): генератор и артефакты не расходятся, PromQL и lint проходят.
# Как и ci.yaml (ADR 30), запускается только вручную; источник истины — локальный `make grafana-check`.
name: grafana-dashboards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ops/grafana/go.mod
          cache-dependency-path: ops/grafana/go.sum
      - run: make grafana-tools
      - run: make grafana-check
