# Assertions of user permission paths over example relationships (zed validate only;
# never loaded into SpiceDB). Grants of deployment live in bootstrap.yaml.
schemaFile: schema.zed
relationships: |-
  order:example-order#customer@user:example-customer
  order:example-order#restaurant@restaurant:example-restaurant
  order:example-order#delivery@delivery:example-delivery
  customer:example-customer#self@user:example-customer
  restaurant:example-restaurant#owner@user:example-owner
  restaurant:example-restaurant#staff@user:example-cook
  courier:example-courier#self@user:example-courier
  delivery:example-delivery#courier@user:example-courier
  order:example-closed-order#customer@user:example-customer
  order:example-closed-order#delivery@delivery:example-closed-delivery
  platform:nomnom#operator@user:example-operator
  platform:nomnom#dispatcher@user:example-dispatcher
assertions:
  assertTrue:
    - order:example-order#view@user:example-customer
    - order:example-order#cancel@user:example-customer
    - order:example-order#view@user:example-owner
    - order:example-order#view@user:example-cook
    - order:example-order#view@user:example-courier
    - customer:example-customer#view_orders@user:example-customer
    - restaurant:example-restaurant#manage@user:example-owner
    - restaurant:example-restaurant#operate_kitchen@user:example-owner
    - restaurant:example-restaurant#operate_kitchen@user:example-cook
    - restaurant:example-restaurant#manage_menu@user:example-cook
    # AC-775: owner and staff manage the Cook Pool.
    - restaurant:example-restaurant#manage_cooks@user:example-owner
    - restaurant:example-restaurant#manage_cooks@user:example-cook
    # FR-620: operators and dispatchers manage the Courier Pool.
    - platform:nomnom#manage_couriers@user:example-operator
    - platform:nomnom#manage_couriers@user:example-dispatcher
    # Operators and dispatchers offer a delivery to a courier they chose.
    - platform:nomnom#offer_delivery@user:example-operator
    - platform:nomnom#offer_delivery@user:example-dispatcher
    - courier:example-courier#act@user:example-courier
    - delivery:example-delivery#act_as_courier@user:example-courier
    # AC-695: the platform operator dispatches deliveries.
    - platform:nomnom#dispatch_delivery@user:example-operator
    # AC-761: only the platform operator switches the Simulator.
    - platform:nomnom#operate_simulator@user:example-operator
    # ADR 41: only the platform operator registers Cells and creates Markets.
    - platform:nomnom#manage_markets@user:example-operator
  assertFalse:
    - order:example-order#view@user:example-stranger
    - order:example-order#cancel@user:example-owner
    - order:example-order#cancel@user:example-courier
    - restaurant:example-restaurant#manage@user:example-cook
    - delivery:example-delivery#act_as_courier@user:example-owner
    - courier:example-courier#act@user:example-cook
    # AC-517: a courier without delivery#courier of the order's delivery
    # (closed or never assigned) does not see the order.
    - order:example-closed-order#view@user:example-courier
    - order:example-closed-order#view@user:example-operator
    # AC-695: neither a courier nor a stranger dispatches deliveries.
    - platform:nomnom#dispatch_delivery@user:example-courier
    - platform:nomnom#dispatch_delivery@user:example-stranger
    - platform:nomnom#operate_simulator@user:example-customer
    - platform:nomnom#operate_simulator@user:example-owner
    # AC-777: a stranger does not manage the Cook Pool.
    - restaurant:example-restaurant#manage_cooks@user:example-stranger
    # AC-791: neither a courier nor a stranger manages the Courier Pool.
    - platform:nomnom#manage_couriers@user:example-courier
    - platform:nomnom#manage_couriers@user:example-stranger
    - platform:nomnom#offer_delivery@user:example-courier
    - platform:nomnom#offer_delivery@user:example-stranger
    - platform:nomnom#operate_simulator@user:example-dispatcher
    - platform:nomnom#manage_markets@user:example-dispatcher
    - platform:nomnom#manage_markets@user:example-owner
